<canvas id="c"></canvas>
<script>
// ─── VERSION ────────────────────────────────────────────────────────────────
const VERSION='v2.1.0';

// ─── FIREBASE CONFIG ─────────────────────────────────────────────────────────
// 1. Go to https://console.firebase.google.com
// 2. Create project → Realtime Database → Create database → Test mode
// 3. Copy your database URL below (looks like https://YOUR-PROJECT-default-rtdb.europe-west1.firebasedatabase.app)
const FB_URL = 'https://dust-devils-rally-default-rtdb.europe-west1.firebasedatabase.app'; // ← PASTE YOUR FIREBASE URL HERE

// ─── GLOBAL LEADERBOARD ──────────────────────────────────────────────────────
let globalScores = null;   // null = not loaded yet
let scoresLoading = false;
let scoresError   = false;

async function fbSaveScore(entry) {
  if (!FB_URL) return;
  try {
    await fetch(FB_URL + '/scores.json', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        name: entry.name.substring(0,12),
        time: Math.round(entry.time * 100) / 100,
        pos:  entry.pos,
        car:  entry.car,
        ts:   Date.now()
      })
    });
  } catch(e) { console.warn('Score upload failed:', e); }
}

async function fbLoadScores() {
  if (!FB_URL) { globalScores = []; return; }
  scoresLoading = true; scoresError = false;
  try {
    const r = await fetch(FB_URL + '/scores.json');
    const data = await r.json();
    globalScores = data
      ? Object.values(data)
          .filter(s => s && typeof s.time === 'number' && s.name)
          .sort((a,b) => a.time - b.time)
          .slice(0, 15)
      : [];
  } catch(e) {
    console.warn('Score load failed:', e);
    scoresError = true;
    globalScores = [];
  }
  scoresLoading = false;
}

// ─── CANVAS ─────────────────────────────────────────────────────────────────
const C=document.getElementById('c'),G=C.getContext('2d');
let CW,CH;
function resize(){CW=C.width=innerWidth;CH=C.height=innerHeight;}
resize();window.addEventListener('resize',resize);
if(!G.roundRect)G.roundRect=function(x,y,w,h){this.rect(x,y,w,h);};

// ─── CAR DEFINITIONS ────────────────────────────────────────────────────────
const CAR_DEFS=[
  {id:'banger', name:'BANGER',      price:0,    col:'#4477ff',col2:'#1a3a88', grip:.88, top:370, acc:310, nos:1.0, body:'std',  desc:'Free starter. Solid all-rounder.'},
  {id:'turbo',  name:'TURBO HATCH', price:500,  col:'#ff3322',col2:'#881100', grip:.91, top:420, acc:370, nos:1.1, body:'low',  desc:'Fast & grippy. Great handling.'},
  {id:'rally',  name:'RALLY BEAST', price:1500, col:'#22bb55',col2:'#0d6630', grip:.84, top:490, acc:410, nos:1.2, body:'tall', desc:'Off-road king. Huge top speed.'},
  {id:'drift',  name:'DRIFT KING',  price:2000, col:'#ffaa00',col2:'#885500', grip:.70, top:450, acc:345, nos:1.0, body:'wide', desc:'Slide sideways. Stylish chaos.'},
  {id:'muscle', name:'MUSCLE CAR',  price:3000, col:'#cc44ff',col2:'#660088', grip:.78, top:540, acc:450, nos:1.3, body:'long', desc:'Brute power. Fastest on straights.'},
];

// ─── SAVE / LOAD ─────────────────────────────────────────────────────────────
let S={coins:0,unlocked:['banger'],selected:'banger',name:'',scores:[]};
function loadSave(){try{const d=localStorage.getItem('ddr_v2');if(d)Object.assign(S,JSON.parse(d));}catch(e){}}
function doSave(){try{localStorage.setItem('ddr_v2',JSON.stringify(S));}catch(e){}}
loadSave();

// ─── NAME SCREEN ─────────────────────────────────────────────────────────────
const NS=document.getElementById('nscreen');
const NF=document.getElementById('nfield');
document.getElementById('nbtn').addEventListener('click',()=>{
  const n=NF.value.trim().toUpperCase();
  if(!n)return;
  S.name=n;doSave();NS.style.display='none';NF.blur();initAudio();
});
NF.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('nbtn').click();});
if(!S.name)NS.style.display='flex';

// ─── AUDIO ───────────────────────────────────────────────────────────────────
let AC,engOsc,engGain,scrSrc,scrGain;
function initAudio(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function beep(f,d,v=0.22,t='square'){
  if(!AC)return;if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(v,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.start();o.stop(AC.currentTime+d+.02);
}
function startEngine(){
  if(!AC||engOsc)return;
  engOsc=AC.createOscillator();engGain=AC.createGain();
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=450;
  engOsc.type='sawtooth';engOsc.connect(f);f.connect(engGain);engGain.connect(AC.destination);
  engGain.gain.value=.028;engOsc.frequency.value=80;engOsc.start();
}
function updateEngine(sp,top){
  if(!engOsc)startEngine();if(!engOsc)return;
  const t=Math.min(1,Math.abs(sp)/top);
  engOsc.frequency.value=65+t*220;
  engGain.gain.value=.022+t*.032;
}
function stopEngine(){if(engOsc){try{engOsc.stop();}catch(e){}engOsc=null;engGain=null;}}
let _scr=false;
function setScreech(on){
  if(on===_scr)return;_scr=on;
  if(!AC)return;
  if(on){
    const buf=AC.createBuffer(1,AC.sampleRate*.15,AC.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    scrSrc=AC.createBufferSource();scrSrc.buffer=buf;scrSrc.loop=true;
    scrGain=AC.createGain();
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;f.Q.value=1.8;
    scrSrc.connect(f);f.connect(scrGain);scrGain.connect(AC.destination);
    scrGain.gain.value=.07;scrSrc.start();
  }else{if(scrSrc){try{scrSrc.stop();}catch(e){}scrSrc=null;}}
}

// ─── TRACK ───────────────────────────────────────────────────────────────────
const RAW=[
  {x:450,y:880},{x:760,y:880},{x:1060,y:880},
  {x:1310,y:760},{x:1490,y:540},{x:1530,y:300},
  {x:1380,y:140},{x:1120,y:130},{x:870,y:100},
  {x:620,y:155},{x:390,y:290},{x:250,y:490},
  {x:220,y:710},{x:310,y:840},
];
const RSTEPS=18,TW=100;
function cr(a,b,c,d,t){
  const t2=t*t,t3=t2*t;
  return{
    x:.5*((2*b.x)+(-a.x+c.x)*t+(2*a.x-5*b.x+4*c.x-d.x)*t2+(-a.x+3*b.x-3*c.x+d.x)*t3),
    y:.5*((2*b.y)+(-a.y+c.y)*t+(2*a.y-5*b.y+4*c.y-d.y)*t2+(-a.y+3*b.y-3*c.y+d.y)*t3)
  };
}
function buildSpline(raw,st){
  const n=raw.length,out=[];
  for(let i=0;i<n;i++){
    const a=raw[(i-1+n)%n],b=raw[i],c=raw[(i+1)%n],d=raw[(i+2)%n];
    for(let j=0;j<st;j++)out.push(cr(a,b,c,d,j/st));
  }
  return out;
}
const TRK=buildSpline(RAW,RSTEPS),TN=TRK.length;
function nearD2(x,y){let m=Infinity;for(let i=0;i<TN;i++){const dx=TRK[i].x-x,dy=TRK[i].y-y,d=dx*dx+dy*dy;if(d<m)m=d;}return m;}
function tProg(x,y){let m=Infinity,mi=0;for(let i=0;i<TN;i++){const dx=TRK[i].x-x,dy=TRK[i].y-y,d=dx*dx+dy*dy;if(d<m){m=d;mi=i;}}return mi/TN;}

// ─── SCENERY ─────────────────────────────────────────────────────────────────
// Seeded PRNG for consistent tree placement
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const RNG=mulberry32(1337);
const TREES=[];
for(let i=0;i<130;i++){
  const x=60+RNG()*1620,y=20+RNG()*960;
  if(nearD2(x,y)>(TW+48)*(TW+48))TREES.push({x,y,r:8+RNG()*12,g:Math.floor(RNG()*3)});
}
const MRKS=[];
for(let i=0;i<TN;i+=14){
  const t=TRK[i],n=TRK[(i+1)%TN];
  let dx=n.x-t.x,dy=n.y-t.y,ln=Math.sqrt(dx*dx+dy*dy)||1;dx/=ln;dy/=ln;
  const nx=-dy,ny=dx;
  MRKS.push({lx:t.x+nx*TW,ly:t.y+ny*TW,rx:t.x-nx*TW,ry:t.y-ny*TW,alt:Math.floor(i/14)%2});
}

// ─── CAR CLASS ───────────────────────────────────────────────────────────────
const LAPS=3;
class Car{
  constructor(x,y,a,defId,isP){
    this.x=x;this.y=y;this.a=a;
    this.def=CAR_DEFS.find(c=>c.id===defId)||CAR_DEFS[0];
    this.isP=isP;
    this.sp=0;this.vx=0;this.vy=0;
    this.nos=isP?100:55;this.lap=0;
    this.pp=0;this.mid=false;
    this.aiI=0;this.aiM=.68+Math.random()*.28;
    this.off=false;this.total=0;
    this.nosFlame=0;this.driftAng=0;this.isDrifting=false;
    this.wentOffTrack=false;this.lapStart=0;
    this.skidTrail=[];
  }
  spd(){return Math.sqrt(this.vx*this.vx+this.vy*this.vy);}

  upd(dt,L,R,B,N,rT){
    const def=this.def;
    if(this.isP){
      const mx=(N&&this.nos>0)?def.top*def.nos:def.top;
      this.sp=Math.min(this.sp+def.acc*dt,mx);
      if(B)this.sp=Math.max(this.sp-490*dt,-55);
      const tr=3.2*Math.min(1,Math.abs(this.sp)/110);
      if(L)this.a-=tr*dt;if(R)this.a+=tr*dt;
      if(N&&this.nos>0){this.nos=Math.max(0,this.nos-52*dt);this.nosFlame=1;}
      else{this.nos=Math.min(100,this.nos+11*dt);this.nosFlame=Math.max(0,this.nosFlame-.1);}
    }else{
      const wp=TRK[this.aiI];
      const dx=wp.x-this.x,dy=wp.y-this.y,dist=Math.sqrt(dx*dx+dy*dy);
      const want=Math.atan2(dx,-dy);
      let diff=want-this.a;
      while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
      this.a+=Math.sign(diff)*Math.min(Math.abs(diff),3.2*dt);
      if(dist<95)this.aiI=(this.aiI+9)%TN;
      this.sp+=(320*this.aiM-this.sp)*2.2*dt;
    }

    // Drift physics: blend velocity toward heading
    const desVX=Math.sin(this.a)*this.sp, desVY=-Math.cos(this.a)*this.sp;
    const gf=1-Math.pow(1-def.grip,dt*60);
    this.vx+=(desVX-this.vx)*gf;
    this.vy+=(desVY-this.vy)*gf;

    // Off-track: much stronger slowdown
    this.off=nearD2(this.x,this.y)>TW*TW;
    if(this.off){
      this.wentOffTrack=true;
      const pen=Math.pow(.06,dt);
      this.sp*=pen;this.vx*=pen;this.vy*=pen;
    }

    this.x+=this.vx*dt;this.y+=this.vy*dt;

    // Drift angle
    const velA=Math.atan2(this.vx,-this.vy);
    let da=velA-this.a;
    while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
    this.driftAng=da;
    this.isDrifting=Math.abs(da)>.16&&Math.abs(this.sp)>90;

    // Skid trail (store world positions)
    if(this.isDrifting&&Math.abs(this.sp)>100){
      this.skidTrail.push({x:this.x,y:this.y,a:Date.now()});
      if(this.skidTrail.length>120)this.skidTrail.shift();
    }

    // Lap counting
    const prog=tProg(this.x,this.y);
    if(this.pp<.4&&prog>=.4)this.mid=true;
    if(this.mid&&this.pp>.85&&prog<.15){
      const lapT=rT-this.lapStart;this.lapStart=rT;
      this.lap++;this.mid=false;
      if(this.isP){beep(660,.08);setTimeout(()=>beep(880,.2),100);}
    }
    this.pp=prog;this.total=this.lap+prog;
  }

  draw(cx,cam,SC){
    const sx=(this.x-cam.x)*SC+CW/2,sy=(this.y-cam.y)*SC+CH/2;
    const def=this.def;
    const sw=17*SC,sh=30*SC;

    // Skid trail
    if(this.skidTrail.length>1){
      const now=Date.now();
      for(let i=1;i<this.skidTrail.length;i++){
        const p=this.skidTrail[i],q=this.skidTrail[i-1];
        const age=(now-p.a)/3000;
        if(age>1)continue;
        cx.globalAlpha=(1-age)*.22;cx.strokeStyle='#3a2a10';
        cx.lineWidth=SC*5;cx.lineCap='round';
        cx.beginPath();
        cx.moveTo((q.x-cam.x)*SC+CW/2,(q.y-cam.y)*SC+CH/2);
        cx.lineTo((p.x-cam.x)*SC+CW/2,(p.y-cam.y)*SC+CH/2);
        cx.stroke();
      }
      cx.globalAlpha=1;
    }

    cx.save();cx.translate(sx,sy);cx.rotate(this.a);
    cx.globalAlpha=.18;cx.fillStyle='#000';
    cx.beginPath();cx.ellipse(1.5,2.5,sw*.65,sh*.26,0,0,Math.PI*2);cx.fill();cx.globalAlpha=1;

    // Body shape varies by car type
    const bw=def.body==='wide'?sw*1.15:def.body==='long'?sw*.88:sw;
    const bh=def.body==='tall'?sh*1.08:def.body==='low'?sh*.9:sh;
    cx.fillStyle=def.col;cx.beginPath();cx.roundRect(-bw/2,-bh/2,bw,bh,2.5);cx.fill();
    // Roof
    cx.fillStyle='rgba(0,0,0,.44)';cx.beginPath();cx.roundRect(-bw*.3,-bh*.26,bw*.6,bh*.36,1.5);cx.fill();
    // Stripe
    cx.fillStyle='rgba(255,255,255,.11)';cx.fillRect(-bw*.09,-bh/2,bw*.18,bh);
    // Headlights
    cx.fillStyle='#ffe87a';
    cx.fillRect(-bw/2,-bh/2,bw*.28,3.5);cx.fillRect(bw/2-bw*.28,-bh/2,bw*.28,3.5);
    // Taillights
    cx.fillStyle='#ff3333';
    cx.fillRect(-bw/2,bh/2-3.5,bw*.28,3.5);cx.fillRect(bw/2-bw*.28,bh/2-3.5,bw*.28,3.5);
    // Spoiler on drift/muscle
    if(def.body==='wide'||def.body==='long'){
      cx.fillStyle=def.col2;
      cx.fillRect(-bw*.52,bh/2-1,bw*1.04,2.5);
      cx.fillRect(-bw*.52,bh/2+1.5,bw*.1,6);cx.fillRect(bw*.42,bh/2+1.5,bw*.1,6);
    }
    // Hood scoop on muscle/rally
    if(def.body==='long'||def.body==='tall'){
      cx.fillStyle='rgba(0,0,0,.35)';cx.fillRect(-bw*.12,-bh*.45,bw*.24,bh*.22);
    }
    // NOS flame
    if(this.isP&&this.nosFlame>.05){
      const fl=this.nosFlame*bh*.45+4;
      cx.globalAlpha=this.nosFlame*.75;cx.fillStyle='#44aaff';
      cx.beginPath();cx.moveTo(-bw*.16,bh/2);cx.lineTo(0,bh/2+fl);cx.lineTo(bw*.16,bh/2);cx.fill();
      cx.globalAlpha=.4;cx.fillStyle='#fff';
      cx.beginPath();cx.moveTo(-bw*.07,bh/2);cx.lineTo(0,bh/2+fl*.5);cx.lineTo(bw*.07,bh/2);cx.fill();
      cx.globalAlpha=1;
    }
    cx.restore();

    // Drift smoke
    if(this.isDrifting&&Math.random()<.45)
      addDust(this.x-Math.sin(this.a)*8,this.y+Math.cos(this.a)*8,'rgba(210,200,185,.8)',1);

    // Player name tag
    if(this.isP&&S.name){
      const tx=(this.x-cam.x)*SC+CW/2,ty=(this.y-cam.y)*SC+CH/2-(bh*.7+8);
      cx.fillStyle='rgba(255,255,255,.65)';cx.font='7px monospace';cx.textAlign='center';
      cx.fillText(S.name,tx,ty);
    }
  }
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
let parts=[];
function addDust(x,y,c,n=2){
  for(let i=0;i<n;i++)
    parts.push({x,y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,l:.55,m:.55,r:2.5+Math.random()*3,c});
}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.93;p.vy*=.93;p.l-=dt;
    if(p.l<=0)parts.splice(i,1);
  }
}
function drawParts(cx,cam,SC){
  for(const p of parts){
    const a=p.l/p.m,sx=(p.x-cam.x)*SC+CW/2,sy=(p.y-cam.y)*SC+CH/2;
    cx.globalAlpha=a*.42;cx.fillStyle=p.c;
    cx.beginPath();cx.arc(sx,sy,p.r*a+.8,0,Math.PI*2);cx.fill();
  }
  cx.globalAlpha=1;
}

// ─── COLLISIONS ──────────────────────────────────────────────────────────────
function doCollisions(){
  const R=20;
  for(let i=0;i<cars.length;i++){
    for(let j=i+1;j<cars.length;j++){
      const a=cars[i],b=cars[j];
      const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<R*2&&dist>.1){
        const nx=dx/dist,ny=dy/dist,ov=R*2-dist;
        a.x-=nx*ov*.5;a.y-=ny*ov*.5;b.x+=nx*ov*.5;b.y+=ny*ov*.5;
        const rvx=b.vx-a.vx,rvy=b.vy-a.vy,rvn=rvx*nx+rvy*ny;
        if(rvn<0){
          const imp=rvn*.55;
          a.vx+=imp*nx;a.vy+=imp*ny;
          b.vx-=imp*nx;b.vy-=imp*ny;
          // Sync scalar speed
          a.sp=a.vx*Math.sin(a.a)-a.vy*Math.cos(a.a);
          b.sp=b.vx*Math.sin(b.a)-b.vy*Math.cos(b.a);
          beep(110+Math.random()*70,.13,.28,'sawtooth');
          // Sparks
          const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
          for(let k=0;k<5;k++)addDust(mx,my,'#ffcc44',1);
        }
      }
    }
  }
}

// ─── SCALE ───────────────────────────────────────────────────────────────────
function getScale(){
  let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
  for(const p of TRK){xn=Math.min(xn,p.x);xx=Math.max(xx,p.x);yn=Math.min(yn,p.y);yx=Math.max(yx,p.y);}
  return Math.min(CH/(yx-yn+TW*2),CW/(xx-xn+TW*2))*(CW>CH?.9:.45);
}

// ─── DRAW TRACK ──────────────────────────────────────────────────────────────
function drawTrack(cx,cam,SC){
  cx.fillStyle='#3a7228';cx.fillRect(0,0,CW,CH);
  cx.save();cx.translate(CW/2-cam.x*SC,CH/2-cam.y*SC);cx.scale(SC,SC);
  // Trees
  const treeC=['#276820','#388030','#1e541a'];
  for(const t of TREES){
    cx.fillStyle=treeC[t.g];
    cx.beginPath();cx.arc(t.x,t.y,t.r*1.25,0,Math.PI*2);cx.fill();
    cx.fillStyle=treeC[(t.g+1)%3];
    cx.beginPath();cx.arc(t.x-t.r*.18,t.y-t.r*.18,t.r,0,Math.PI*2);cx.fill();
  }
  function tp(){cx.beginPath();cx.moveTo(TRK[0].x,TRK[0].y);for(let i=1;i<TN;i++)cx.lineTo(TRK[i].x,TRK[i].y);cx.closePath();}
  cx.lineJoin='round';cx.lineCap='round';
  tp();cx.strokeStyle='#604520';cx.lineWidth=TW*2+22;cx.stroke();
  tp();cx.strokeStyle='#b87840';cx.lineWidth=TW*2;cx.stroke();
  tp();cx.strokeStyle='#cc9060';cx.lineWidth=TW*2-28;cx.stroke();
  tp();cx.strokeStyle='rgba(70,40,15,.15)';cx.lineWidth=20;cx.stroke();
  cx.setLineDash([22,30]);
  tp();cx.strokeStyle='rgba(255,240,160,.18)';cx.lineWidth=2.5;cx.stroke();
  cx.setLineDash([]);
  for(const m of MRKS){
    cx.fillStyle=m.alt?'#cc1111':'#eee';
    cx.beginPath();cx.arc(m.lx,m.ly,5,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(m.rx,m.ry,5,0,Math.PI*2);cx.fill();
  }
  // Start/finish checker
  const t0=TRK[0],t1=TRK[1];
  let fx=t1.x-t0.x,fy=t1.y-t0.y,fl=Math.sqrt(fx*fx+fy*fy)||1;fx/=fl;fy/=fl;
  const fnx=-fy,fny=fx;
  for(let k=0;k<8;k++){
    const f0=-TW+(k*TW*2/8),f1=f0+TW*2/8;
    cx.fillStyle=k%2===0?'#fff':'#222';
    cx.beginPath();
    cx.moveTo(t0.x+fnx*f0,t0.y+fny*f0);cx.lineTo(t0.x+fnx*f1,t0.y+fny*f1);
    cx.lineTo(t0.x+fnx*f1+fx*10,t0.y+fny*f1+fy*10);cx.lineTo(t0.x+fnx*f0+fx*10,t0.y+fny*f0+fy*10);
    cx.fill();
  }
  cx.restore();
}

// ─── MINIMAP ─────────────────────────────────────────────────────────────────
function drawMinimap(cx){
  const land=CW>CH,mw=land?90:76,mh=land?74:62,mx=CW-mw-10,my=land?56:12;
  cx.save();
  cx.fillStyle='rgba(0,0,0,.52)';cx.beginPath();cx.roundRect(mx,my,mw,mh,5);cx.fill();
  cx.strokeStyle='rgba(255,255,255,.14)';cx.lineWidth=1;cx.stroke();
  let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
  for(const p of TRK){xn=Math.min(xn,p.x);xx=Math.max(xx,p.x);yn=Math.min(yn,p.y);yx=Math.max(yx,p.y);}
  const ms=Math.min(mw/(xx-xn),mh/(yx-yn))*.82;
  const ox=mx+(mw-(xx-xn)*ms)/2,oy=my+(mh-(yx-yn)*ms)/2;
  const tp=p=>({x:ox+(p.x-xn)*ms,y:oy+(p.y-yn)*ms});
  cx.beginPath();let pt=tp(TRK[0]);cx.moveTo(pt.x,pt.y);
  for(const p of TRK){pt=tp(p);cx.lineTo(pt.x,pt.y);}
  cx.closePath();cx.strokeStyle='#b87840';cx.lineWidth=4.5;cx.stroke();
  for(const c of cars){const cp=tp(c);cx.fillStyle=c.isP?'#fff':c.def.col;cx.beginPath();cx.arc(cp.x,cp.y,c.isP?3.5:2.5,0,Math.PI*2);cx.fill();}
  cx.restore();
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────
let ctrlL=false,ctrlR=false,ctrlB=false,ctrlN=false;
const AT={};
function ctrlLayout(){
  const land=CW>CH;
  return land
    ?{lz:{x:0,y:0,w:CW*.25,h:CH},rz:{x:CW*.75,y:0,w:CW*.25,h:CH},nos:{x:CW-64,y:CH-70,r:32},brk:{x:CW-64,y:CH-142,r:26}}
    :{lz:{x:0,y:CH*.3,w:CW*.38,h:CH*.7},rz:{x:CW*.62,y:CH*.3,w:CW*.38,h:CH*.7},nos:{x:CW/2,y:CH-55,r:32},brk:{x:CW/2,y:CH-120,r:26}};
}
function updCtrl(){
  ctrlL=ctrlR=ctrlB=ctrlN=false;
  const lay=ctrlLayout();
  for(const id in AT){
    const {x,y}=AT[id];
    if(Math.hypot(x-lay.nos.x,y-lay.nos.y)<lay.nos.r){ctrlN=true;continue;}
    if(Math.hypot(x-lay.brk.x,y-lay.brk.y)<lay.brk.r){ctrlB=true;continue;}
    const lz=lay.lz,rz=lay.rz;
    if(x>=lz.x&&x<lz.x+lz.w&&y>=lz.y)ctrlL=true;
    if(x>=rz.x&&x<rz.x+rz.w&&y>=rz.y)ctrlR=true;
  }
}
function drawCtrl(cx){
  const lay=ctrlLayout(),land=CW>CH;
  const {lz,rz}=lay;
  cx.fillStyle=`rgba(255,255,255,${ctrlL?.07:.02})`;cx.fillRect(lz.x,lz.y,lz.w,lz.h);
  cx.fillStyle=`rgba(255,255,255,${ctrlR?.07:.02})`;cx.fillRect(rz.x,rz.y,rz.w,rz.h);
  const ly=land?CH*.62:lz.y+lz.h*.52;
  cx.strokeStyle=`rgba(255,255,255,${ctrlL?.8:.28})`;cx.lineWidth=2.2;
  cx.beginPath();cx.moveTo(lz.x+lz.w*.5+16,ly-10);cx.lineTo(lz.x+lz.w*.5-16,ly);cx.lineTo(lz.x+lz.w*.5+16,ly+10);cx.stroke();
  const ry=land?CH*.62:rz.y+rz.h*.52;
  cx.strokeStyle=`rgba(255,255,255,${ctrlR?.8:.28})`;
  cx.beginPath();cx.moveTo(rz.x+rz.w*.5-16,ry-10);cx.lineTo(rz.x+rz.w*.5+16,ry);cx.lineTo(rz.x+rz.w*.5-16,ry+10);cx.stroke();
  cx.fillStyle=`rgba(255,255,255,${ctrlL?.6:.18})`;cx.font='8px monospace';cx.textAlign='center';cx.fillText('STEER',lz.x+lz.w*.5,ly+24);
  cx.fillStyle=`rgba(255,255,255,${ctrlR?.6:.18})`;cx.fillText('STEER',rz.x+rz.w*.5,ry+24);
  // NOS
  const nos=lay.nos,nA=ctrlN&&cars[0]&&cars[0].nos>0;
  cx.beginPath();cx.arc(nos.x,nos.y,nos.r,0,Math.PI*2);
  cx.fillStyle=nA?'rgba(20,100,255,.72)':'rgba(0,55,185,.28)';cx.fill();
  cx.strokeStyle=nA?'#66ccff':'rgba(80,140,255,.38)';cx.lineWidth=2;cx.stroke();
  cx.fillStyle=nA?'#fff':'rgba(140,190,255,.58)';cx.font='bold 10px monospace';cx.textAlign='center';cx.fillText('NOS',nos.x,nos.y+4);
  // BRK
  const brk=lay.brk;
  cx.beginPath();cx.arc(brk.x,brk.y,brk.r,0,Math.PI*2);
  cx.fillStyle=ctrlB?'rgba(255,70,0,.7)':'rgba(180,60,0,.22)';cx.fill();
  cx.strokeStyle=ctrlB?'#ff8844':'rgba(255,120,80,.32)';cx.lineWidth=1.5;cx.stroke();
  cx.fillStyle=ctrlB?'#fff':'rgba(255,160,120,.5)';cx.font='bold 9px monospace';cx.fillText('BRK',brk.x,brk.y+3);
  if(state==='racing'&&raceT<3.5){const al=1-raceT/3.5;cx.globalAlpha=al;cx.fillStyle='rgba(255,220,100,1)';cx.font='11px monospace';cx.textAlign='center';cx.fillText('Touch left/right edges to steer',CW/2,CH-10);cx.globalAlpha=1;}
}

  }else{
    const sc=S.scores.slice(0,Math.min(12,Math.floor((CH-startY-10)/rowH)));
    if(!sc.length){cx.fillStyle='rgba(255,255,255,.38)';cx.font='13px monospace';cx.textAlign='center';cx.fillText('No local races yet!',CW/2,CH/2);return;}
    sc.forEach((s,i)=>{
      const y=startY+i*rowH,mc=['#ffdd22','#aaaaaa','#cc8844'][i]||'rgba(255,255,255,.55)';
      const mm=Math.floor(s.time/60),sec=String(Math.floor(s.time%60)).padStart(2,'0'),ms=String(Math.floor((s.time%1)*100)).padStart(2,'0');
      const sfx=['ST','ND','RD'][s.pos-1]||'TH';
      cx.fillStyle=mc;cx.font=(i<3?'bold ':'')+String(i<3?13:12)+'px monospace';
      cx.textAlign='left';cx.fillText((i+1)+'. '+s.name,22,y);
      cx.textAlign='right';cx.fillText(mm+':'+sec+'.'+ms+'  '+s.pos+sfx,CW-12,y);
      cx.fillStyle='rgba(255,255,255,.07)';cx.fillRect(12,y+rowH*.7,CW-24,1);
    });
  }
}

function leaderboardClick(mx,my){
  if(mx<90&&my<52){state='menu';return;}
  if(my>=41&&my<=77){
    if(mx>=CW/2-77&&mx<=CW/2+4){lbTab=0;if(!scoresLoading&&(!globalScores||scoresError))fbLoadScores();}
    if(mx>=CW/2+4&&mx<=CW/2+77)lbTab=1;
  }
  if(lbTab===0&&mx>=CW-58&&mx<=CW-12&&my>=58&&my<=76){globalScores=null;fbLoadScores();}
}

// ─── SCREENS: RESULTS ────────────────────────────────────────────────────────
let resCoins=0,resReasons=[];
function drawResults(cx){
  cx.fillStyle='rgba(0,0,0,.78)';cx.fillRect(0,0,CW,CH);
  cx.textAlign='center';
  cx.fillStyle='#ffee22';cx.font='bold 26px monospace';cx.fillText('RACE FINISHED!',CW/2,CH*.18);
  const sorted=[...cars].sort((a,b)=>b.total-a.total),pos=sorted.indexOf(cars[0])+1,sfx=['ST','ND','RD'][pos-1]||'TH';
  cx.fillStyle='#fff';cx.font='20px monospace';cx.fillText('You finished '+pos+sfx+'!',CW/2,CH*.3);
  const m=Math.floor(raceT/60),s=String(Math.floor(raceT%60)).padStart(2,'0'),ms=String(Math.floor((raceT%1)*100)).padStart(2,'0');
  cx.fillStyle='#88ffaa';cx.font='16px monospace';cx.fillText('Time: '+m+':'+s+'.'+ms,CW/2,CH*.4);
  cx.fillStyle='#ffdd22';cx.font='bold 20px monospace';cx.fillText('+ $'+resCoins+' coins',CW/2,CH*.51);
  cx.fillStyle='rgba(255,255,255,.45)';cx.font='11px monospace';
  resReasons.forEach((r,i)=>cx.fillText(r,CW/2,CH*.59+i*17));
  // Two buttons
  [[CW/2-105,'RACE AGAIN'],[CW/2+15,'MAIN MENU']].forEach(([bx,lbl])=>{
    cx.fillStyle='rgba(255,255,255,.1)';cx.beginPath();cx.roundRect(bx,CH*.8-18,100,34,5);cx.fill();
    cx.strokeStyle='rgba(255,255,255,.28)';cx.lineWidth=1;cx.stroke();
    cx.fillStyle='rgba(255,255,255,.8)';cx.font='bold 11px monospace';cx.textAlign='center';cx.fillText(lbl,bx+50,CH*.8+2);
  });
}
function resultsClick(mx,my){
  if(my>CH*.76){if(mx<CW/2)startRace();else state='menu';}
}

// ─── RACE SETUP ──────────────────────────────────────────────────────────────
let state='menu',cdN=3,cdT=0,raceT=0,cam={x:TRK[0].x,y:TRK[0].y},cars=[];

function setupRace(){
  const t0=TRK[0],t1=TRK[1];
  let dx=t1.x-t0.x,dy=t1.y-t0.y,ln=Math.sqrt(dx*dx+dy*dy)||1;dx/=ln;dy/=ln;
  const nx=-dy,ny=dx,sa=Math.atan2(t1.x-t0.x,-(t1.y-t0.y));
  const pl=new Car(t0.x,t0.y,sa,S.selected,true);
  const aiPool=['turbo','rally','drift','muscle','banger'].filter(id=>id!==S.selected);
  const a1=new Car(t0.x-dx*52+nx*26,t0.y-dy*52+ny*26,sa,aiPool[0]);
  const a2=new Car(t0.x-dx*52-nx*26,t0.y-dy*52-ny*26,sa,aiPool[1]);
  a1.aiI=6;a2.aiI=10;
  return{pl,a1,a2,cam:{x:t0.x,y:t0.y}};
}
function startRace(){
  const g=setupRace();cars=[g.pl,g.a1,g.a2];cam=g.cam;
  parts=[];cdN=3;cdT=0;raceT=0;state='countdown';
  beep(440,.12);
}
function finishRace(){
  stopEngine();setScreech(false);
  const sorted=[...cars].sort((a,b)=>b.total-a.total),pos=sorted.indexOf(cars[0])+1;
  const base=[200,120,70][pos-1]||50;
  let earned=base;resReasons=[`${pos}${['ST','ND','RD'][pos-1]||'TH'} place: +$${base}`];
  if(!cars[0].wentOffTrack){earned+=40;resReasons.push('Clean race bonus: +$40');}
  if(raceT<110&&pos===1){earned+=60;resReasons.push('Speed bonus: +$60');}
  S.coins+=earned;resCoins=earned;
  const scoreEntry={name:S.name||'ANON',time:raceT,pos,car:S.selected};
  S.scores.push(scoreEntry);
  fbSaveScore(scoreEntry);  // save to global leaderboard
  S.scores.sort((a,b)=>a.time-b.time);S.scores=S.scores.slice(0,10);
  doSave();state='results';
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
C.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  for(const t of e.changedTouches)AT[t.identifier]={x:t.clientX,y:t.clientY};
  const t=e.changedTouches[0];
  if(state==='menu')menuClick(t.clientX,t.clientY);
  else if(state==='garage')garageClick(t.clientX,t.clientY);
  else if(state==='leaderboard')leaderboardClick(t.clientX,t.clientY);
  else if(state==='results')resultsClick(t.clientX,t.clientY);
  updCtrl();
},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)delete AT[t.identifier];updCtrl();},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)AT[t.identifier]={x:t.clientX,y:t.clientY};updCtrl();},{passive:false});
C.addEventListener('click',e=>{
  initAudio();
  if(state==='menu')menuClick(e.clientX,e.clientY);
  else if(state==='garage')garageClick(e.clientX,e.clientY);
  else if(state==='leaderboard')leaderboardClick(e.clientX,e.clientY);
  else if(state==='results')resultsClick(e.clientX,e.clientY);
});
window.addEventListener('keydown',e=>{
  initAudio();
  if(e.key==='ArrowLeft'||e.key==='a')ctrlL=true;
  if(e.key==='ArrowRight'||e.key==='d')ctrlR=true;
  if(e.key==='ArrowDown'||e.key==='s')ctrlB=true;
  if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();ctrlN=true;}
  if(state==='menu'){
    if(e.key==='ArrowDown')menuSel=(menuSel+1)%3;
    if(e.key==='ArrowUp')menuSel=(menuSel+2)%3;
    if(e.key==='Enter'){if(menuSel===0)startRace();else if(menuSel===1)state='garage';else{state='leaderboard';lbTab=0;if(!scoresLoading&&(!globalScores||scoresError))fbLoadScores();}}
  }
  if((state==='garage'||state==='leaderboard')&&(e.key==='Escape'||e.key==='Backspace'))state='menu';
  if(state==='results'){if(e.key==='Enter')startRace();if(e.key==='Escape')state='menu';}
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')ctrlL=false;
  if(e.key==='ArrowRight'||e.key==='d')ctrlR=false;
  if(e.key==='ArrowDown'||e.key==='s')ctrlB=false;
  if(e.key===' '||e.key==='ArrowUp')ctrlN=false;
});

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let lastT=0;
function loop(now){
  const dt=Math.min((now-lastT)/1000,.05);lastT=now;
  const SC=getScale();
  G.clearRect(0,0,CW,CH);

  if(state==='menu'){drawMenu(G);}
  else if(state==='garage'){drawGarage(G);}
  else if(state==='leaderboard'){drawTrack(G,{x:TRK[0].x,y:TRK[0].y},SC);drawLeaderboard(G);}
  else if(state==='results'){drawTrack(G,cam,SC);drawResults(G);}
  else{
    if(state==='countdown'){
      cdT+=dt;
      if(cdT>=1){cdT=0;cdN--;beep(cdN>0?440*Math.pow(1.25,3-cdN):880,cdN>0?.15:.3);if(cdN<=0)state='racing';}
    }else if(state==='racing'){
      raceT+=dt;
      for(const c of cars){const p=c.isP;c.upd(dt,p?ctrlL:false,p?ctrlR:false,p?ctrlB:false,p?ctrlN:false,raceT);}
      doCollisions();updParts(dt);
      const pl=cars[0];
      if(Math.abs(pl.sp)>22&&Math.random()<.3)addDust(pl.x,pl.y,pl.off?'#c08040':'#c8a878');
      updateEngine(pl.sp,pl.def.top);
      setScreech(pl.isDrifting&&!pl.off);
      const la=70,tx=pl.x+Math.sin(pl.a)*la,ty=pl.y-Math.cos(pl.a)*la;
      cam.x+=(tx-cam.x)*.13;cam.y+=(ty-cam.y)*.13;
      if(pl.lap>=LAPS)finishRace();
    }
    drawTrack(G,cam,SC);drawParts(G,cam,SC);
    [...cars].sort((a,b)=>a.y-b.y).forEach(c=>c.draw(G,cam,SC));
    drawMinimap(G);drawHUD(G,cars[0]);drawCtrl(G);
    if(state==='countdown'){
      G.fillStyle='rgba(0,0,0,.3)';G.fillRect(0,0,CW,CH);
      G.textAlign='center';G.fillStyle='#ffee00';
      G.font=`bold ${Math.min(CW,CH)*.18}px monospace`;
      G.shadowColor='#ff8800';G.shadowBlur=18;
      G.fillText(cdN>0?String(cdN):'GO!',CW/2,CH*.52);G.shadowBlur=0;
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop);});
</script>
