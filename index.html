// ─── DAY/NIGHT/DUSK SYSTEM ───────────────────────────────────────────────────
function getTimeOfDay(){
  const h=new Date().getHours();
  if(h>=5&&h<7)   return {name:'dawn',   sky:'rgba(255,120,40,.35)',  stars:0.4};
  if(h>=7&&h<17)  return {name:'day',    sky:'rgba(135,206,235,.10)', stars:0};
  if(h>=17&&h<20) return {name:'dusk',   sky:'rgba(220,80,10,.40)',   stars:0.3};
  if(h>=20&&h<23) return {name:'evening',sky:'rgba(20,10,60,.60)',    stars:0.8};
  return                  {name:'night', sky:'rgba(5,5,25,.80)',      stars:1.0};
}
function drawTimeOverlay(cx){
  const tod=getTimeOfDay();
  cx.fillStyle=tod.sky; cx.fillRect(0,0,CW,CH);
  if(tod.stars>0){
    const rng=seededRng(42);
    const t=Date.now()*.0008;
    for(let i=0;i<80;i++){
      const sx=rng()*CW, sy=rng()*CH*.7;
      const flicker=Math.sin(t+i*1.3)*.4+0.6;
      const alpha=(tod.stars*flicker*(0.5+rng()*.5)).toFixed(2);
      const sz=rng()<.15?2.5:1.5;
      cx.fillStyle=`rgba(255,255,220,${alpha})`;
      cx.fillRect(sx,sy,sz,sz);
    }
  }
}

// ─── SPLINE MATH ─────────────────────────────────────────────────────────────
function crPt(a,b,c,d,t){
  const t2=t*t,t3=t2*t;
  return{
    x:.5*((2*b.x)+(-a.x+c.x)*t+(2*a.x-5*b.x+4*c.x-d.x)*t2+(-a.x+3*b.x-3*c.x+d.x)*t3),
    y:.5*((2*b.y)+(-a.y+c.y)*t+(2*a.y-5*b.y+4*c.y-d.y)*t2+(-a.y+3*b.y-3*c.y+d.y)*t3)
  };
}
function buildSpline(raw,steps){
  const n=raw.length,out=[];
  for(let i=0;i<n;i++){
    const a=raw[(i-1+n)%n],b=raw[i],c=raw[(i+1)%n],d=raw[(i+2)%n];
    for(let j=0;j<steps;j++) out.push(crPt(a,b,c,d,j/steps));
  }
  return out;
}
function seededRng(seed){
  let s=seed|0;
  return()=>{
    s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

// ─── ACTIVE TRACK STATE ───────────────────────────────────────────────────────
var TRK=[],TN=0,TW=100,TREES=[],MRKS=[],CP_GATES=[],ROCKS=[],FINISH_GATE=null,TDEF=null;

function nearD2(x,y){
  let m=Infinity;
  for(let i=0;i<TN;i++){const dx=TRK[i].x-x,dy=TRK[i].y-y,d=dx*dx+dy*dy;if(d<m)m=d;}
  return m;
}
function tProg(x,y){
  let m=Infinity,mi=0;
  for(let i=0;i<TN;i++){const dx=TRK[i].x-x,dy=TRK[i].y-y,d=dx*dx+dy*dy;if(d<m){m=d;mi=i;}}
  return mi/TN;
}
function getScale(menu=false){
  if(menu){
    let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
    for(const p of TRK){xn=Math.min(xn,p.x);xx=Math.max(xx,p.x);yn=Math.min(yn,p.y);yx=Math.max(yx,p.y);}
    return Math.min(CH/(yx-yn+TW*2.5),CW/(xx-xn+TW*2.5))*0.86;
  }
  return CW>CH?CH/520:CH/600;
}

function activateTrack(idx){
  idx=Math.min(Math.max(0,idx),ALL_TRACKS.length-1);
  TDEF=ALL_TRACKS[idx]; TW=TDEF.tw;
  TRK=buildSpline(TDEF.raw,TDEF.steps); TN=TRK.length;

  function nd(x,y){let m=Infinity;for(let i=0;i<TN;i++){const dx=TRK[i].x-x,dy=TRK[i].y-y,d=dx*dx+dy*dy;if(d<m)m=d;}return m;}

  // Trees
  TREES=[];
  const rt=seededRng(1337+idx*777);
  let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
  for(const p of TDEF.raw){xn=Math.min(xn,p.x);xx=Math.max(xx,p.x);yn=Math.min(yn,p.y);yx=Math.max(yx,p.y);}
  for(let i=0;i<160;i++){
    const x=xn-150+rt()*(xx-xn+300),y=yn-150+rt()*(yx-yn+300);
    if(nd(x,y)>(TW+55)*(TW+55)) TREES.push({x,y,r:7+rt()*13,g:Math.floor(rt()*3)});
  }

  // Rocks
  ROCKS=[];
  const rr=seededRng(9999+idx*555);
  for(let i=0;i<60;i++){
    const tp=TRK[Math.floor(rr()*TN)],a=rr()*Math.PI*2,dist=TW+16+rr()*50;
    const rx=tp.x+Math.cos(a)*dist,ry=tp.y+Math.sin(a)*dist;
    if(nd(rx,ry)>(TW+12)*(TW+12)) ROCKS.push({x:rx,y:ry,r:3+rr()*7});
  }

  // Corner markers
  MRKS=[];
  for(let i=0;i<TN;i+=12){
    const t=TRK[i],n=TRK[(i+1)%TN];
    let dx=n.x-t.x,dy=n.y-t.y,ln=Math.sqrt(dx*dx+dy*dy)||1;dx/=ln;dy/=ln;
    MRKS.push({lx:t.x-dy*TW,ly:t.y+dx*TW,rx:t.x+dy*TW,ry:t.y-dx*TW,alt:Math.floor(i/12)%2});
  }

  // Checkpoint gates — extend BEYOND track width so AI always triggers them
  CP_GATES=[.22,.44,.66,.88].map(fr=>{
    const i2=Math.floor(fr*TN),t=TRK[i2],n=TRK[(i2+1)%TN];
    let dx=n.x-t.x,dy=n.y-t.y,ln=Math.sqrt(dx*dx+dy*dy)||1;dx/=ln;dy/=ln;
    const hw=TW+30; // wider than track for robust detection
    return{cx:t.x,cy:t.y,nx:-dy,ny:dx,tdx:dx,tdy:dy,hw,
      lx:t.x-dy*hw,ly:t.y+dx*hw,rx:t.x+dy*hw,ry:t.y-dx*hw,fr};
  });

  // Finish line gate at track start
  const f0=TRK[0],f1=TRK[1];
  let fdx=f1.x-f0.x,fdy=f1.y-f0.y,fln=Math.sqrt(fdx*fdx+fdy*fdy)||1;fdx/=fln;fdy/=fln;
  const fhw=TW+30;
  FINISH_GATE={cx:f0.x,cy:f0.y,nx:-fdy,ny:fdx,tdx:fdx,tdy:fdy,hw:fhw,
    lx:f0.x-fdy*fhw,ly:f0.y+fdx*fhw,rx:f0.x+fdy*fhw,ry:f0.y-fdx*fhw};
}

let AC=null,_engNodes=null,scrSrc=null,_scrOn=false;

function initAudio(){
  if(!AC){ try{ AC=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume();
  bgmPlay(); // start music on first user interaction
}

function beep(freq,dur,vol=0.22,type='square'){
  if(!AC)return; if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.start();o.stop(AC.currentTime+dur+0.02);
}

function startEngine(){
  if(!AC||_engNodes)return;
  // Rich multi-oscillator engine: fundamental + 2nd harmonic + distortion
  const master=AC.createGain();
  const filt=AC.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=180; filt.Q.value=0.8;
  const filt2=AC.createBiquadFilter(); filt2.type='lowpass'; filt2.frequency.value=800;

  const o1=AC.createOscillator(); o1.type='sawtooth';  // engine fundamental
  const o2=AC.createOscillator(); o2.type='square';    // harmonic crunch
  const o3=AC.createOscillator(); o3.type='sawtooth';  // upper harmonic

  const g1=AC.createGain(),g2=AC.createGain(),g3=AC.createGain();
  g1.gain.value=0.5; g2.gain.value=0.18; g3.gain.value=0.08;

  o1.connect(g1); o2.connect(g2); o3.connect(g3);
  g1.connect(filt); g2.connect(filt); g3.connect(filt);
  filt.connect(filt2); filt2.connect(master); master.connect(AC.destination);
  master.gain.value=0.04;

  o1.frequency.value=80; o2.frequency.value=160; o3.frequency.value=240;
  o1.start();o2.start();o3.start();
  _engNodes={o1,o2,o3,g1,g2,g3,master,filt};
}

function updateEngine(sp,top){
  if(!_engNodes)startEngine(); if(!_engNodes)return;
  const t=Math.min(1,Math.abs(sp)/top);
  // Pitch rises with speed, with slight gear-step feel
  const gear=Math.floor(t*4);
  const gearT=(t*4)%1;
  const baseFreq=60+gear*35+gearT*30;
  _engNodes.o1.frequency.value=baseFreq;
  _engNodes.o2.frequency.value=baseFreq*2.01; // slight detune
  _engNodes.o3.frequency.value=baseFreq*3.02;
  _engNodes.master.gain.value=0.025+t*0.04;
  _engNodes.filt.frequency.value=150+t*400;
}

function stopEngine(){
  if(_engNodes){
    try{_engNodes.o1.stop();_engNodes.o2.stop();_engNodes.o3.stop();}catch(e){}
    _engNodes=null;
  }
}

function setScreech(on){
  if(on===_scrOn)return; _scrOn=on;
  if(!AC){_scrOn=false;return;}
  if(on){
    const buf=AC.createBuffer(1,AC.sampleRate*0.2,AC.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    scrSrc=AC.createBufferSource(); scrSrc.buffer=buf; scrSrc.loop=true;
    const g=AC.createGain(),f=AC.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=2600; f.Q.value=2;
    scrSrc.connect(f);f.connect(g);g.connect(AC.destination);
    g.gain.value=0.055; scrSrc.start();
  }else{
    if(scrSrc){try{scrSrc.stop();scrSrc.disconnect();}catch(e){}scrSrc=null;}
  }
}

function bgmFade(targetVol, ms=600){
  if(!bgmAudio) return;
  const start = bgmAudio.volume;
  const steps = 20;
  const interval = ms/steps;
  let i=0;
  const t = setInterval(()=>{
    i++;
    bgmAudio.volume = Math.max(0, start + (targetVol-start)*(i/steps));
    if(i>=steps){ bgmAudio.volume=targetVol; clearInterval(t); }
  }, interval);
}

// Simple SHA-256 for PIN verification (browser built-in)
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ─── DAILY CHALLENGES ─────────────────────────────────────────────────────────
const CHALLENGE_DEFS=[
  {id:'win',    desc:'Win a race',           reward:150, check:e=>e.pos===1},
  {id:'top2',   desc:'Finish top 2',         reward:80,  check:e=>e.pos<=2},
  {id:'clean',  desc:'Clean race (no walls)', reward:100, check:(e,car)=>!car.wentOff},
  {id:'pb',     desc:'Set a personal best',  reward:120, check:(e,car,isPB)=>isPB},
  {id:'race3',  desc:'Complete 3 races',     reward:90,  check:null}, // special
  {id:'nos',    desc:'Use NOS 5+ times',     reward:70,  check:null}, // special
  {id:'fast',   desc:'Lap under 35 seconds', reward:130, check:(e,car,isPB,lapT)=>lapT&&lapT<35},
];

function getDailySeed(){
  const d=new Date(); return d.getFullYear()*10000+d.getMonth()*100+d.getDate();
}
function getDailyChallenges(){
  const seed=getDailySeed();
  if(!S.challengeSeed||S.challengeSeed!==seed){
    // New day - pick 3 random challenges
    const rng=(n)=>{ let x=Math.sin(seed*9301+n*49297)*233280; return x-Math.floor(x); };
    const picks=[];
    const pool=[...CHALLENGE_DEFS];
    for(let i=0;i<3;i++){
      const idx=Math.floor(rng(i)*pool.length);
      picks.push({...pool[idx], done:false});
      pool.splice(idx,1);
    }
    S.challengeSeed=seed;
    S.challenges=picks;
    S.raceCount=S.raceCount||0;
    S.nosCount=S.nosCount||0;
    doSave();
  }
  return S.challenges||[];
}

function checkChallenges(entry, car, isPB, lapT){
  const ch=getDailyChallenges();
  let earned=0;
  ch.forEach(c=>{
    if(c.done) return;
    let pass=false;
    if(c.id==='race3'){ S.raceCount=(S.raceCount||0)+1; pass=S.raceCount>=3; }
    else if(c.id==='nos'){ S.nosCount=(S.nosCount||0)+(car._nosUses||0); pass=S.nosCount>=5; }
    else if(c.check) pass=c.check(entry,car,isPB,lapT);
    if(pass){ c.done=true; earned+=c.reward; }
  });
  if(earned>0){ S.coins+=earned; S.challenges=ch; doSave(); }
  return earned;
}

  {id:'bronze', name:'BRONZE',  icon:'🥉', minXP:0,    color:'#cd7f32'},
  {id:'silver', name:'SILVER',  icon:'🥈', minXP:500,  color:'#aaaaaa'},
  {id:'gold',   name:'GOLD',    icon:'🥇', minXP:1500, color:'#f0a500'},
  {id:'elite',  name:'ELITE',   icon:'💎', minXP:4000, color:'#44ddff'},
];
function getLeague(xp){ return LEAGUES.slice().reverse().find(l=>xp>=l.minXP)||LEAGUES[0]; }
function getNextLeague(xp){ return LEAGUES.find(l=>l.minXP>xp)||null; }
function updateLeague(){ S.league=getLeague(S.xp||0).id; }
function addXP(n){ S.xp=(S.xp||0)+n; updateLeague(); }

function checkDailyStreak(){
  const today=new Date().toISOString().slice(0,10);
  if(S.lastPlayDate===today) return;
  const yesterday=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(S.lastPlayDate===yesterday){ S.streak=(S.streak||0)+1; }
  else { S.streak=1; }
  S.lastPlayDate=today;
  // Streak bonus coins
  const bonus=Math.min(S.streak,7)*20;
  S.coins+=bonus;
  S.totalCoinsEarned=(S.totalCoinsEarned||0)+bonus;
  doSave();
  return bonus;
}

// ─── LEADERBOARD LOADER ───────────────────────────────────────────────────────
async function loadLbScores(){
  window._lbScores=window._lbScores||{};
  const tid=typeof lbTrack==='number'?lbTrack:parseInt(lbTrack)||0;
  const _localBest=S.bestTimes&&S.bestTimes[tid];
  const _localEntry=_localBest?[{name:S.name||'YOU',time:_localBest,pid:S.pid||'local',local:true}]:[];
  if(!FB_URL){ window._lbScores[tid]=_localEntry; return; }
  try {
    // Use REST API with orderBy track
    const url=FB_URL+'/scores_v2.json?orderBy=%22track%22&equalTo='+tid+'&limitToFirst=50';
    const r=await fetch(url);
    const d=await r.json();
    const rows=d?Object.values(d).filter(v=>v&&typeof v.time==='number'):[];
    // Merge local if pid not already present
    if(_localBest&&!rows.some(r=>r.pid&&r.pid===S.pid)) rows.push(..._localEntry);
    rows.sort((a,b)=>(a.time||99)-(b.time||99));
    window._lbScores[tid]=rows;
  } catch(e){
    console.warn('lb load failed',e);
    window._lbScores[tid]=_localEntry;
  }
}

const ACHIEVEMENTS=[
  {id:'first_win',   icon:'🏆', name:'First Blood',    desc:'Win your first race'},
  {id:'speed_demon', icon:'⚡', name:'Speed Demon',    desc:'Complete a lap under 20 seconds'},

  {id:'veteran',     icon:'🎖️', name:'Veteran',        desc:'Complete 25 races'},
  {id:'podium',      icon:'🥉', name:'Podium Regular', desc:'Finish top 3 ten times'},
];

function checkAchievements(raceData){
  if(!S.achievements) S.achievements={};
  const earned=[];
  ACHIEVEMENTS.forEach(a=>{
    if(S.achievements[a.id]) return;
    let unlocked=false;
    if(a.id==='first_win'&&raceData.pos===1) unlocked=true;
    if(a.id==='speed_demon'&&raceData.bestLap&&raceData.bestLap<20) unlocked=true;
    if(a.id==='collector'&&(S.unlocked||[]).length>=5) unlocked=true;
    if(a.id==='drift_king'&&raceData.driftBonus>=100) unlocked=true;
    if(a.id==='globetrotter'&&(S.racedTracks||new Set()).size>=5) unlocked=true;
    if(a.id==='nos_junkie'&&(S.nosCount||0)>=20) unlocked=true;
    if(a.id==='veteran'&&(S.totalRaces||0)>=25) unlocked=true;
    if(a.id==='podium'){
      S.podiumCount=(S.podiumCount||0)+(raceData.pos<=3?1:0);
      if(S.podiumCount>=10) unlocked=true;
    }
    if(unlocked){ S.achievements[a.id]=Date.now(); earned.push(a); }
  });
  // Track raced tracks
  if(!S.racedTracks) S.racedTracks=[];
  if(!S.racedTracks.includes(raceData.track)) S.racedTracks.push(raceData.track);
  if(earned.length) doSave();
  return earned;
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
let parts=[], driftPops=[];

function addDust(x,y,col,n=2){
  for(let i=0;i<n;i++)
    parts.push({x,y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,l:.55,m:.55,r:2.5+Math.random()*3,c:col});
}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=.93; p.vy*=.93; p.l-=dt;
    if(p.l<=0) parts.splice(i,1);
  }
}
function drawParts(cx,cam,SC){
  for(const p of parts){
    const a=p.l/p.m;
    cx.globalAlpha=a*0.42; cx.fillStyle=p.c;
    cx.beginPath(); cx.arc((p.x-cam.x)*SC+CW/2,(p.y-cam.y)*SC+CH/2,p.r*a+.8,0,Math.PI*2); cx.fill();
  }
  cx.globalAlpha=1;
}

  }

}

// ─── COLLISIONS ──────────────────────────────────────────────────────────────
function doCollisions(cars){
  const R=20;
  for(let i=0;i<cars.length;i++) for(let j=i+1;j<cars.length;j++){
    const a=cars[i], b=cars[j];
    const dx=b.x-a.x, dy=b.y-a.y, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<R*2 && dist>0.1){
      const nx=dx/dist, ny=dy/dist, ov=R*2-dist;
      a.x-=nx*ov*.5; a.y-=ny*ov*.5;
      b.x+=nx*ov*.5; b.y+=ny*ov*.5;
      const rvn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(rvn<0){
        const imp=rvn*0.55;
        a.vx+=imp*nx; a.vy+=imp*ny;
        b.vx-=imp*nx; b.vy-=imp*ny;
        a.sp=a.vx*Math.sin(a.a)-a.vy*Math.cos(a.a);
        b.sp=b.vx*Math.sin(b.a)-b.vy*Math.cos(b.a);
        // Only sound+shake when player involved, with cooldown
        if(a.isP||b.isP){
          beep(110+Math.random()*70,.13,.25,'sawtooth');
          if(camShake<0.4) camShake=1.2; // don't reset if already shaking
        }
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        for(let k=0;k<5;k++) addDust(mx,my,'#ffcc44',1);
      }
    }
  }
}

// ─── WEATHER SYSTEM ──────────────────────────────────────────────────────────
// Track weather: 0=clear, 1=rain, 2=dusty, 3=overcast
const TRACK_WEATHER=[0,1,2,0,1,0,2,0,1,0]; // 0=clear,1=rain,2=dust // per track index

let weatherParticles=[];
let weatherT=0;

function initWeather(trackIdx){
  weatherParticles=[];
  weatherT=0;
}

function updateDrawWeather(cx,dt,trackIdx){
  const w=TRACK_WEATHER[trackIdx]||0;
  if(w===0) return;
  weatherT+=dt;
  const t=weatherT;

  if(w===1){ // RAIN - pure screen tint + subtle vignette, no moving parts
    // Dark blue tint
    cx.fillStyle='rgba(40,70,120,0.18)'; cx.fillRect(0,0,CW,CH);
    // Edge darkening to simulate overcast
    const rg=cx.createRadialGradient(CW/2,CH/2,CH*0.2,CW/2,CH/2,CH*0.9);
    rg.addColorStop(0,'rgba(0,0,0,0)');
    rg.addColorStop(1,'rgba(20,40,80,0.22)');
    cx.fillStyle=rg; cx.fillRect(0,0,CW,CH);
    // Subtle shimmer on top band (simulates wet reflection)
    cx.fillStyle=`rgba(150,200,255,${0.04+Math.sin(t*1.2)*0.02})`; 
    cx.fillRect(0,0,CW,CH*0.08);

  } else if(w===2){ // DUST - warm sandy tint
    cx.fillStyle=`rgba(180,140,50,${0.12+Math.sin(t*0.7)*0.04})`; 
    cx.fillRect(0,0,CW,CH);
    // Warm edge vignette
    const rg2=cx.createRadialGradient(CW/2,CH/2,CH*0.15,CW/2,CH/2,CH*0.85);
    rg2.addColorStop(0,'rgba(0,0,0,0)');
    rg2.addColorStop(1,'rgba(120,80,20,0.2)');
    cx.fillStyle=rg2; cx.fillRect(0,0,CW,CH);

  } else if(w===3){ // OVERCAST
    cx.fillStyle='rgba(40,40,60,0.12)'; cx.fillRect(0,0,CW,CH);
  }
}

// ─── SEGMENT CROSSING ──────────────────────────────────────────────────────────
function segCross(ax,ay,bx,by,cx,cy,dx,dy){
  function side(ox,oy,ux,uy,vx,vy){return(ux-ox)*(vy-oy)-(uy-oy)*(vx-ox);}
  const d1=side(cx,cy,dx,dy,ax,ay),d2=side(cx,cy,dx,dy,bx,by);
  const d3=side(ax,ay,bx,by,cx,cy),d4=side(ax,ay,bx,by,dx,dy);
  return((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
}

// ─── CAR CLASS ─────────────────────────────────────────────────────────────────
class Car{
  constructor(x,y,angle,defId,isPlayer){
    this.x=x; this.y=y; this.a=angle;
    this.px=x; this.py=y;
    this.def=CAR_DEFS.find(c=>c.id===defId)||CAR_DEFS[0];
    this.isP=isPlayer;
    this.sp=0; this.vx=0; this.vy=0; this._prevA=angle;
    this.nos=isPlayer?100:55;
    this.lap=0; this.nextCP=0; this.total=0;
    this.wentOff=false; this.pp=0; this._lapCD=0;
    this.aiI=0; this.aiM=0.68+Math.random()*0.28; this.aiReact=1;
    this.driftAng=0; this.isDrifting=false; this._combo=0;
    this.skidTrail=[]; this.nosFlame=0; this.nosReady=true;
    this.num=Math.floor(Math.random()*98)+1;
    // Jump state
    this.jumpH=0; this.jumpV=0; this._wasOnRamp=false;
    // Ghost recording (player only)
    this.ghostFrames=[]; this.lapGhost=null; this._lapStartT=0;
  }

  speed(){ return Math.sqrt(this.vx*this.vx+this.vy*this.vy); }

  update(dt,L,R,brake,nos,raceTime){
    const def=this.def;
    const ramps=TDEF&&TDEF.ramps?TDEF.ramps:[];

    if(this.isP){
      // Auto-gas — NOS gives instant kick + higher top speed
      // nosReady: must recharge to 25 before firing again after empty
      if(this.nos<=0) this.nosReady=false;
      else if(this.nos>=25) this.nosReady=true;

      const nosOn=nos&&this.nos>0&&this.nosReady;
      const nosBoost=Math.max(1.4, def.nos+0.35); // min 40% faster, stacks with car stat
      const maxSp=nosOn?def.top*nosBoost:def.top;
      const accMul=nosOn?4.5:1.0;
      this.sp=Math.min(this.sp+def.acc*accMul*dt,maxSp);
      if(brake) this.sp=Math.max(this.sp-490*dt,-55);
      const tr=3.2*Math.min(1,Math.abs(this.sp)/110);
      if(L) this.a-=tr*dt;
      if(R) this.a+=tr*dt;
      if(nosOn){
        this.nos=Math.max(0,this.nos-52*dt);this.nosFlame=1;
        this.sp=maxSp;
        if(!this._nosOn){
          this.vx+=Math.sin(this.a)*90;this.vy-=Math.cos(this.a)*90;
        }
        this._nosOn=true;
      } else {
        this.nos=Math.min(100,this.nos+11*dt);
        this.nosFlame=Math.max(0,this.nosFlame-.1);
        this._nosOn=false;
      }
    }else{
      const wp=TRK[this.aiI];
      const dx=wp.x-this.x,dy=wp.y-this.y,dist=Math.sqrt(dx*dx+dy*dy);
      const want=Math.atan2(dx,-dy);
      let diff=want-this.a;
      while(diff>Math.PI)diff-=Math.PI*2; while(diff<-Math.PI)diff+=Math.PI*2;
      this.a+=Math.sign(diff)*Math.min(Math.abs(diff),3.2*(this.aiReact||1)*dt);
      if(dist<95) this.aiI=(this.aiI+9)%TN;
      this.sp+=(320*this.aiM-this.sp)*2.2*dt;
    }

    // Drift physics
    const turnRate=Math.abs(this.a-this._prevA)/Math.max(dt,0.001);
    this._prevA=this.a;
    const airborne=this.jumpH>2;
    // Reduced grip when airborne
    const spFrac=Math.min(1,Math.abs(this.sp)/Math.max(def.top,1));
    const driftLoad=spFrac*Math.min(1,turnRate*1.5)*(airborne?0.3:1);
    const effGrip=Math.max(airborne?.4:.2,def.grip-driftLoad*(1-def.grip)*2.0);
    const gf=1-Math.pow(1-effGrip,dt*60);
    const desVX=Math.sin(this.a)*this.sp,desVY=-Math.cos(this.a)*this.sp;
    this.vx+=(desVX-this.vx)*gf; this.vy+=(desVY-this.vy)*gf;

    this.off=!airborne&&nearD2(this.x,this.y)>TW*TW;
    if(this.off){this.wentOff=true;const p=Math.pow(0.07,dt);this.sp*=p;this.vx*=p;this.vy*=p;}
    this.x+=this.vx*dt; this.y+=this.vy*dt;

    // Hard boundary (only when on ground)
    if(!airborne){
      const dSq=nearD2(this.x,this.y),maxD=TW*2.2;
      if(dSq>maxD*maxD){
        let mi=0,md=Infinity;
        for(let i=0;i<TN;i++){const dx=TRK[i].x-this.x,dy=TRK[i].y-this.y,d=dx*dx+dy*dy;if(d<md){md=d;mi=i;}}
        const dist=Math.sqrt(md),nx=(TRK[mi].x-this.x)/dist,ny=(TRK[mi].y-this.y)/dist;
        this.x+=nx*(dist-maxD);this.y+=ny*(dist-maxD);
        const out=this.vx*(-nx)+this.vy*(-ny);
        if(out>0){this.vx+=nx*out*1.8;this.vy+=ny*out*1.8;}this.sp*=0.15;
      }
    }

    // ── JUMP PHYSICS ───────────────────────────────────────────────────────────
    const prog=tProg(this.x,this.y);
    const onRamp=ramps.some(r=>prog>=r.fr&&prog<=r.to);
    if(onRamp&&!this._wasOnRamp&&this.jumpH<5&&Math.abs(this.sp)>80){
      this.jumpV=280; // launch!
      this._wasOnRamp=true;
      if(this.isP){beep(660,.06,.15,'triangle');camShake=1.2;}
    }
    if(!onRamp) this._wasOnRamp=false;
    if(this.jumpH>0||this.jumpV>0){
      this.jumpH+=this.jumpV*dt;
      this.jumpV-=560*dt; // gravity
      if(this.jumpH<=0&&this.jumpV<0){
        this.jumpH=0;this.jumpV=0;
        if(this.isP){
          camShake=2.5;
          beep(120,.12,.3,'sawtooth');
          for(let k=0;k<10;k++) addDust(this.x+(Math.random()-.5)*30,this.y+(Math.random()-.5)*30,'rgba(200,175,130,.9)',1);
        }
      }
    }

    // Drift scoring
    const velA=Math.atan2(this.vx,-this.vy);
    let da=velA-this.a;
    while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
    this.driftAng=da;
    this.isDrifting=!airborne&&Math.abs(da)>0.22&&Math.abs(this.sp)>120;
    if(this.isDrifting&&Math.abs(this.sp)>120){
      this.skidTrail.push({x:this.x,y:this.y,t:Date.now()});
      if(this.skidTrail.length>80)this.skidTrail.shift();
      if(this.isP)this._combo+=Math.abs(da)*Math.abs(this.sp)*dt*0.005;
    }else{
      if(this.isP&&this._combo>3)spawnDriftPopup(this,Math.floor(this._combo));
      this._combo=0;
    }

    // Checkpoints
    if(this.nextCP<4){
      const g=CP_GATES[this.nextCP];
      if(segCross(this.px,this.py,this.x,this.y,g.lx,g.ly,g.rx,g.ry))this.nextCP++;
    }
    if(this.nextCP>=4&&FINISH_GATE&&raceTime-this._lapCD>2){
      const f=FINISH_GATE;
      if(segCross(this.px,this.py,this.x,this.y,f.lx,f.ly,f.rx,f.ry)){
        const lapTime=raceTime-this._lapStartT;
        // Save ghost of this lap for next lap
        if(this.isP&&lapTime>5){
          this.lapGhost={frames:[...this.ghostFrames],lapTime,startT:this._lapStartT};
          this.ghostFrames=[];
        }
        this.lap++;this.nextCP=0;this._lapCD=raceTime;this._lapStartT=raceTime;
        if(this.isP){beep(660,.08);setTimeout(()=>beep(880,.2),100);}
      }
    }
    // Record ghost at 20fps using timer
    if(this.isP&&raceTime-(this._lastGhostT||0)>=0.033){
      this._lastGhostT=raceTime;
      this.ghostFrames.push({t:raceTime-this._lapStartT,x:this.x,y:this.y,a:this.a});
    }

    this.px=this.x;this.py=this.y;
    this.pp=prog;
    this.total=this.lap+prog;
  }

  draw(cx,cam,SC){
    const sx=(this.x-cam.x)*SC+CW/2,sy=(this.y-cam.y)*SC+CH/2;
    const def=this.def;
    const isF1=def.body==='long'||def.body==='f1b';
    const scaleMap={wide:1.12,tall:1.06,low:.9,compact:.85,long:.72,f1b:.72,vintage:1.0,suv:1.1,aero:.95,std:1.0};
    const scl=scaleMap[def.body]||1.0;
    const px=Math.max(1.5,Math.round(Math.min(17*SC*scl/8*1.6,30*SC*scl/16*1.2)));
    const dW=px*8,dH=px*16,x0=-dW/2,y0=-dH/2;

    // Jump offset in screen pixels (jumpH is abstract game units)
    const jumpOff=this.jumpH>0?(this.jumpH/200)*px*12:0;
    const jumpScale=this.jumpH>0?1+this.jumpH*0.004:1;

    // Skid marks
    if(this.skidTrail.length>1){
      const now=Date.now();
      for(let i=1;i<this.skidTrail.length;i++){
        const p=this.skidTrail[i],q=this.skidTrail[i-1];
        const age=(now-p.t)/3500;if(age>1)continue;
        cx.globalAlpha=(1-age)*0.2;cx.strokeStyle='#2a1a08';
        cx.lineWidth=Math.max(SC,0.5)*6;cx.lineCap='round';
        cx.beginPath();
        cx.moveTo((q.x-cam.x)*SC+CW/2,(q.y-cam.y)*SC+CH/2);
        cx.lineTo((p.x-cam.x)*SC+CW/2,(p.y-cam.y)*SC+CH/2);cx.stroke();
      }
      cx.globalAlpha=1;
    }

    // Ground shadow (stays at ground level when jumping)
    cx.save();cx.translate(sx,sy);
    if(jumpOff>0){
      const sAlpha=Math.max(0.05,0.28-this.jumpH*0.0012);
      const sScale=1+this.jumpH*0.008;
      cx.globalAlpha=sAlpha;cx.fillStyle='#000';
      cx.beginPath();cx.ellipse(0,0,dW*.55*sScale,dH*.13*sScale,0,0,Math.PI*2);cx.fill();
      cx.globalAlpha=1;
    }
    cx.restore();

    // Car (elevated + scaled when jumping)
    cx.save();cx.translate(sx,sy-jumpOff);
    if(jumpScale>1)cx.scale(jumpScale,jumpScale);
    cx.rotate(this.a+Math.PI);

    // Normal ground shadow (no jump)
    if(jumpOff===0){
      cx.globalAlpha=0.2;cx.fillStyle='#000';
      cx.beginPath();cx.ellipse(px*.4,px*.8,dW*.5,dH*.13,0,0,Math.PI*2);cx.fill();cx.globalAlpha=1;
    }

    // Draw car sprite from sheet
    const spr=CAR_SPRITES[def.body]||CAR_SPRITES.std;
    if(CAR_SHEET.complete&&CAR_SHEET.naturalWidth>0){
      cx.imageSmoothingEnabled=false;
      cx.drawImage(CAR_SHEET,spr.sx,spr.sy,spr.sw,spr.sh,x0,y0,dW,dH);
    }else{
      cx.fillStyle=def.col;cx.fillRect(x0,y0,dW,dH);
    }

    // Racing number
    const ns=Math.max(7,px*1.8),ny=isF1?px*-2.5:px*-1.2;
    cx.font=`bold ${ns}px monospace`;cx.textAlign='center';
    cx.fillStyle='rgba(0,0,0,.7)';cx.fillText(this.num,1,ny+1);
    cx.fillStyle='rgba(255,255,255,.92)';cx.fillText(this.num,0,ny);

    // NOS flame
    if(this.isP&&this.nosFlame>0.05){
      // Flame draws at local -y (rear of car, with +PI rotation convention)
      const fl=this.nosFlame*dH*.32+px*2;
      cx.globalAlpha=this.nosFlame*.85;cx.fillStyle='#44aaff';
      cx.beginPath();cx.moveTo(-px,-dH/2);cx.lineTo(0,-dH/2-fl);cx.lineTo(px,-dH/2);cx.fill();
      cx.globalAlpha=.38;cx.fillStyle='#fff';
      cx.beginPath();cx.moveTo(-px*.4,-dH/2);cx.lineTo(0,-dH/2-fl*.5);cx.lineTo(px*.4,-dH/2);cx.fill();
      cx.globalAlpha=1;
    }
    cx.restore();

    // Airborne label
    if(jumpOff>20&&this.isP){
      cx.fillStyle='rgba(255,220,50,.85)';cx.font=`bold ${Math.max(8,px*1.5)}px monospace`;cx.textAlign='center';
      cx.fillText('AIRBORNE!',sx,sy-jumpOff-dH/2-4);
    }

    if(this.isDrifting&&Math.random()<0.4)
      addDust(this.x-Math.sin(this.a)*9,this.y+Math.cos(this.a)*9,'rgba(210,200,185,.8)',1);
    if(this.isP&&S.name){
      cx.fillStyle='rgba(255,255,255,.6)';cx.font='7px monospace';cx.textAlign='center';
      cx.fillText(S.name,sx,sy-jumpOff-dH/2*SC*.5);
    }
  }

  // Draw as ghost (transparent)
  drawGhost(cx,cam,SC){
    const sx=(this.x-cam.x)*SC+CW/2,sy=(this.y-cam.y)*SC+CH/2;
    const def=this.def;
    const isF1=def.body==='long'||def.body==='f1b';
    const scaleMap={wide:1.12,tall:1.06,low:.9,compact:.85,long:.72,f1b:.72,vintage:1.0,suv:1.1,aero:.95,std:1.0};
    const px=Math.max(1.5,Math.round(Math.min(17*SC*(scaleMap[def.body]||1)/8*1.6,30*SC*(scaleMap[def.body]||1)/16*1.2)));
    const dW=px*8,dH=px*16,x0=-dW/2,y0=-dH/2;
    cx.save();cx.translate(sx,sy);cx.rotate(this.a+Math.PI);cx.globalAlpha=0.45;
    const spr=CAR_SPRITES[def.body]||CAR_SPRITES.std;
    if(CAR_SHEET.complete&&CAR_SHEET.naturalWidth>0){
      cx.imageSmoothingEnabled=false;
      cx.drawImage(CAR_SHEET,spr.sx,spr.sy,spr.sw,spr.sh,x0,y0,dW,dH);
    }
    cx.restore();
    // Store ghost delta info for HUD
    if(ghostData) window._ghostDelta = ghostData.lapTime ? (raceT - ghostData.lapTime) : null;
    // Ghost name tag
    if(ghostData&&ghostData.name){
      cx.save(); cx.globalAlpha=0.5;
      cx.font=`bold ${Math.max(8,Math.round(9*SC))}px monospace`;
      cx.textAlign='center'; cx.textBaseline='bottom';
      cx.fillStyle='#44ffaa';
      cx.fillText('👻 '+ghostData.name,sx,sy-dH*SC*0.5);
      cx.restore();
    }
    cx.globalAlpha=1;
  }
}


// ─── LAP POPUP ───────────────────────────────────────────────────────────────
let _lapPopup=0, _lapPopupT='';
function showLapPopup(lapT, isBest){
  _lapPopup=2.5;
  const m=Math.floor(lapT/60),s=String(Math.floor(lapT%60)).padStart(2,'0'),ms=String(Math.floor((lapT%1)*100)).padStart(2,'0');
  _lapPopupT=(isBest?'⚡ BEST LAP  ':'LAP  ')+m+':'+s+'.'+ms;
}
function drawLapPopup(cx,dt){
  if(_lapPopup<=0) return;
  _lapPopup-=dt;
  const a=Math.min(1,_lapPopup*2);
  cx.save(); cx.globalAlpha=a;
  cx.font=`bold ${Math.round(CH*.042)}px monospace`;
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillStyle='rgba(0,0,0,.5)'; cx.fillText(_lapPopupT,CW/2+1,CH*.88+1);
  cx.fillStyle=_lapPopupT.includes('BEST')?'#ffdd00':'#fff';
  cx.fillText(_lapPopupT,CW/2,CH*.88);
  cx.restore();
}

// ─── TRACK DRAWING ───────────────────────────────────────────────────────────
function drawTrack(cx, cam, SC) {
  // Grass background (slightly oversized to cover camera rotation corners)
  cx.fillStyle = TDEF.grass;
  cx.fillRect(-200,-200,CW+400,CH+400);

  cx.save();
  cx.translate(CW/2-cam.x*SC, CH/2-cam.y*SC);
  cx.scale(SC, SC);

  // Rocks (behind trees)
  for(const r of ROCKS){
    cx.fillStyle='rgba(0,0,0,.18)';
    cx.beginPath(); cx.ellipse(r.x+2,r.y+2,r.r,r.r*.6,0,0,Math.PI*2); cx.fill();
    cx.fillStyle='#888878';
    cx.beginPath(); cx.ellipse(r.x,r.y,r.r,r.r*.65,-.3,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(255,255,255,.12)';
    cx.beginPath(); cx.arc(r.x-r.r*.3,r.y-r.r*.3,r.r*.3,0,Math.PI*2); cx.fill();
  }

  // Trees
  for(const t of TREES){
    cx.fillStyle=TDEF.tc[t.g];
    cx.beginPath(); cx.arc(t.x,t.y,t.r*1.3,0,Math.PI*2); cx.fill();
    cx.fillStyle=TDEF.tc[(t.g+1)%3];
    cx.beginPath(); cx.arc(t.x-t.r*.2,t.y-t.r*.2,t.r,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(60,35,10,.4)';
    cx.fillRect(t.x-2, t.y+t.r*.4, 4, t.r*.5);
  }

  // Track surface layers
  function tp(){
    cx.beginPath(); cx.moveTo(TRK[0].x,TRK[0].y);
    for(let i=1;i<TN;i++) cx.lineTo(TRK[i].x,TRK[i].y);
    cx.closePath();
  }
  cx.lineJoin='round'; cx.lineCap='round';
  tp(); cx.strokeStyle='rgba(0,0,0,.3)';    cx.lineWidth=TW*2+28; cx.stroke();
  tp(); cx.strokeStyle=TDEF.edge;           cx.lineWidth=TW*2+16; cx.stroke();
  tp(); cx.strokeStyle=TDEF.d1;             cx.lineWidth=TW*2;    cx.stroke();
  tp(); cx.strokeStyle=TDEF.d2;             cx.lineWidth=TW*2-30; cx.stroke();
  tp(); cx.strokeStyle='rgba(255,255,255,.06)'; cx.lineWidth=TW*2-62; cx.stroke();
  // Tire groove hints
  tp(); cx.strokeStyle='rgba(50,28,8,.18)'; cx.lineWidth=20; cx.stroke();
  // Centre dashes
  cx.setLineDash([24,28]);
  tp(); cx.strokeStyle='rgba(255,240,160,.18)'; cx.lineWidth=2.8; cx.stroke();
  cx.setLineDash([]);

  // Corner markers
  for(const m of MRKS){
    const col=m.alt?'#cc1010':'#eee';
    cx.fillStyle='rgba(0,0,0,.25)';
    cx.beginPath(); cx.arc(m.lx+1.5,m.ly+1.5,6,0,Math.PI*2); cx.fill();
    cx.fillStyle=col;
    cx.beginPath(); cx.arc(m.lx,m.ly,6,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(0,0,0,.25)';
    cx.beginPath(); cx.arc(m.rx+1.5,m.ry+1.5,6,0,Math.PI*2); cx.fill();
    cx.fillStyle=col;
    cx.beginPath(); cx.arc(m.rx,m.ry,6,0,Math.PI*2); cx.fill();
  }

  // Start/finish checker
  const t0=TRK[0], t1=TRK[1];
  let fx=t1.x-t0.x, fy=t1.y-t0.y, fl=Math.sqrt(fx*fx+fy*fy)||1; fx/=fl; fy/=fl;
  const fnx=-fy, fny=fx;
  for(let k=0;k<8;k++){
    const f0=-TW+(k*TW*2/8), f1=f0+TW*2/8;
    cx.fillStyle=k%2===0?'#fff':'#222';
    cx.beginPath();
    cx.moveTo(t0.x+fnx*f0,   t0.y+fny*f0);
    cx.lineTo(t0.x+fnx*f1,   t0.y+fny*f1);
    cx.lineTo(t0.x+fnx*f1+fx*12, t0.y+fny*f1+fy*12);
    cx.lineTo(t0.x+fnx*f0+fx*12, t0.y+fny*f0+fy*12);
    cx.fill();
  }

  // Checkpoint flags — small flags on both sides of track, no lines across
  const pl=cars[0]||null;
  CP_GATES.forEach((g,i)=>{
    const passed=pl&&pl.nextCP>i;
    const col=passed?'#44ff88':'#ffdd22';
    const colD=passed?'rgba(20,160,60,.85)':'rgba(200,160,0,.85)';
    [-1,1].forEach(side=>{
      const px=g.cx+g.nx*side*(TW*0.82), py=g.cy+g.ny*side*(TW*0.82);
      cx.save(); cx.translate(px,py);
      // pole shadow
      cx.strokeStyle='rgba(0,0,0,.25)'; cx.lineWidth=2.5;
      cx.beginPath(); cx.moveTo(1.5,13); cx.lineTo(1.5,-19); cx.stroke();
      // pole
      cx.strokeStyle='rgba(220,220,220,.9)'; cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(0,13); cx.lineTo(0,-19); cx.stroke();
      // flag shadow
      cx.fillStyle='rgba(0,0,0,.2)';
      cx.beginPath(); cx.moveTo(1,-18); cx.lineTo(side*15+1,-12); cx.lineTo(1,-6); cx.closePath(); cx.fill();
      // flag
      cx.fillStyle=colD;
      cx.beginPath(); cx.moveTo(0,-18); cx.lineTo(side*14,-12); cx.lineTo(0,-6); cx.closePath(); cx.fill();
      cx.fillStyle=col;
      cx.globalAlpha=0.85;
      cx.beginPath(); cx.moveTo(0,-17); cx.lineTo(side*12,-12); cx.lineTo(0,-7); cx.closePath(); cx.fill();
      cx.globalAlpha=1;
      // number
      if(!passed){ cx.fillStyle='rgba(0,0,0,.75)'; cx.font='bold 6px monospace'; cx.textAlign='center'; cx.fillText(i+1,side*6,-11); }
      // base
      cx.fillStyle='rgba(0,0,0,.35)'; cx.beginPath(); cx.ellipse(0,13,4,1.5,0,0,Math.PI*2); cx.fill();
      cx.restore();
    });
  });

  cx.restore();
}


// ─── RAMP DRAWING ─────────────────────────────────────────────────────────────
function drawRamps(cx,cam,SC){
  const ramps=TDEF&&TDEF.ramps?TDEF.ramps:[];
  if(!ramps.length)return;
  cx.save();
  cx.translate(CW/2-cam.x*SC, CH/2-cam.y*SC);
  cx.scale(SC,SC);
  for(const ramp of ramps){
    const i1=Math.floor(ramp.fr*TN), i2=Math.floor(ramp.to*TN);
    // Ramp surface (yellow-orange grating)
    cx.beginPath();
    cx.moveTo(TRK[i1].x,TRK[i1].y);
    for(let i=i1;i<=Math.min(i2,TN-1);i++) cx.lineTo(TRK[i].x,TRK[i].y);
    cx.strokeStyle='rgba(255,210,40,.55)'; cx.lineWidth=TW*2-8;
    cx.lineJoin='round'; cx.stroke();
    // Chevron arrows pointing forward
    const mid=Math.floor((i1+i2)/2);
    if(mid<TN-1){
      const t=TRK[mid],n=TRK[(mid+1)%TN];
      let dx=n.x-t.x,dy=n.y-t.y,ln=Math.sqrt(dx*dx+dy*dy)||1;dx/=ln;dy/=ln;
      const nx=-dy,ny=dx;
      cx.strokeStyle='rgba(255,150,0,.8)'; cx.lineWidth=5; cx.lineCap='round';
      for(let k=-1;k<=1;k++){
        const bx=t.x+nx*k*(TW*.5), by=t.y+ny*k*(TW*.5);
        cx.beginPath();
        cx.moveTo(bx-dx*10-nx*8, by-dy*10-ny*8);
        cx.lineTo(bx+dx*10, by+dy*10);
        cx.lineTo(bx-dx*10+nx*8, by-dy*10+ny*8);
        cx.stroke();
      }
    }
  }
  cx.restore();
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function drawHUD(cx, pl, cars, raceT) {
  if(!pl) return;
  const land=CW>CH, bH=land?52:58;

  // ── Top bar glass effect ─────────────────────────────────────────────────
  const _bg=cx.createLinearGradient(0,0,0,bH);
  _bg.addColorStop(0,'rgba(0,0,15,.82)');
  _bg.addColorStop(1,'rgba(0,0,10,.55)');
  cx.fillStyle=_bg; cx.fillRect(0,0,CW,bH);
  // Top glass shine line
  cx.fillStyle='rgba(255,255,255,.07)'; cx.fillRect(0,0,CW,1.5);
  // Bottom border glow
  cx.fillStyle='rgba(255,100,0,.35)'; cx.fillRect(0,bH-1.5,CW,1.5);

  // ── Position badge (big, left) ───────────────────────────────────────────
  const sorted=[...cars].sort((a,b)=>b.total-a.total);
  const pos=sorted.indexOf(pl)+1, sfx=['ST','ND','RD'][pos-1]||'TH';
  const posCol=pos===1?'#ffcc00':pos===2?'#aaaaaa':pos===3?'#cd7f32':'#ffffff';
  // Badge bg
  cx.fillStyle=pos===1?'rgba(255,200,0,.18)':'rgba(255,255,255,.08)';
  cx.beginPath(); cx.roundRect(6,5,52,bH-10,6); cx.fill();
  cx.strokeStyle=pos===1?'rgba(255,200,0,.5)':'rgba(255,255,255,.15)'; cx.lineWidth=1;
  cx.beginPath(); cx.roundRect(6,5,52,bH-10,6); cx.stroke();
  cx.fillStyle=posCol; cx.font=`bold ${land?26:28}px Impact,monospace`;
  cx.textAlign='left'; cx.textBaseline='middle';
  cx.fillText(pos, 14, bH*.42);
  cx.font=`bold ${land?10:11}px monospace`;
  cx.fillStyle='rgba(255,255,255,.6)';
  cx.fillText(sfx, 34, bH*.3);

  // ── Center: Lap + Timer + Track ──────────────────────────────────────────
  const _laps=TDEF&&TDEF.laps?TDEF.laps:LAPS;
  const lapTxt='LAP '+Math.min(pl.lap+1,_laps)+'/'+_laps;
  cx.font=`bold ${land?13:14}px monospace`; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillStyle='#ffffff'; cx.fillText(lapTxt, CW/2, bH*.28);

  const m=Math.floor(raceT/60), s=String(Math.floor(raceT%60)).padStart(2,'0');
  const ms=String(Math.floor((raceT%1)*100)).padStart(2,'0');
  cx.fillStyle='#44ff88'; cx.font=`bold ${land?15:16}px monospace`;
  cx.fillText(m+':'+s+'.'+ms, CW/2, bH*.62);

  cx.fillStyle='rgba(255,210,80,.5)'; cx.font=`${land?8:8}px monospace`;
  cx.fillText(TDEF.name, CW/2, bH*.9);

  // ── Checkpoint dots ──────────────────────────────────────────────────────
  const cpR=4, cpY2=bH+10, cpGap=12;
  const cpTot=4, cpDone=Math.min(pl.nextCP,cpTot);
  for(let i=0;i<cpTot;i++){
    const cpX=CW/2+(i-(cpTot-1)/2)*cpGap;
    cx.fillStyle=i<cpDone?'rgba(40,220,80,.9)':'rgba(255,255,255,.2)';
    cx.beginPath(); cx.arc(cpX,cpY2,cpR,0,Math.PI*2); cx.fill();
    if(i<cpDone){ cx.strokeStyle='rgba(80,255,120,.6)'; cx.lineWidth=1.5; cx.stroke(); }
  }

  // ── Speed (right side) ───────────────────────────────────────────────────
  const spd=Math.round(pl.speed());
  const _sX=CW-8;
  cx.textAlign='right'; cx.textBaseline='middle';
  cx.fillStyle='rgba(255,255,255,.9)'; cx.font=`bold ${land?22:24}px Impact,monospace`;
  cx.fillText(spd, _sX, bH*.4);
  cx.fillStyle='rgba(255,255,255,.35)'; cx.font=`${land?8:8}px monospace`;
  cx.fillText('km/h', _sX, bH*.72);

  // ── NOS bar (bottom-left, wide and styled) ────────────────────────────────
  const nW=Math.round(CW*.28), nH=8, nX=6, nY=bH+20;
  const nosPct=pl.nos/100;
  const nosCol=pl.nos>60?'#44aaff':pl.nos>30?'#ff8800':'#ff3300';
  // Track
  cx.fillStyle='rgba(0,0,0,.5)'; cx.beginPath(); cx.roundRect(nX,nY,nW,nH,3); cx.fill();
  // Fill with glow
  if(nosPct>0){
    const _ng=cx.createLinearGradient(nX,nY,nX+nW*nosPct,nY);
    _ng.addColorStop(0,nosCol+'aa'); _ng.addColorStop(1,nosCol);
    cx.fillStyle=_ng; cx.beginPath(); cx.roundRect(nX,nY,nW*nosPct,nH,3); cx.fill();
    if(pl.nos>80){ cx.shadowColor=nosCol; cx.shadowBlur=8; cx.fill(); cx.shadowBlur=0; }
  }
  cx.strokeStyle='rgba(255,255,255,.15)'; cx.lineWidth=1;
  cx.beginPath(); cx.roundRect(nX,nY,nW,nH,3); cx.stroke();
  cx.fillStyle='rgba(180,220,255,.7)'; cx.font='bold 7px monospace'; cx.textAlign='left'; cx.textBaseline='middle';
  cx.fillText('NOS', nX, nY-5);

  // ── Coins display ─────────────────────────────────────────────────────────
  cx.textAlign='left'; cx.textBaseline='middle';
  cx.fillStyle='rgba(255,210,50,.85)'; cx.font='bold 11px monospace';
  cx.fillText('💰 $'+S.coins, 6, bH+38);

  // ── Drift flash ──────────────────────────────────────────────────────────
  if(pl.isDrifting){
    const combo=pl._combo||0;
    const _dc=combo>15?'#ffcc00':combo>5?'#ff8800':'rgba(255,170,0,.85)';

function drawCtrl(cx, ctrlL, ctrlR, ctrlN, ctrlB, pl, raceT) {
  const lay=ctrlLayout(), land=CW>CH, {lz,rz}=lay;

  // Steer zones — subtle gradient panels
  const _drawZone=(zone,active,dir)=>{
    const _zg=cx.createLinearGradient(
      dir<0?zone.x+zone.w:zone.x, 0,
      dir<0?zone.x:zone.x+zone.w, 0
    );
    _zg.addColorStop(0,active?'rgba(255,160,60,.14)':'rgba(255,255,255,.04)');
    _zg.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=_zg; cx.fillRect(zone.x,zone.y,zone.w,zone.h);
    // Arrow chevron
    const ax=zone.x+zone.w*(dir<0?.35:.65), ay=(zone.y+zone.h)*.62;
    const as=active?22:16;
    cx.strokeStyle=active?'rgba(255,180,60,.9)':'rgba(255,255,255,.22)';
    cx.lineWidth=active?3:2; cx.lineCap='round'; cx.lineJoin='round';
    cx.beginPath();
    if(dir<0){ cx.moveTo(ax+as,ay-as*.6); cx.lineTo(ax,ay); cx.lineTo(ax+as,ay+as*.6); }
    else      { cx.moveTo(ax-as,ay-as*.6); cx.lineTo(ax,ay); cx.lineTo(ax-as,ay+as*.6); }
    cx.stroke();
    if(active){
      // Second chevron for active state
      cx.globalAlpha=0.45;
      cx.beginPath();
      const ax2=ax+(dir<0?12:-12);
      if(dir<0){ cx.moveTo(ax2+as,ay-as*.6); cx.lineTo(ax2,ay); cx.lineTo(ax2+as,ay+as*.6); }
      else      { cx.moveTo(ax2-as,ay-as*.6); cx.lineTo(ax2,ay); cx.lineTo(ax2-as,ay+as*.6); }
      cx.stroke();
      cx.globalAlpha=1;
    }
  };
  _drawZone(lz,ctrlL,-1); _drawZone(rz,ctrlR,1);

  // NOS button — glowing circle
  const nos=lay.nos, nA=ctrlN&&pl&&pl.nos>0;
  const _ng=cx.createRadialGradient(nos.x,nos.y,0,nos.x,nos.y,nos.r);
  if(nA){_ng.addColorStop(0,'rgba(80,160,255,.85)');_ng.addColorStop(1,'rgba(20,80,220,.6)');}
  else  {_ng.addColorStop(0,'rgba(30,60,160,.35)');_ng.addColorStop(1,'rgba(10,30,100,.2)');}
  cx.fillStyle=_ng; cx.beginPath(); cx.arc(nos.x,nos.y,nos.r,0,Math.PI*2); cx.fill();
  cx.strokeStyle=nA?'rgba(100,200,255,.9)':'rgba(60,100,200,.4)'; cx.lineWidth=nA?2.5:1.5; cx.stroke();
  if(nA){ cx.save(); cx.shadowColor='#44aaff'; cx.shadowBlur=18; cx.stroke(); cx.restore(); }
  cx.fillStyle=nA?'#ffffff':'rgba(120,170,255,.55)';
  cx.font=`bold ${nA?12:10}px monospace`; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('NOS', nos.x, nos.y);
  // NOS arc progress
  if(pl&&pl.nos>0){
    cx.strokeStyle='rgba(100,200,255,.5)'; cx.lineWidth=3;
    cx.beginPath(); cx.arc(nos.x,nos.y,nos.r+4,-Math.PI/2,-Math.PI/2+Math.PI*2*(pl.nos/100)); cx.stroke();
  }

  // BRAKE button
  const brk=lay.brk;
  const _bg2=cx.createRadialGradient(brk.x,brk.y,0,brk.x,brk.y,brk.r);
  if(ctrlB){_bg2.addColorStop(0,'rgba(255,100,0,.8)');_bg2.addColorStop(1,'rgba(180,30,0,.6)');}
  else     {_bg2.addColorStop(0,'rgba(150,40,0,.28)');_bg2.addColorStop(1,'rgba(80,10,0,.15)');}
  cx.fillStyle=_bg2; cx.beginPath(); cx.arc(brk.x,brk.y,brk.r,0,Math.PI*2); cx.fill();
  cx.strokeStyle=ctrlB?'rgba(255,130,50,.9)':'rgba(200,80,40,.3)'; cx.lineWidth=ctrlB?2:1.5; cx.stroke();
  cx.fillStyle=ctrlB?'#fff':'rgba(255,140,100,.45)';
  cx.font=`bold ${ctrlB?11:9}px monospace`; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('BRK', brk.x, brk.y);

  // Hint text early in race
  if(raceT<4.5){
    cx.globalAlpha=Math.min(1,(1-raceT/4.5)*2)*.8;
    cx.fillStyle='rgba(255,220,100,1)'; cx.font='11px monospace'; cx.textAlign='center';
    cx.fillText('TAP to GAS  ·  Edges to STEER', CW/2, CH-10);
    cx.globalAlpha=1;
  }
}

// ─── VISUAL FX ────────────────────────────────────────────────────────────────
function drawSpeedLines(cx, sp, top) {
  const t=Math.max(0,(sp-240)/(top-240)); if(t<=0)return;
  cx.save();
  for(let i=0;i<Math.floor(t*16);i++){
    const ang=(i/16)*Math.PI*2+Date.now()*.0004;
    const r1=Math.min(CW,CH)*.28+Math.random()*Math.min(CW,CH)*.12;
    const r2=r1+t*65+Math.random()*35;
    cx.strokeStyle=`rgba(255,255,255,${t*.13})`; cx.lineWidth=.8+Math.random()*.7;
    cx.beginPath();
    cx.moveTo(CW/2+Math.cos(ang)*r1, CH/2+Math.sin(ang)*r1);
    cx.lineTo(CW/2+Math.cos(ang)*r2, CH/2+Math.sin(ang)*r2);
    cx.stroke();
  }
  cx.restore();
}

function drawVignette(cx) {
  const r=Math.sqrt(CW*CW+CH*CH)*.5;
  const g=cx.createRadialGradient(CW/2,CH/2,r*.22,CW/2,CH/2,r*.88);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,.52)');
  cx.fillStyle=g; cx.fillRect(0,0,CW,CH);
}

// ─── DRAMATIC COUNTDOWN ───────────────────────────────────────────────────────
function drawCountdown(cx, cdN, cdT){
  if(cdN<=0) return;
  // cdT goes 0→1 per count, cdN goes 3→1
  const progress = cdT; // 0=just changed, 1=about to change
  const scale = 1.8 - progress*0.8; // starts big, shrinks
  const alpha = Math.min(1, (1-progress)*2.5); // fades out at end
  const num = cdN > 0 ? cdN : 'GO!';

  cx.save();
  cx.globalAlpha = alpha;
  cx.translate(CW/2, CH/2);
  cx.scale(scale, scale);

  // Shadow
  cx.fillStyle = 'rgba(0,0,0,0.5)';
  cx.font = `bold ${Math.round(CH*.28)}px Impact, monospace`;
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText(num, 4, 4);

  // Main text
  const colors = ['#ff4400','#ffaa00','#ffdd00','#00ff88'];
  cx.fillStyle = colors[Math.min(3-cdN, 3)] || '#00ff88';
  cx.fillText(num, 0, 0);

  // Glow ring
  cx.globalAlpha = alpha * (1-progress) * 0.4;
  cx.strokeStyle = cx.fillStyle;
  cx.lineWidth = 8;
  const r = Math.round(CH*.18) * (1 + progress*0.5);
  cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2); cx.stroke();

  cx.restore();
}

function menuClick(mx,my){
  // Fullscreen button bottom-right
  const _fsSize=CH*.068;
  if(mx>=CW-_fsSize-8&&mx<=CW-8&&my>=CH-_fsSize-8&&my<=CH-8){
    const el=document.documentElement;
    if(!document.fullscreenElement){ el.requestFullscreen&&el.requestFullscreen(); }
    else { document.exitFullscreen&&document.exitFullscreen(); }
    return;
  }
  // Spotify button bottom-left
  if(mx<=60&&my>=CH*.87-36&&my<=CH*.87){
    const url='https://open.spotify.com/artist/1zRFjbrsphxLI5HNu2SJk0';
    window.open(url,'_blank'); return;
  }
  // Settings button top-right
  const mBtnX=CW-50, mBtnY=50, mBtnR=22;
  if(mx>=mBtnX-mBtnR&&mx<=mBtnX+mBtnR&&my>=mBtnY-mBtnR&&my<=mBtnY+mBtnR){
    state='settings'; sfxBeep(440,.08); return;
  }
  // Admin trigger: tap bottom-right corner 7 times
  if(mx>=CW*.72&&my>=CH*.80){
    const now=Date.now();
    if(now-adminTapT>3000) adminTaps=0;
    adminTapT=now; adminTaps++;
    sfxBeep(300+adminTaps*30,.03);
    if(adminTaps>=7){ adminTaps=0; sfxBeep(660,.12); tryAdminAction(); return; }
  }
  // MUST match drawMenu grid calculations exactly
  const _gap=10, _cols=2;
  const _btnW=Math.floor((Math.min(460,CW*.92)-_gap)/_cols);
  const _btnH=Math.min(68,Math.max(52,CH*.09));
  const _gridW=_cols*_btnW+_gap;
  const _gridX=CW/2-_gridW/2;
  const _gridY=CH*.44;
  MENU_ITEMS.forEach((_,i)=>{
    const col=i%_cols, row=Math.floor(i/_cols);
    const bx=_gridX+col*(_btnW+_gap);
    const by=_gridY+row*(_btnH+_gap);
    if(mx>=bx&&mx<=bx+_btnW&&my>=by&&my<=by+_btnH){
      menuSel=i;
      if(i===0)startRace();
      else if(i===1){state='garage';scroll.garage=0;}
      else if(i===2){state='tracks';scroll.tracks=0;}
      else if(i===3){state='leaderboard';lbTab=0;if(!scoresLoading&&(!globalScores||scoresError))fbLoad();}
      else if(i===4){state='achievements';}
      else if(i===5){state='daily'; getDailyChallenges();}
      else if(i===6){state='shop'; window._shopMsgT=0;}
    }
  });
}

function drawTrackSelect(cx){

  cx.save();cx.beginPath();cx.rect(0,52,CW,CH-52);cx.clip();

      cx.fillStyle=grad;cx.fillRect(cx2,cy2,cW,preH);

      const mini=buildSpline(t.raw,6);
      let mnx=Infinity,mxx=-Infinity,mny=Infinity,myx=-Infinity;
      for(const p of mini){mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mny=Math.min(mny,p.y);myx=Math.max(myx,p.y);}
      const ms=Math.min((cW-16)/(mxx-mnx),(preH-12)/(myx-mny))*.88;

      cx.closePath();cx.strokeStyle='rgba(0,0,0,.4)';cx.lineWidth=t.tw*ms*2+4;cx.lineJoin='round';cx.stroke();
      // Track
      cx.beginPath();cx.moveTo(mox+mini[0].x*ms,moy+mini[0].y*ms);
      for(const p of mini)cx.lineTo(mox+p.x*ms,moy+p.y*ms);
      cx.closePath();cx.strokeStyle=t.d1;cx.lineWidth=t.tw*ms*2;cx.stroke();
      cx.strokeStyle=t.d2;cx.lineWidth=t.tw*ms*1.4;cx.stroke();
    }else{

      const bm=Math.floor(bt/60),bs=String(Math.floor(bt%60)).padStart(2,'0'),bms=String(Math.floor((bt%1)*100)).padStart(2,'0');

      cx.strokeStyle=_ghOn?'#44ffaa':'rgba(120,120,120,.5)';cx.lineWidth=1;
      cx.beginPath();cx.roundRect(ghX,selBtnY,ghW,bH,bH*.35);cx.fill();cx.stroke();

      cx.fillStyle='#88ccff';cx.font=`bold ${Math.round(bH*.5)}px monospace`;
      cx.textAlign='center';cx.textBaseline='middle';cx.fillText('SELECT',cx2+cW/2,selBtnY+bH/2);
    }
    cx.restore();
  });

  cx.restore();
  // Scroll indicator
  if(maxScroll>0){
    const pct=scroll.tracks/maxScroll;
    const trackH=CH-52;
    const indH=Math.max(30,trackH*(trackH/totalH));
    cx.fillStyle='rgba(255,255,255,.15)';cx.fillRect(CW-6,52+(trackH-indH)*pct,4,indH);

}

  return col||'#4477ff';

function authClick(mx,my){
  // All positions MUST match drawAuth exactly
  const fW=CW*.46, fH=CH*.082, fX=CW/2-fW/2;
  const tabW=CW*.22, tabH=CH*.065, tabY=CH*.22, tabGap=4;
  const tabX=CW/2-tabW-tabGap/2;
  const btnH=CH*.088, btnY=CH*.56, btnX=fX;
  const gY=btnY+btnH+CH*.02;
  const isApp=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());

  // Tabs LOGIN/REGISTER
  if(my>=tabY&&my<=tabY+tabH){
    if(mx>=tabX&&mx<=tabX+tabW){ authMode='login'; authMsg=''; sfxBeep(440,.08); }
    else if(mx>=tabX+tabW+tabGap&&mx<=tabX+tabW*2+tabGap){ authMode='register'; authMsg=''; sfxBeep(440,.08); }
    return;
  }

  // Email field (drawn at CH*.33)
  if(my>=CH*.33&&my<=CH*.33+fH){ promptField('email'); return; }

  // Password field (drawn at CH*.44)
  if(my>=CH*.44&&my<=CH*.44+fH){ promptField('password'); return; }

  // LOG IN / CREATE ACCOUNT button (drawn at btnY=CH*.56)
  if(my>=btnY&&my<=btnY+btnH){ doAuth(); return; }

  // PLAY AS GUEST button (drawn at gY)
  if(my>=gY&&my<=gY+btnH*.85){ startAsGuest(); return; }

  // Forgot password (drawn at gY+btnH*.9+CH*.04)
  const forgotY=gY+btnH*.9+CH*.04;
  if(authMode==='login'&&my>=forgotY-CH*.03&&my<=forgotY+CH*.03){ doForgotPassword(); return; }

  // Google sign-in (drawn at ggY=gY+btnH*.85+CH*.07)
  if(!isApp){
    const ggY=gY+btnH*.85+CH*.07;
    if(my>=ggY&&my<=ggY+btnH*.85){ doGoogleAuth(); return; }
  }
}

function promptField(field){
  const val = prompt(field==='email'?'Enter email:':'Enter password:','');
  if(val===null) return;
  if(field==='email') authEmail=val.trim();
  else authPwd=val;
}

function startAsGuest(){
  authMsg=''; state='menu'; bgmMenu();
  sfxBeep(440,.08);
}

async function checkDisplayName(user){
  if(!user) return;
  let name = user.displayName || '';
  if(!name || name.includes('@') || name.includes('.')){
    name = prompt('Choose your racer name (max 10 chars):','') || '';
    name = name.trim().toUpperCase().substring(0,10);
    if(name){ await user.updateProfile({displayName: name}).catch(()=>{}); }
  }
  S.name = (user.displayName||name||'RACER').toUpperCase().substring(0,10);
  doSave();
}

async function doGoogleAuth(){
  if(typeof firebase==='undefined'){ startAsGuest(); return; }
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await firebase.auth().signInWithPopup(provider);
    await checkDisplayName(result.user);
    authMsg=''; state='menu'; bgmMenu(); sfxBeep(660,.15);
  } catch(e){
    authMsgColor='#e74c3c';
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request') authMsg='Cancelled';
    else if(e.code==='auth/popup-blocked') authMsg='Popup blocked - use email login';
    else authMsg='Use email login or try the app';
  }
}

async function doForgotPassword(){
  if(typeof firebase==='undefined'){ authMsg='Not available'; return; }
  const email=authEmail||(prompt('Enter your email:')||'').trim();
  if(!email){ authMsg='Enter your email first'; authMsgColor='#e74c3c'; return; }
  try {
    await firebase.auth().sendPasswordResetEmail(email);
    authMsg='Reset email sent! Check your inbox.'; authMsgColor='#2ecc71';
  } catch(e){
    authMsgColor='#e74c3c';
    authMsg = e.code==='auth/user-not-found'?'No account found':'Error sending email';
  }
}

async function doAuth(){
  if(typeof firebase==='undefined'){ startAsGuest(); return; }
  if(!authEmail||!authPwd){ authMsg='Please fill all fields'; authMsgColor='#e74c3c'; return; }
  authMsg='...'; authMsgColor='#f0a500';
  try {
    const auth=firebase.auth();
    if(authMode==='login'){
      await auth.signInWithEmailAndPassword(authEmail,authPwd);
    } else {
      await auth.createUserWithEmailAndPassword(authEmail,authPwd);
    }
    await checkDisplayName(firebase.auth().currentUser);
    authMsg=''; state='menu'; bgmMenu(); sfxBeep(660,.15);
  } catch(e){
    authMsgColor='#e74c3c';
    if(e.code==='auth/user-not-found') authMsg='No account found';
    else if(e.code==='auth/wrong-password') authMsg='Wrong password';
    else if(e.code==='auth/email-already-in-use') authMsg='Email already used';
    else if(e.code==='auth/weak-password') authMsg='Password too short (6+)';
    else if(e.code==='auth/invalid-email') authMsg='Invalid email';
    else authMsg='Error: '+e.code;
  }
}

function _drawToggle(cx,x,y,on){
  const w=CH*.1, h=CH*.045, r=h/2;
  cx.save();
  cx.fillStyle=on?'#f0a500':'#333';
  cx.beginPath(); cx.roundRect(x-w/2,y-r,w,h,r); cx.fill();
  cx.fillStyle='#fff';
  const kx=on?x+w/2-r-2:x-w/2+r+2;
  cx.beginPath(); cx.arc(kx,y,r-2,0,Math.PI*2); cx.fill();
  cx.restore();
}

function _drawSlider(cx,x,y,w,val){
  const h=6, r=CH*.022;
  cx.save();
  cx.fillStyle='#333';
  cx.beginPath(); cx.roundRect(x,y-h/2,w,h,3); cx.fill();
  cx.fillStyle='#f0a500';
  cx.beginPath(); cx.roundRect(x,y-h/2,w*val,h,3); cx.fill();
  cx.fillStyle='#fff'; cx.strokeStyle='#f0a500'; cx.lineWidth=2;
  cx.beginPath(); cx.arc(x+w*val,y,r,0,Math.PI*2); cx.fill(); cx.stroke();
  cx.restore();
}

let _sliderDrag=false;
function settingsClick(mx,my){
  const rowH=CH*.13, startY=CH*.21;
  const sliderW=CW*.52, sliderX=CW*.24;
  const bh=CH*.095;

  // Stats button @ 58%
  if(my>=CH*.58-bh/2&&my<CH*.58+bh/2){ state='stats'; sfxBeep(440,.08); return; }
  // Change name button @ 70%
  if(my>=CH*.70-bh/2&&my<CH*.70+bh/2){
    const n=(prompt('New racer name (max 10):', S.name)||'').trim().toUpperCase().substring(0,10);
    if(n){ S.name=n; doSave();
      if(typeof firebase!=='undefined'&&firebase.auth().currentUser)
        firebase.auth().currentUser.updateProfile({displayName:n}).catch(()=>{});
    }
    return;
  }
  // Back button @ 82%
  if(my>=CH*.82-bh/2&&my<CH*.82+bh/2){ state='menu'; sfxBeep(300,.08); return; }
  // Logout button @ 93%
  if(my>=CH*.93-bh/2){
    if(typeof firebase!=='undefined' && firebase.auth().currentUser){
      firebase.auth().signOut().then(()=>{
        state='auth'; authEmail=''; authPwd=''; authMsg='';
        sfxBeep(220,.1);
      });
    }
    return;
  }

  // Music toggle
  let y=startY;
  if(Math.abs(my-y)<CH*.07 && mx>CW*.60){
    bgmToggle(); beep(bgmEnabled?440:220,.08); return;
  }
  // Volume slider
  y+=rowH;
  if(Math.abs(my-y)<CH*.08 && mx>=sliderX && mx<=sliderX+sliderW){
    const v=(mx-sliderX)/sliderW;
    setBgmVolume(v); doSave(); return;
  }
  // SFX toggle
  y+=rowH;
  if(Math.abs(my-y)<CH*.07 && mx>CW*.60){
    sfxEnabled=!sfxEnabled; doSave();
    beep(sfxEnabled?440:220,.08); return;
  }
}

let lbTab=0;
const MEDALS=['🥇','🥈','🥉'];

function drawLeaderboard(cx){
  cx.fillStyle='#0a0a14'; cx.fillRect(0,0,CW,CH);
  cx.fillStyle='#f0a500'; cx.font=`bold ${Math.round(CH*.055)}px monospace`;
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('🏆 LEADERBOARD',CW/2,CH*.07);

  // Track tabs (scrollable row)
  // Responsive tabs: fit all unlocked tracks with scroll if needed
  const _unl=S.unlockedTracks||[0];
  const _tabCount=_unl.length;
  const tabW=Math.max(Math.floor((CW-4*(_tabCount-1))/_tabCount),60);
  const tabH=CH*.065;
  const tabY=CH*.12, tabsVisible=_tabCount;
  const unlockedTr=S.unlockedTracks||[0];
  unlockedTr.slice(0,tabsVisible).forEach((ti,i)=>{
    const tx=i*tabW;
    const isSel=ti===lbTrack;
    cx.fillStyle=isSel?'#f0a500':'rgba(255,255,255,.1)';
    cx.beginPath();cx.roundRect(tx+2,tabY,tabW-4,tabH,6);cx.fill();
    cx.fillStyle=isSel?'#000':'rgba(255,255,255,.6)';
    cx.font=`bold ${Math.round(tabH*.35)}px monospace`;
    cx.textAlign='center'; cx.textBaseline='middle';
    const _tname=ALL_TRACKS[ti]?ALL_TRACKS[ti].name:'?';
    // Shrink font if name too wide
    let _tfSize=Math.round(tabH*.38);
    cx.font=`bold ${_tfSize}px monospace`;
    while(cx.measureText(_tname).width>tabW-8&&_tfSize>9){ _tfSize--; cx.font=`bold ${_tfSize}px monospace`; }
    cx.fillText(_tname,tx+tabW/2,tabY+tabH/2);
  });

  // Scores for selected track
  const tid=typeof lbTrack==='number'?lbTrack:parseInt(lbTrack)||0;
  const allScores=window._lbScores||{};
  const scores=allScores[tid]||[];
  const rowH=CH*.075, startY=CH*.22;
  const cols=['#FFD700','#C0C0C0','#CD7F32'];

  if(!scores.length){
    cx.fillStyle='rgba(255,255,255,.3)'; cx.font=`${Math.round(CH*.04)}px monospace`;
    cx.textAlign='center'; cx.fillText('No times yet on this track!',CW/2,CH*.5);
  } else {
    scores.slice(0,8).forEach((s,i)=>{
      const ry=startY+i*rowH;
      cx.fillStyle=s.name===(S.name||'YOU')?'rgba(240,165,0,.15)':'rgba(255,255,255,.05)';
      cx.beginPath();cx.roundRect(CW*.05,ry,CW*.9,rowH-4,5);cx.fill();
      cx.fillStyle=cols[i]||'rgba(255,255,255,.6)';
      cx.font=`bold ${Math.round(rowH*.5)}px monospace`;
      cx.textAlign='left'; cx.textBaseline='middle';
      cx.fillText(`${i+1}.`,CW*.07,ry+rowH/2);
      cx.fillStyle=s.name===(S.name||'YOU')?'#fff':'rgba(255,255,255,.8)';
      cx.font=`${Math.round(rowH*.44)}px monospace`;
      cx.fillText((s.name||'???').substring(0,12),CW*.13,ry+rowH/2);
      const t=s.time,m=Math.floor(t/60),ss=String(Math.floor(t%60)).padStart(2,'0'),ms=String(Math.floor((t%1)*100)).padStart(2,'0');
      cx.fillStyle='rgba(255,255,255,.6)'; cx.textAlign='right';
      cx.fillText(m+':'+ss+'.'+ms,CW*.92,ry+rowH/2);
    });
  }

  // Back button
  btn(cx,CW/2-CW*.25,CH*.87,CW*.5,CH*.1,'#f0a500','#000',8);
  cx.fillStyle='#000'; cx.font=`bold ${Math.round(CH*.035)}px monospace`;
  cx.textAlign='center'; cx.textBaseline='middle';

function leaderboardClick(mx,my){
  // Back button - large area at bottom OR top-left
  if((my>CH*.84)||(my<CH*.12&&mx<CW*.15)){
    state='menu'; sfxBeep(300,.08); return;
  }
  // Track tab clicks
  const _unl=S.unlockedTracks||[0];
  const _tabsPerRow=Math.min(_unl.length, Math.floor(CW/(Math.round(CW/6))));
  const _tabW=Math.floor((CW-3*(_tabsPerRow-1))/_tabsPerRow);
  const _tabH=Math.round(CH*.058);
  _unl.forEach((ti,i)=>{
    const row=Math.floor(i/_tabsPerRow), col=i%_tabsPerRow;
    const tx=col*(_tabW+3), ty=CH*.11+row*(_tabH+3);
    if(mx>=tx&&mx<=tx+_tabW&&my>=ty&&my<=ty+_tabH){
      lbTrack=ti; loadLbScores(); sfxBeep(440,.06);
    }
  });
}

  const _rows_ach=Math.ceil(ACHIEVEMENTS.length/2);
  const _cH2_ach=Math.max(90,Math.round(CH*.20));
  const _gap_ach=Math.round(CH*.018);
  const _headerH_ach=CH*.13;
  const _maxScroll_ach=Math.max(0,_rows_ach*(_cH2_ach+_gap_ach)+_headerH_ach-CH+20);
  scroll.ach=Math.min(scroll.ach, _maxScroll_ach);
  const _sOff=scroll.ach;

  // Achievement grid — 2 columns, bigger cards, scrollable
  const cols=2;
  const padX=CW*.04, headerH=CH*.13;
  const cW2=(CW-padX*2-(cols-1)*padX*.5)/cols;
  const cH2=Math.max(90,Math.round(CH*.20));
  const gap=Math.round(CH*.018);

  const ach=S.achievements||{};
  const done=ACHIEVEMENTS.filter(a=>ach[a.id]).length;

  function _prog(a){
    if(ach[a.id]) return null;
    if(a.id==='collector')   return {cur:Math.min((S.unlocked||[]).length,5),max:5};
    if(a.id==='globetrotter')return {cur:Math.min((S.racedTracks||[]).length,5),max:5};
    if(a.id==='nos_junkie')  return {cur:Math.min(S.nosCount||0,20),max:20};
    if(a.id==='veteran')     return {cur:Math.min(S.totalRaces||0,25),max:25};
    if(a.id==='podium')      return {cur:Math.min(S.podiumCount||0,10),max:10};
    return null;
  }

  ACHIEVEMENTS.forEach((a,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const cx2=padX+col*(cW2+padX*.5);
    const cy2=headerH+row*(cH2+gap)-_sOff;
    if(cy2+cH2<0||cy2>CH) return;
    const unlocked=!!ach[a.id];
    const prog=_prog(a);

    // Card BG
    cx.fillStyle=unlocked?'rgba(240,165,0,.18)':'rgba(255,255,255,.07)';
    cx.strokeStyle=unlocked?'rgba(240,165,0,.45)':'rgba(255,255,255,.12)';
    cx.lineWidth=1.5;
    cx.beginPath();cx.roundRect(cx2,cy2,cW2,cH2,10);cx.fill();cx.stroke();
    if(!unlocked){ cx.fillStyle='rgba(0,0,0,.2)';cx.beginPath();cx.roundRect(cx2,cy2,cW2,cH2,10);cx.fill(); }

    // Icon
    const iconSz=Math.round(cH2*.5);
    cx.font=`${iconSz}px monospace`;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.globalAlpha=unlocked?1:.3;
    cx.fillText(a.icon, cx2+iconSz*.6, cy2+cH2*.38);
    cx.globalAlpha=1;

    // Name - larger
    const tx=cx2+iconSz*1.25;
    cx.fillStyle=unlocked?'#f0a500':'rgba(255,255,255,.45)';
    cx.font=`bold ${Math.round(CH*.033)}px monospace`;
    cx.textAlign='left'; cx.textBaseline='top';
    cx.fillText(a.name.toUpperCase(), tx, cy2+cH2*.08);

    // Description - larger
    cx.fillStyle=unlocked?'rgba(255,255,255,.85)':'rgba(255,255,255,.35)';
    cx.font=`${Math.round(CH*.026)}px monospace`;
    cx.fillText(a.desc, tx, cy2+cH2*.38);

    // Progress bar
    if(prog){
      const bW=cW2-iconSz*1.25-padX*.3, bH=5, bX=tx, bY=cy2+cH2*.68;
      cx.fillStyle='rgba(255,255,255,.1)';cx.beginPath();cx.roundRect(bX,bY,bW,bH,2);cx.fill();
      if(prog.cur>0){ cx.fillStyle='#f0a500';cx.beginPath();cx.roundRect(bX,bY,(prog.cur/prog.max)*bW,bH,2);cx.fill(); }
      cx.fillStyle='rgba(255,255,255,.55)'; cx.font=`bold ${Math.round(CH*.022)}px monospace`;
      cx.textAlign='right'; cx.textBaseline='top';
      cx.fillText(`${prog.cur}/${prog.max}`, cx2+cW2-6, cy2+cH2*.58);
    }

    // Unlock date
    if(unlocked){
      const d=new Date(ach[a.id]);
      const ds=d.toLocaleDateString('sv-SE',{month:'short',day:'numeric'});
      cx.fillStyle='rgba(240,165,0,.75)'; cx.font=`${Math.round(CH*.02)}px monospace`;
      cx.textAlign='right'; cx.textBaseline='bottom';
      cx.fillText('✓ '+ds, cx2+cW2-6, cy2+cH2*.96);
    }
  });

  // Fixed header on top
  cx.fillStyle='#080810'; cx.fillRect(0,0,CW,headerH);
  const _bW2=Math.max(110,CW*.2), _bH2=CH*.07;
  cx.fillStyle='rgba(255,255,255,.12)'; cx.strokeStyle='rgba(255,255,255,.3)'; cx.lineWidth=1.5;
  cx.beginPath();cx.roundRect(6,4,_bW2,_bH2,8);cx.fill();cx.stroke();
  cx.fillStyle='#fff'; cx.font=`bold ${Math.round(CH*.036)}px monospace`;
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('◀ BACK',6+_bW2/2,4+_bH2/2);
  cx.fillStyle='#f0a500'; cx.font=`bold ${Math.round(CH*.044)}px monospace`;
  cx.textAlign='center'; cx.fillText('🎖️  ACHIEVEMENTS',CW/2,CH*.058);
  const pbW=CW*.5, pbH=6, pbX=CW/2-pbW/2, pbY=CH*.1;
  cx.fillStyle='rgba(255,255,255,.1)';cx.beginPath();cx.roundRect(pbX,pbY,pbW,pbH,3);cx.fill();
  if(done>0){ const gr=cx.createLinearGradient(pbX,0,pbX+pbW,0);gr.addColorStop(0,'#f0a500');gr.addColorStop(1,'#ffdd44');cx.fillStyle=gr;cx.beginPath();cx.roundRect(pbX,pbY,(done/ACHIEVEMENTS.length)*pbW,pbH,3);cx.fill(); }
  cx.fillStyle='rgba(255,255,255,.55)'; cx.font=`bold ${Math.round(CH*.026)}px monospace`;
  cx.textAlign='center'; cx.textBaseline='top';
  cx.fillText(`${done} / ${ACHIEVEMENTS.length} UNLOCKED`,CW/2,pbY+pbH+4);
}

function garageClick(mx,my){
  const sel=CAR_DEFS[garageIdx]||CAR_DEFS[0];
  const isUnlocked=(S.unlocked||['banger']).includes(sel.id);
  const _arW2=Math.round(Math.min(CW*.13,CH*.11))+6, _arY2=CH*.38, _arH2=Math.round(CH*.22);

  // BACK button - top bar area
  if(my<CH*.1){ state='menu'; sfxBeep(300,.08); return; }

  // Left arrow
  if(mx<=_arW2&&my>=_arY2&&my<=_arY2+_arH2){
    if(garageIdx>0){ garageIdx--; sfxBeep(400,.06); } return;
  }
  // Right arrow
  if(mx>=CW-_arW2&&my>=_arY2&&my<=_arY2+_arH2){
    if(garageIdx<CAR_DEFS.length-1){ garageIdx++; sfxBeep(400,.06); } return;
  }

  // Right panel interactions (mx > CW*.45)
  if(mx<CW*.45) return; // left panel = car display only

  const rX=CW*.48, rW=CW*.5;

  // Color swatches
  const _cols=['#ff3333','#ff8800','#ffdd00','#33cc33','#3399ff','#cc44ff','#ffffff','#777'];
  const swSz=Math.round(Math.min(CH*.065,rW*.1));
  const swY=CH*.58;
  if(my>=swY&&my<=swY+swSz){
    const ci=Math.floor((mx-rX)/(swSz+4));
    if(ci>=0&&ci<_cols.length){
      if(!S.carColors)S.carColors={};
      S.carColors[sel.id]=_cols[ci]; doSave(); sfxBeep(660,.06); return;
    }
  }

  // Upgrade buttons
  if(isUnlocked&&my>=CH*.67&&my<=CH*.67+CH*.072){
    const ucW=rW*.92/3-4;
    const uTypes=[{k:'engine'},{k:'grip'},{k:'nos'}];
    uTypes.forEach((u,i)=>{
      const ux=rX+i*(ucW+6);
      if(mx>=ux&&mx<=ux+ucW) buyUpgrade(sel.id,u.k);
    });
    return;
  }

  // Action button
  const btnW=rW*.92, btnH=CH*.105, btnY=CH*.82;
  if(my>=btnY&&my<=btnY+btnH&&mx>=rX&&mx<=rX+btnW){
    if(isUnlocked){
      S.selected=sel.id; doSave(); sfxBeep(440,.1);
    } else if(S.coins>=sel.price){
      S.coins-=sel.price;
      if(!S.unlocked) S.unlocked=['banger'];
      S.unlocked.push(sel.id); S.selected=sel.id; doSave();
      sfxBeep(660,.08);setTimeout(()=>sfxBeep(880,.1),100);setTimeout(()=>sfxBeep(1100,.15),220);
      window._unlockFlash=1.5;
    }
  }
}

function updCtrl(){
  // Start from keyboard state — touch adds on top, never erases KB state
  ctrlL=KB.L; ctrlR=KB.R; ctrlB=KB.B; ctrlN=KB.N; ctrlGas=KB.L||KB.R||KB.N;
  const lay=ctrlLayout();
  for(const id in AT){
    const {x,y}=AT[id];
    if(Math.hypot(x-lay.nos.x,y-lay.nos.y)<lay.nos.r){ ctrlN=true; ctrlGas=true; continue; }
    if(Math.hypot(x-lay.brk.x,y-lay.brk.y)<lay.brk.r){ ctrlB=true; continue; }
    ctrlGas=true;
    if(x>=lay.lz.x&&x<lay.lz.x+lay.lz.w&&y>=lay.lz.y) ctrlL=true;
    if(x>=lay.rz.x&&x<lay.rz.x+lay.rz.w&&y>=lay.rz.y) ctrlR=true;
  }
}

function setupRace(){
  const t0=TRK[0], t1=TRK[1];
  let dx=t1.x-t0.x, dy=t1.y-t0.y, ln=Math.sqrt(dx*dx+dy*dy)||1; dx/=ln; dy/=ln;
  const nx=-dy, ny=dx;
  const sa=Math.atan2(t1.x-t0.x,-(t1.y-t0.y));
  const pl=new Car(t0.x,t0.y,sa,S.selected,true);

  // AI scaled to player's car price tier
  const playerDef2=CAR_DEFS.find(c=>c.id===S.selected)||CAR_DEFS[0];
  const sorted2=[...CAR_DEFS.filter(c=>c.id!==S.selected)].sort((a,b)=>Math.abs(a.price-playerDef2.price)-Math.abs(b.price-playerDef2.price));
  const aiPool2=sorted2.slice(0,Math.min(8,sorted2.length)).sort(()=>Math.random()-.5);
  const aiSkill=[0.92,0.82,0.74,0.65];
  const ai=[];
  [[-1,1],[1,1],[-1,2],[1,2]].forEach(([s,row],i)=>{
    const aDef=aiPool2[i%aiPool2.length];
    const car=new Car(t0.x-dx*55*row+nx*28*s, t0.y-dy*55*row+ny*28*s, sa, aDef.id);
    car.aiI=(i+1)*6; car.aiM=aiSkill[i]+(Math.random()-.5)*.06; car.aiReact=0.8+i*0.15;
    ai.push(car);
  });

  return { pl, ai, cam:{x:t0.x,y:t0.y} };
}

  // Add best lap to results
  if(_bestLapT>0){
    const _blm=Math.floor(_bestLapT/60),_bls=String(Math.floor(_bestLapT%60)).padStart(2,'0'),_blms=String(Math.floor((_bestLapT%1)*100)).padStart(2,'0');
    resReasons.push('Best lap: '+_blm+':'+_bls+'.'+_blms);
  }
  if(_chalEarned>0){
    resReasons.push('🎯 Daily bonus: +$'+_chalEarned+'!');
    S.coins+=0; // already added in checkChallenges, just trigger display
  }
  // Upload ghost if personal best on this track
  const _tid=S.currentTrack||0;
  // Save best completed lap ghost
  const _ghost=cars[0].lapGhost;
  if(_ghost&&_ghost.frames&&_ghost.frames.length>10){
    fbSaveGhost(_tid,_ghost.frames,_ghost.lapTime,entry.name,S.selected);
  }
  state='results';
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let lastT=0;
function loop(now){
  const dt=Math.min((now-lastT)/1000,0.033); lastT=now;
  const SC=getScale();
  G.clearRect(0,0,CW,CH);

  try {
    if(state==='auth'){
      drawAuth(G);

    } else if(state==='menu'){
      drawMenu(G);

    } else if(state==='achievements'){
      drawAchievements(G);
    } else if(state==='garage'){
      drawGarage(G);
      // Unlock flash overlay
      if(window._unlockFlash>0){ window._unlockFlash-=dt*2;
        G.save(); G.globalAlpha=Math.max(0,window._unlockFlash*0.5);
        G.fillStyle='rgba(240,165,0,1)'; G.fillRect(0,0,CW,CH);
        G.globalAlpha=Math.min(1,window._unlockFlash);
        G.font=`bold ${Math.round(CH*.08)}px Impact,monospace`;
        G.textAlign='center'; G.textBaseline='middle';
        G.fillStyle='#000'; G.fillText('🏎️ UNLOCKED!',CW/2,CH*.5);
        G.restore();
      }

    } else if(state==='tracks'){
      drawTrackSelect(G);

    } else if(state==='leaderboard'){
      drawTrack(G,{x:TRK[0].x,y:TRK[0].y},getScale(true));
      drawVignette(G);
      drawLeaderboard(G);

    } else if(state==='results'){
      drawResults(G,cam,getScale(true));
      updateDrawConfetti(G,dt);
      drawLapPopup(G,dt);

    } else if(state==='settings'){
      drawSettings(G);

    } else if(state==='daily'){
      drawDaily(G);

    } else if(state==='shop'){
      drawShop(G);

    } else if(state==='stats'){
      drawStats(G);

    } else {
      // countdown / racing
      if(state==='countdown'){
        cdT+=dt;
        if(cdT>=1){ cdT=0; cdN--; beep(cdN>0?440*Math.pow(1.25,3-cdN):880,cdN>0?.15:.3); if(cdN<=0){ state='racing'; _goFlash=0.6; } }
      } else if(state==='racing'){
        raceT+=dt;
        const pl=cars[0];
        for(const c of cars){
          const p=c.isP;
          c.update(dt, p?ctrlL:false, p?ctrlR:false, p?ctrlB:false, p?ctrlN:false, raceT);
        }
        doCollisions(cars);
        updParts(dt); updDriftPops(dt);
        if(Math.abs(pl.sp)>22&&Math.random()<0.3)
          addDust(pl.x,pl.y,pl.off?'#c08040':'#c8a878');
        updateEngine(pl.sp, pl.def.top);
        // Drift combo bonus
        if(pl.isDrifting && !pl.off && Math.abs(pl.sp) > 30){
          _driftTime += dt;
          _driftCombo = Math.min(4, Math.floor(_driftTime/1.5)+1);
          if(_driftTime > 0.4){
          const _before=Math.round(_driftBonus);
          _driftBonus += dt * _driftCombo * 2;
          if(Math.round(_driftBonus)>_before && Math.round(_driftBonus)%5===0) sfxCoin();
        }
        } else if(!pl.isDrifting) {
          _driftTime = Math.max(0, _driftTime - dt*2);
          if(_driftTime < 0.1) _driftCombo = 0;
        }
        setScreech(pl.isDrifting&&!pl.off);
        // Camera look-ahead
        const la=90, tx=pl.x+Math.sin(pl.a)*la, ty=pl.y-Math.cos(pl.a)*la;
        cam.x+=(tx-cam.x)*.13; cam.y+=(ty-cam.y)*.13;
        // Shake decay
        camShake*=0.84; const _sh=camShake*0.7; camSX=Math.sin(now*.031)*_sh; camSY=Math.cos(now*.047)*_sh;
        // Lap time tracking
        if(pl.lap>0 && pl._lastLapRecorded!==pl.lap){
          pl._lastLapRecorded=pl.lap;
          const _lapT=raceT-_lapStartT;
          _lapStartT=raceT; _lastLapT=_lapT;
          const _isBestLap=_bestLapT===0||_lapT<_bestLapT;
          if(_isBestLap) _bestLapT=_lapT;
          showLapPopup(_lapT, _isBestLap);
        }
        // Position change detection
        const _cSorted=[...cars].sort((a,b)=>b.lap!==a.lap?b.lap-a.lap:b.dist-a.dist);
        const _curPos=_cSorted.findIndex(c=>c.isP)+1;
        if(_lastPos>0&&_curPos>0&&_curPos!==_lastPos&&raceT>3){
          _posDir=_curPos<_lastPos?1:-1; _posFlash=1.5; sfxOvertake(_posDir>0);
        }
        if(_curPos>0) _lastPos=_curPos;
        if(pl.lap>=(TDEF&&TDEF.laps?TDEF.laps:LAPS)) finishRace();
      }

      // World draw (with shake)
      G.save();
      G.translate(CW/2+camSX,CH/2+camSY); G.rotate(0); G.translate(-CW/2,-CH/2);
      drawTrack(G,cam,SC);
      drawRamps(G,cam,SC);
      drawParts(G,cam,SC);
      // Firebase ghost car with interpolation
      if(ghostData&&ghostData.frames&&ghostData.frames.length>1){
        const _gf=ghostData.frames;
        const _lastT=_gf[_gf.length-1].t||30;
        const _t=raceT%_lastT;
        // Find surrounding frames for interpolation
        let _gi=0;
        for(let i=1;i<_gf.length;i++){
          if(_gf[i].t<=_t) _gi=i; else break;
        }
        const _a=_gf[_gi], _b=_gf[Math.min(_gi+1,_gf.length-1)];
        const _span=_b.t-_a.t;
        const _frac=_span>0?Math.min(1,(_t-_a.t)/_span):0;
        // Lerp position, lerp angle (handle wrap)
        const _ix=_a.x+(_b.x-_a.x)*_frac;
        const _iy=_a.y+(_b.y-_a.y)*_frac;
        let _da=_b.a-_a.a;
        if(_da>Math.PI) _da-=Math.PI*2;
        if(_da<-Math.PI) _da+=Math.PI*2;
        const _ia=_a.a+_da*_frac;
        const _gDef=CAR_DEFS.find(d=>d.id===ghostData.car)||CAR_DEFS[0];
        cars[0].drawGhost.call({...cars[0],x:_ix,y:_iy,a:_ia,def:_gDef},G,cam,SC);
      }
      [...cars].sort((a,b)=>a.y-b.y).forEach(c=>c.draw(G,cam,SC));
      G.restore();

      drawVignette(G);
      if(state==='racing'){ const _nosB=Math.max(1.4,cars[0].def.nos+0.35); const _top=cars[0].nosFlame>0.1?cars[0].def.top*_nosB:cars[0].def.top; drawSpeedLines(G, cars[0].speed(), _top); }
      if(state==='racing') drawDriftPops(G,cam,SC);
      // minimap hidden in full-track view
      updateDrawWeather(G,dt,S.currentTrack||0);
      drawHUD(G, cars[0], cars, raceT);
      // Ghost time delta
      if(typeof window._ghostDelta==='number'&&state==='racing'){
        const _gd=window._ghostDelta;
        const _gdAbs=Math.abs(_gd).toFixed(2);
        const _gdCol=_gd<0?'#00ff88':'#ff4444';
        const _gdTxt=(_gd<0?'-':'+')+'0:'+_gdAbs.padStart(5,'0');
        G.save(); G.font=`bold ${Math.round(CH*.034)}px monospace`;
        G.textAlign='center'; G.textBaseline='middle';
        G.fillStyle='rgba(0,0,0,.4)'; G.fillText('👻 '+_gdTxt,CW/2+1,CH*.085+1);
        G.fillStyle=_gdCol; G.fillText('👻 '+_gdTxt,CW/2,CH*.085);
        G.restore();
      }
      // Win streak display
      if((S.winStreak||0)>=2&&state==='racing'){
        G.save(); G.font=`bold ${Math.round(CH*.032)}px monospace`;
        G.textAlign='left'; G.textBaseline='middle';
        G.fillStyle='rgba(0,0,0,.4)'; G.fillText('🔥 '+S.winStreak+' WIN STREAK',CW*.04+1,CH*.16+1);
        G.fillStyle='#ff6600'; G.fillText('🔥 '+S.winStreak+' WIN STREAK',CW*.04,CH*.16);
        G.restore();
      }
      // Drift combo display
      if(state==='racing' && _driftCombo>0 && _driftTime>0.4){
        G.save();
        G.textAlign='center'; G.textBaseline='middle';
        const _dc=Math.round(_driftBonus);
        G.font=`bold ${Math.round(CH*.05)}px monospace`;
        G.fillStyle=`rgba(255,${180-_driftCombo*20},0,${0.7+Math.sin(raceT*8)*0.3})`;
        G.fillText('DRIFT x'+_driftCombo+' +$'+_dc, CW/2, CH*.15);
        G.restore();
      }
      updateDrawConfetti(G,dt);
      drawLapPopup(G,dt);
      // Position change flash
      if(_posFlash>0){ _posFlash-=dt*2;
        G.save(); G.globalAlpha=Math.max(0,_posFlash*0.6);
        G.font=`bold ${Math.round(CH*.06)}px Impact,monospace`;
        G.textAlign='left'; G.textBaseline='middle';
        G.fillStyle=_posDir>0?'#00ff66':'#ff4444';
        G.fillText(_posDir>0?'▲ OVERTAKE!':'▼ OVERTAKEN!',CW*.04,CH*.22);
        G.restore();
      }
      // NEW BEST flash
      if(_newBest>0){
        _newBest-=dt;
        const _a=Math.min(1,_newBest);
        G.save(); G.globalAlpha=_a;
        G.font=`bold ${Math.round(CH*.07)}px Impact,monospace`;
        G.textAlign='center'; G.textBaseline='middle';
        G.fillStyle='rgba(0,0,0,.5)';
        G.fillText('⚡ NEW BEST!',CW/2+2,CH*.38+2);
        G.fillStyle='#ffdd00';
        G.fillText('⚡ NEW BEST!',CW/2,CH*.38);
        G.restore();
      }
      // GO flash
      if(_goFlash>0){ _goFlash-=dt*3;
        G.save(); G.globalAlpha=Math.max(0,_goFlash);
        G.fillStyle='rgba(0,255,100,0.25)'; G.fillRect(0,0,CW,CH);
        G.font=`bold ${Math.round(CH*.12)}px Impact,monospace`;
        G.textAlign='center'; G.textBaseline='middle';
        G.fillStyle='#00ff66'; G.fillText('GO!',CW/2,CH*.45);
        G.restore();
      }
      if(state==='countdown') drawCountdown(G, cdN, cdT);
      // Streak popup
      if(window._streakPopup&&window._streakPopup.t>0){
        window._streakPopup.t-=dt;
        const sp=window._streakPopup, a=Math.min(1,sp.t);
        G.save(); G.globalAlpha=a;
        G.fillStyle='rgba(255,140,0,.9)';
        G.beginPath();G.roundRect(CW*.15,CH*.15,CW*.7,CH*.12,10);G.fill();
        G.fillStyle='#000';G.font=`bold ${Math.round(CH*.038)}px monospace`;
        G.textAlign='center';G.textBaseline='middle';
        G.fillText('🔥 '+sp.streak+'-DAY STREAK! +'+sp.coins+' coins',CW/2,CH*.21);
        G.restore();
      }
      drawCtrl(G, ctrlL, ctrlR, ctrlN, ctrlB, cars[0], raceT);
    }
  } catch(err){
    console.error('Loop error:', err);
    G.fillStyle='rgba(0,0,0,.8)'; G.fillRect(0,0,CW,CH);
    G.fillStyle='#ff4444'; G.font='14px monospace'; G.textAlign='center';
    G.fillText('Error: '+err.message, CW/2, CH/2);
    G.fillStyle='rgba(255,255,255,.5)'; G.font='11px monospace';
    G.fillText('Tap to return to menu', CW/2, CH/2+28);
    state='menu'; bgmMenu(); camRot=0; camShake=0;
  }

  requestAnimationFrame(loop);
}

// ─── FIREBASE AUTH OBSERVER ───────────────────────────────────────────────────
if(typeof firebase !== 'undefined'){
  firebase.auth().onAuthStateChanged(async user=>{
    if(user){
      S.name = user.displayName || user.email.split('@')[0].substring(0,10).toUpperCase();
      // Load cloud save to restore coins, cars, progress
      const restored = await fbLoadProgress(S.name);
      if(restored) showCloudRestoreMsg();
      if(state==='auth'){ state='menu'; bgmMenu(); }
    }
  });
}

fbLoadAdminReset();
requestAnimationFrame(t=>{ lastT=t; requestAnimationFrame(loop); });
</script></body></html>
