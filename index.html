<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dust Devils Rally">
<meta name="theme-color" content="#111111">
<title>Dust Devils Rally</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #111;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    width: 100%;
    height: 100%;
  }
  canvas { display: block; }

  /* Landscape nudge for portrait phones */
  #rotate-msg {
    display: none;
    position: fixed;
    inset: 0;
    background: #111;
    color: #ffdd33;
    font: bold 18px monospace;
    text-align: center;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 999;
  }
  #rotate-msg span { font-size: 52px; }
  @media (orientation: portrait) and (max-width: 600px) {
    #rotate-msg { display: flex; }
  }
</style>
</head>
<body>

<div id="rotate-msg">
  <span>&#8635;</span>
  Rotate your phone to landscape<br>for the best experience!
</div>

<canvas id="c"></canvas>

<script>
// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
const C = document.getElementById('c');
const G = C.getContext('2d');
let CW, CH;
function resize() { CW = C.width = window.innerWidth; CH = C.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
if (!G.roundRect) G.roundRect = function(x,y,w,h,r){ this.rect(x,y,w,h); };

// ─── AUDIO ───────────────────────────────────────────────────────────────────
let AC;
function iAudio() {
  if (!AC) try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) {}
}
function beep(f, d, v=0.22, type='square') {
  if (!AC) return;
  if (AC.state === 'suspended') AC.resume();
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
  o.start(); o.stop(AC.currentTime + d + 0.02);
}

// ─── TRACK DEFINITION ────────────────────────────────────────────────────────
const RAW = [
  {x:450,y:880},{x:760,y:880},{x:1060,y:880},
  {x:1310,y:760},{x:1490,y:540},{x:1530,y:300},
  {x:1380,y:140},{x:1120,y:130},{x:870,y:100},
  {x:620,y:155},{x:390,y:290},{x:250,y:490},
  {x:220,y:710},{x:310,y:840},
];
const RSTEPS = 18, TW = 100;

function cr(a,b,c,d,t) {
  const t2=t*t, t3=t2*t;
  return {
    x: .5*((2*b.x)+(-a.x+c.x)*t+(2*a.x-5*b.x+4*c.x-d.x)*t2+(-a.x+3*b.x-3*c.x+d.x)*t3),
    y: .5*((2*b.y)+(-a.y+c.y)*t+(2*a.y-5*b.y+4*c.y-d.y)*t2+(-a.y+3*b.y-3*c.y+d.y)*t3)
  };
}
function buildSpline(raw, st) {
  const n = raw.length, out = [];
  for (let i=0; i<n; i++) {
    const a=raw[(i-1+n)%n], b=raw[i], c=raw[(i+1)%n], d=raw[(i+2)%n];
    for (let j=0; j<st; j++) out.push(cr(a,b,c,d,j/st));
  }
  return out;
}
const TRK = buildSpline(RAW, RSTEPS);
const TN = TRK.length;

function nearD2(x,y) {
  let m = Infinity;
  for (let i=0; i<TN; i++) { const dx=TRK[i].x-x, dy=TRK[i].y-y; const d=dx*dx+dy*dy; if(d<m) m=d; }
  return m;
}
function tProg(x,y) {
  let m=Infinity, mi=0;
  for (let i=0; i<TN; i++) { const dx=TRK[i].x-x, dy=TRK[i].y-y; const d=dx*dx+dy*dy; if(d<m){m=d;mi=i;} }
  return mi/TN;
}

// Precompute corner markers
const MRKS = [];
for (let i=0; i<TN; i+=14) {
  const t=TRK[i], n=TRK[(i+1)%TN];
  let dx=n.x-t.x, dy=n.y-t.y, ln=Math.sqrt(dx*dx+dy*dy)||1; dx/=ln; dy/=ln;
  const nx=-dy, ny=dx;
  MRKS.push({ lx:t.x+nx*TW, ly:t.y+ny*TW, rx:t.x-nx*TW, ry:t.y-ny*TW, alt:Math.floor(i/14)%2 });
}

// ─── SCALE ───────────────────────────────────────────────────────────────────
// Dynamically computed so the full circuit fits (landscape) or partial (portrait)
function getScale() {
  const landscape = CW > CH;
  // Track world bounds
  let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
  for (const p of TRK) { xn=Math.min(xn,p.x); xx=Math.max(xx,p.x); yn=Math.min(yn,p.y); yx=Math.max(yx,p.y); }
  const tw = xx-xn+TW*2, th = yx-yn+TW*2;
  if (landscape) {
    // In landscape: show full track height, crop width (camera pans)
    return Math.min(CH/th, CW/tw) * (landscape ? 0.92 : 0.6);
  }
  return 0.44;
}

// ─── CAR CLASS ───────────────────────────────────────────────────────────────
const LAPS = 3;

class Car {
  constructor(x,y,a,col,isP) {
    this.x=x; this.y=y; this.a=a; this.sp=0;
    this.col=col; this.isP=isP;
    this.nos=isP?100:55; this.lap=0;
    this.pp=0; this.mid=false;
    this.aiI=0; this.aiM=0.68+Math.random()*0.28;
    this.off=false; this.total=0;
    this.nosFlame=0;
    // skid trail
    this.trail=[];
  }

  upd(dt, L, R, B, N) {
    if (this.isP) {
      const mx = (N && this.nos > 0) ? 530 : 370;
      this.sp = Math.min(this.sp + 310*dt, mx);
      if (B) this.sp = Math.max(this.sp - 470*dt, -55);
      const tr = 3.1 * Math.min(1, Math.abs(this.sp)/110);
      if (L) this.a -= tr*dt;
      if (R) this.a += tr*dt;
      if (N && this.nos > 0) { this.nos = Math.max(0, this.nos - 52*dt); this.nosFlame = 1; }
      else { this.nos = Math.min(100, this.nos + 11*dt); this.nosFlame = Math.max(0, this.nosFlame - 0.1); }
    } else {
      const wp = TRK[this.aiI];
      const dx=wp.x-this.x, dy=wp.y-this.y, dist=Math.sqrt(dx*dx+dy*dy);
      const want = Math.atan2(dx,-dy);
      let diff = want - this.a;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      this.a += Math.sign(diff) * Math.min(Math.abs(diff), 3.3*dt);
      if (dist < 95) this.aiI = (this.aiI + 9) % TN;
      this.sp += (315*this.aiM - this.sp) * 2.2*dt;
    }

    this.off = nearD2(this.x, this.y) > TW*TW;
    if (this.off) this.sp *= Math.pow(0.22, dt);

    this.x += Math.sin(this.a) * this.sp * dt;
    this.y -= Math.cos(this.a) * this.sp * dt;

    // Lap counting
    const prog = tProg(this.x, this.y);
    if (this.pp < 0.4 && prog >= 0.4) this.mid = true;
    if (this.mid && this.pp > 0.85 && prog < 0.15) {
      this.lap++;
      this.mid = false;
      if (this.isP) { beep(660,0.08); setTimeout(()=>beep(880,0.2),100); }
    }
    this.pp = prog;
    this.total = this.lap + prog;
  }

  draw(cx, cam, SC) {
    const sx=(this.x-cam.x)*SC+CW/2, sy=(this.y-cam.y)*SC+CH/2;
    const sw=17*SC, sh=30*SC;
    cx.save(); cx.translate(sx,sy); cx.rotate(this.a);
    // shadow
    cx.globalAlpha=0.18; cx.fillStyle='#000';
    cx.beginPath(); cx.ellipse(1.5,2.5,sw*.65,sh*.26,0,0,Math.PI*2); cx.fill(); cx.globalAlpha=1;
    // body
    cx.fillStyle=this.col;
    cx.beginPath(); cx.roundRect(-sw/2,-sh/2,sw,sh,2.5); cx.fill();
    // cabin
    cx.fillStyle='rgba(0,0,0,.42)';
    cx.beginPath(); cx.roundRect(-sw*.3,-sh*.26,sw*.6,sh*.36,1.5); cx.fill();
    // centre stripe
    cx.fillStyle='rgba(255,255,255,.12)'; cx.fillRect(-sw*.1,-sh/2,sw*.2,sh);
    // headlights
    cx.fillStyle='#ffe87a';
    cx.fillRect(-sw/2,-sh/2,sw*.28,3.5);
    cx.fillRect(sw/2-sw*.28,-sh/2,sw*.28,3.5);
    // tail lights
    cx.fillStyle='#ff3333';
    cx.fillRect(-sw/2,sh/2-3.5,sw*.28,3.5);
    cx.fillRect(sw/2-sw*.28,sh/2-3.5,sw*.28,3.5);
    // NOS flame
    if (this.isP && this.nosFlame > 0.05) {
      const fl = this.nosFlame*sh*.45+4;
      cx.globalAlpha=this.nosFlame*.75; cx.fillStyle='#44aaff';
      cx.beginPath(); cx.moveTo(-sw*.16,sh/2); cx.lineTo(0,sh/2+fl); cx.lineTo(sw*.16,sh/2); cx.fill();
      cx.globalAlpha=0.4; cx.fillStyle='#fff';
      cx.beginPath(); cx.moveTo(-sw*.07,sh/2); cx.lineTo(0,sh/2+fl*.5); cx.lineTo(sw*.07,sh/2); cx.fill();
      cx.globalAlpha=1;
    }
    cx.restore();
  }
}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
let parts = [];
function addDust(x,y,c,n=2) {
  for (let i=0; i<n; i++)
    parts.push({x,y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,l:.55,m:.55,r:2.5+Math.random()*3,c});
}
function updParts(dt) {
  for (let i=parts.length-1; i>=0; i--) {
    const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.93; p.vy*=.93; p.l-=dt;
    if (p.l<=0) parts.splice(i,1);
  }
}
function drawParts(cx, cam, SC) {
  for (const p of parts) {
    const a=p.l/p.m, sx=(p.x-cam.x)*SC+CW/2, sy=(p.y-cam.y)*SC+CH/2;
    cx.globalAlpha=a*.42; cx.fillStyle=p.c;
    cx.beginPath(); cx.arc(sx,sy,p.r*a+.8,0,Math.PI*2); cx.fill();
  }
  cx.globalAlpha=1;
}

// ─── TRACK DRAWING ────────────────────────────────────────────────────────────
function drawTrack(cx, cam, SC) {
  cx.fillStyle='#3b7228'; cx.fillRect(0,0,CW,CH);
  cx.save(); cx.translate(CW/2-cam.x*SC, CH/2-cam.y*SC); cx.scale(SC,SC);

  function tp() {
    cx.beginPath(); cx.moveTo(TRK[0].x,TRK[0].y);
    for (let i=1; i<TN; i++) cx.lineTo(TRK[i].x,TRK[i].y);
    cx.closePath();
  }
  cx.lineJoin='round'; cx.lineCap='round';
  tp(); cx.strokeStyle='#604520'; cx.lineWidth=TW*2+20; cx.stroke();
  tp(); cx.strokeStyle='#b87840'; cx.lineWidth=TW*2;    cx.stroke();
  tp(); cx.strokeStyle='#cc9060'; cx.lineWidth=TW*2-26; cx.stroke();
  tp(); cx.strokeStyle='rgba(70,40,15,.18)'; cx.lineWidth=16; cx.stroke();

  cx.setLineDash([22,30]);
  tp(); cx.strokeStyle='rgba(255,240,160,.18)'; cx.lineWidth=2.5; cx.stroke();
  cx.setLineDash([]);

  // Corner markers
  for (const m of MRKS) {
    cx.fillStyle = m.alt ? '#cc1111' : '#eeeeee';
    cx.beginPath(); cx.arc(m.lx,m.ly,4.5,0,Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(m.rx,m.ry,4.5,0,Math.PI*2); cx.fill();
  }

  // Start/finish line
  const t0=TRK[0], t1=TRK[1];
  let fx=t1.x-t0.x, fy=t1.y-t0.y, fln=Math.sqrt(fx*fx+fy*fy)||1; fx/=fln; fy/=fln;
  const fnx=-fy, fny=fx;
  for (let k=0; k<8; k++) {
    const f0=-TW+(k*TW*2/8), f1=f0+TW*2/8;
    cx.fillStyle = k%2===0 ? '#ffffff' : '#222222';
    cx.beginPath();
    cx.moveTo(t0.x+fnx*f0,   t0.y+fny*f0);
    cx.lineTo(t0.x+fnx*f1,   t0.y+fny*f1);
    cx.lineTo(t0.x+fnx*f1+fx*10, t0.y+fny*f1+fy*10);
    cx.lineTo(t0.x+fnx*f0+fx*10, t0.y+fny*f0+fy*10);
    cx.fill();
  }
  cx.restore();
}

// ─── MINIMAP ─────────────────────────────────────────────────────────────────
function drawMinimap(cx) {
  const landscape = CW > CH;
  const mw=landscape?88:74, mh=landscape?72:60;
  const mx=CW-mw-10, my=landscape?58:14;

  cx.save();
  cx.fillStyle='rgba(0,0,0,.52)';
  cx.beginPath(); cx.roundRect(mx,my,mw,mh,5); cx.fill();
  cx.strokeStyle='rgba(255,255,255,.14)'; cx.lineWidth=1; cx.stroke();

  let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
  for (const p of TRK) { xn=Math.min(xn,p.x); xx=Math.max(xx,p.x); yn=Math.min(yn,p.y); yx=Math.max(yx,p.y); }
  const ms = Math.min(mw/(xx-xn), mh/(yx-yn)) * .82;
  const ox=mx+(mw-(xx-xn)*ms)/2, oy=my+(mh-(yx-yn)*ms)/2;
  const tp = p => ({x:ox+(p.x-xn)*ms, y:oy+(p.y-yn)*ms});

  cx.beginPath();
  let pt=tp(TRK[0]); cx.moveTo(pt.x,pt.y);
  for (const p of TRK) { pt=tp(p); cx.lineTo(pt.x,pt.y); }
  cx.closePath(); cx.strokeStyle='#b87840'; cx.lineWidth=4; cx.stroke();

  for (const car of cars) {
    const cp=tp(car);
    cx.fillStyle = car.isP ? '#ffffff' : car.col;
    cx.beginPath(); cx.arc(cp.x,cp.y,car.isP?3.5:2.5,0,Math.PI*2); cx.fill();
  }
  cx.restore();
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function drawHUD(cx, pl) {
  const landscape = CW > CH;
  const barH = landscape ? 48 : 54;

  cx.fillStyle='rgba(0,0,0,.52)'; cx.fillRect(0,0,CW,barH);

  // Position (top-left)
  const sorted = [...cars].sort((a,b)=>b.total-a.total);
  const pos = sorted.indexOf(pl)+1;
  const sfx = ['ST','ND','RD'][pos-1]||'TH';
  cx.fillStyle='#ffee22'; cx.font='bold 22px monospace'; cx.textAlign='left';
  cx.fillText(pos+sfx, 12, landscape?34:36);

  // Game title (tiny)
  cx.fillStyle='rgba(255,200,60,.4)'; cx.font='bold 7px monospace';
  cx.fillText('DUST DEVILS RALLY', 12, 11);

  // Lap (centre)
  cx.fillStyle='#fff'; cx.font='bold 15px monospace'; cx.textAlign='center';
  cx.fillText('LAP '+Math.min(pl.lap+1,LAPS)+'/'+LAPS, CW/2, landscape?28:29);

  // Timer
  const m  = Math.floor(raceT/60);
  const s  = String(Math.floor(raceT%60)).padStart(2,'0');
  const ms = String(Math.floor((raceT%1)*100)).padStart(2,'0');
  cx.fillStyle='#88ffaa'; cx.font='11px monospace';
  cx.fillText(m+':'+s+'.'+ms, CW/2, landscape?43:46);

  // Speed (right of centre, before minimap gap)
  cx.textAlign='right';
  cx.fillStyle='#8899ff'; cx.font='bold 13px monospace';
  cx.fillText(Math.abs(Math.round(pl.sp)), landscape?CW-110:CW-92, landscape?32:32);
  cx.fillStyle='#556688'; cx.font='8px monospace';
  cx.fillText('km/h', landscape?CW-110:CW-92, landscape?44:44);

  // NOS bar (below position label, top-left)
  const nW=68, nH=7, nX=12, nY=landscape?38:60;
  cx.fillStyle='rgba(0,0,0,.4)'; cx.fillRect(nX,nY,nW,nH);
  cx.fillStyle = pl.nos>38 ? '#44aaff' : '#ff6633';
  cx.fillRect(nX,nY,nW*(pl.nos/100),nH);
  cx.strokeStyle='rgba(255,255,255,.22)'; cx.lineWidth=1; cx.strokeRect(nX,nY,nW,nH);
  cx.fillStyle='rgba(180,220,255,.5)'; cx.font='7px monospace'; cx.textAlign='left';
  cx.fillText('NOS', nX, nY-1);

  // Off-track flash
  if (pl.off && Math.floor(Date.now()/220)%2) {
    cx.fillStyle='rgba(255,100,0,.65)'; cx.font='bold 12px monospace'; cx.textAlign='center';
    cx.fillText('! OFF TRACK !', CW/2, landscape?barH+18:72);
  }
}

// ─── CONTROLS OVERLAY ────────────────────────────────────────────────────────
// Landscape: left zone steer-left, right zone steer-right + NOS/BRK buttons
// Portrait : bottom-left steer-left, bottom-right steer-right, bottom-centre buttons
let ctrlL=false, ctrlR=false, ctrlB=false, ctrlN=false;
const AT = {};

function getCtrlLayout() {
  const landscape = CW > CH;
  if (landscape) {
    return {
      // steer zones cover full left/right slices (excluding HUD strip at top)
      leftZone:  { x:0,       y:0,    w:CW*.25, h:CH },
      rightZone: { x:CW*.75,  y:0,    w:CW*.25, h:CH },
      nosBtn:    { x:CW-62,   y:CH-72, r:32 },
      brkBtn:    { x:CW-62,   y:CH-140, r:26 },
    };
  } else {
    return {
      leftZone:  { x:0,       y:CH*.3, w:CW*.38, h:CH*.7 },
      rightZone: { x:CW*.62,  y:CH*.3, w:CW*.38, h:CH*.7 },
      nosBtn:    { x:CW/2,    y:CH-55, r:32 },
      brkBtn:    { x:CW/2,    y:CH-120, r:26 },
    };
  }
}

function updCtrl() {
  ctrlL=ctrlR=ctrlB=ctrlN=false;
  const lay = getCtrlLayout();
  for (const id in AT) {
    const {x,y} = AT[id];
    const nos = lay.nosBtn, brk = lay.brkBtn;
    if (Math.hypot(x-nos.x, y-nos.y) < nos.r) { ctrlN=true; continue; }
    if (Math.hypot(x-brk.x, y-brk.y) < brk.r) { ctrlB=true; continue; }
    const lz=lay.leftZone, rz=lay.rightZone;
    if (x>=lz.x&&x<=lz.x+lz.w&&y>=lz.y&&y<=lz.y+lz.h) ctrlL=true;
    if (x>=rz.x&&x<=rz.x+rz.w&&y>=rz.y&&y<=rz.y+rz.h) ctrlR=true;
  }
}

function drawCtrl(cx) {
  const lay = getCtrlLayout();
  const landscape = CW > CH;

  // Touch zones
  const lz=lay.leftZone, rz=lay.rightZone;
  cx.fillStyle=`rgba(255,255,255,${ctrlL?.07:.02})`;
  cx.fillRect(lz.x,lz.y,lz.w,lz.h);
  cx.fillStyle=`rgba(255,255,255,${ctrlR?.07:.02})`;
  cx.fillRect(rz.x,rz.y,rz.w,rz.h);

  // Arrows
  const lax = lz.x+lz.w*.5, lay2 = landscape ? CH*.62 : lz.y+lz.h*.55;
  cx.strokeStyle=`rgba(255,255,255,${ctrlL?.78:.28})`; cx.lineWidth=2.2;
  cx.beginPath(); cx.moveTo(lax+16,lay2-10); cx.lineTo(lax-16,lay2); cx.lineTo(lax+16,lay2+10); cx.stroke();

  const rax = rz.x+rz.w*.5, ray2 = landscape ? CH*.62 : rz.y+rz.h*.55;
  cx.strokeStyle=`rgba(255,255,255,${ctrlR?.78:.28})`;
  cx.beginPath(); cx.moveTo(rax-16,ray2-10); cx.lineTo(rax+16,ray2); cx.lineTo(rax-16,ray2+10); cx.stroke();

  // Labels
  cx.fillStyle=`rgba(255,255,255,${ctrlL?.6:.18})`; cx.font='8px monospace'; cx.textAlign='center';
  cx.fillText('STEER', lax, lay2+24);
  cx.fillStyle=`rgba(255,255,255,${ctrlR?.6:.18})`;
  cx.fillText('STEER', rax, ray2+24);

  // NOS button
  const nos=lay.nosBtn, nosA=ctrlN&&cars[0]&&cars[0].nos>0;
  cx.beginPath(); cx.arc(nos.x,nos.y,nos.r,0,Math.PI*2);
  cx.fillStyle=nosA?'rgba(20,100,255,.72)':'rgba(0,55,185,.28)'; cx.fill();
  cx.strokeStyle=nosA?'#66ccff':'rgba(80,140,255,.38)'; cx.lineWidth=2; cx.stroke();
  cx.fillStyle=nosA?'#fff':'rgba(140,190,255,.58)'; cx.font='bold 10px monospace'; cx.textAlign='center';
  cx.fillText('NOS',nos.x,nos.y+4);

  // BRK button
  const brk=lay.brkBtn;
  cx.beginPath(); cx.arc(brk.x,brk.y,brk.r,0,Math.PI*2);
  cx.fillStyle=ctrlB?'rgba(255,70,0,.7)':'rgba(180,60,0,.22)'; cx.fill();
  cx.strokeStyle=ctrlB?'#ff8844':'rgba(255,120,80,.32)'; cx.lineWidth=1.5; cx.stroke();
  cx.fillStyle=ctrlB?'#fff':'rgba(255,160,120,.5)'; cx.font='bold 9px monospace';
  cx.fillText('BRK',brk.x,brk.y+3);

  // Help text on first ~3 seconds
  if (state==='racing' && raceT < 3.5) {
    const a = 1 - raceT/3.5;
    cx.globalAlpha = a;
    cx.fillStyle='rgba(255,220,100,1)'; cx.font='11px monospace'; cx.textAlign='center';
    cx.fillText('Touch left / right edges to steer', CW/2, CH-12);
    cx.globalAlpha = 1;
  }
}

// Touch/keyboard events
C.addEventListener('touchstart', e => {
  e.preventDefault(); iAudio();
  for (const t of e.changedTouches) AT[t.identifier]={x:t.clientX,y:t.clientY};
  if (state==='start'||state==='finished') { startRace(); return; }
  updCtrl();
}, {passive:false});
C.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) delete AT[t.identifier];
  updCtrl();
}, {passive:false});
C.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) AT[t.identifier]={x:t.clientX,y:t.clientY};
  updCtrl();
}, {passive:false});
C.addEventListener('click', () => { iAudio(); if(state==='start'||state==='finished') startRace(); });

window.addEventListener('keydown', e => {
  iAudio();
  if (e.key==='ArrowLeft'||e.key==='a') ctrlL=true;
  if (e.key==='ArrowRight'||e.key==='d') ctrlR=true;
  if (e.key==='ArrowDown'||e.key==='s') ctrlB=true;
  if (e.key===' '||e.key==='ArrowUp') ctrlN=true;
  if (state==='start'||state==='finished') startRace();
});
window.addEventListener('keyup', e => {
  if (e.key==='ArrowLeft'||e.key==='a') ctrlL=false;
  if (e.key==='ArrowRight'||e.key==='d') ctrlR=false;
  if (e.key==='ArrowDown'||e.key==='s') ctrlB=false;
  if (e.key===' '||e.key==='ArrowUp') ctrlN=false;
});

// ─── GAME STATE ───────────────────────────────────────────────────────────────
let state='start', cdN=3, cdT=0, raceT=0;
let cam={x:TRK[0].x, y:TRK[0].y};
let cars=[];

function setupRace() {
  const t0=TRK[0], t1=TRK[1];
  let dx=t1.x-t0.x, dy=t1.y-t0.y, ln=Math.sqrt(dx*dx+dy*dy)||1; dx/=ln; dy/=ln;
  const nx=-dy, ny=dx;
  const sa = Math.atan2(t1.x-t0.x, -(t1.y-t0.y));
  const pl = new Car(t0.x, t0.y, sa, '#4477ff', true);
  const a1 = new Car(t0.x-dx*52+nx*26, t0.y-dy*52+ny*26, sa, '#ff4422');
  const a2 = new Car(t0.x-dx*52-nx*26, t0.y-dy*52-ny*26, sa, '#22bb55');
  a1.aiI=6; a2.aiI=10;
  return { pl, a1, a2, cam:{x:t0.x, y:t0.y} };
}

function startRace() {
  const g = setupRace();
  cars=[g.pl,g.a1,g.a2]; cam=g.cam;
  parts=[]; cdN=3; cdT=0; raceT=0; state='countdown';
  beep(440,.12);
}

const g0 = setupRace();
cars=[g0.pl,g0.a1,g0.a2];

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function drawStart(cx) {
  cx.fillStyle='rgba(0,0,0,.75)'; cx.fillRect(0,0,CW,CH);
  cx.textAlign='center';
  cx.fillStyle='#ffdd33'; cx.font='bold 30px monospace'; cx.fillText('DUST DEVILS', CW/2, CH/2-88);
  cx.fillStyle='#ff8822'; cx.font='bold 22px monospace'; cx.fillText('RALLY', CW/2, CH/2-54);
  cx.fillStyle='rgba(255,255,255,.55)'; cx.font='13px monospace';
  cx.fillText('TOP-DOWN DIRT RALLY RACING', CW/2, CH/2-16);
  cx.fillStyle='rgba(200,220,255,.65)'; cx.font='12px monospace';
  const land = CW>CH;
  cx.fillText(land ? '< touch left edge   touch right edge >' : '< touch left   touch right >', CW/2, CH/2+34);
  cx.fillText('NOS = nitro boost  |  BRK = brake', CW/2, CH/2+56);
  cx.fillText('Keyboard: A/D steer · Space=NOS · S=brake', CW/2, CH/2+78);
  cx.fillStyle='rgba(255,220,60,.85)'; cx.font='bold 15px monospace';
  if (Math.floor(Date.now()/580)%2) cx.fillText('TAP OR CLICK TO RACE!', CW/2, CH/2+120);
}

function drawCountdown(cx) {
  cx.fillStyle='rgba(0,0,0,.32)'; cx.fillRect(0,0,CW,CH);
  cx.textAlign='center';
  const sz = Math.min(CW,CH)*.18;
  cx.font=`bold ${sz}px monospace`;
  cx.fillStyle='#ffee00';
  cx.shadowColor='#ff8800'; cx.shadowBlur=20;
  cx.fillText(cdN>0?String(cdN):'GO!', CW/2, CH*.52);
  cx.shadowBlur=0;
}

function drawFinished(cx) {
  cx.fillStyle='rgba(0,0,0,.72)'; cx.fillRect(0,0,CW,CH);
  cx.textAlign='center';
  cx.fillStyle='#ffee22'; cx.font='bold 28px monospace'; cx.fillText('RACE FINISHED!', CW/2, CH/2-72);
  const sorted=[...cars].sort((a,b)=>b.total-a.total);
  const pos=sorted.indexOf(cars[0])+1;
  const sfx=['ST','ND','RD'][pos-1]||'TH';
  cx.fillStyle='#fff'; cx.font='22px monospace'; cx.fillText('You finished '+pos+sfx+'!', CW/2, CH/2-22);
  const m=Math.floor(raceT/60), s=String(Math.floor(raceT%60)).padStart(2,'0'), ms=String(Math.floor((raceT%1)*100)).padStart(2,'0');
  cx.fillStyle='#88ffaa'; cx.font='18px monospace'; cx.fillText('Time: '+m+':'+s+'.'+ms, CW/2, CH/2+18);
  cx.fillStyle='rgba(255,220,70,.8)'; cx.font='13px monospace';
  if (Math.floor(Date.now()/580)%2) cx.fillText('TAP OR CLICK TO PLAY AGAIN', CW/2, CH/2+80);
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let lastT=0;
function loop(now) {
  const dt = Math.min((now-lastT)/1000, .05); lastT=now;
  const SC = getScale();

  G.clearRect(0,0,CW,CH);

  if (state==='start') {
    drawTrack(G, {x:TRK[0].x,y:TRK[0].y}, SC);
    drawStart(G);
  } else {
    if (state==='countdown') {
      cdT+=dt;
      if (cdT>=1) {
        cdT=0; cdN--;
        beep(cdN>0 ? 440*Math.pow(1.25,3-cdN) : 880, cdN>0?.15:.3);
        if (cdN<=0) state='racing';
      }
    } else if (state==='racing') {
      raceT+=dt;
      for (const c of cars) {
        const p=c.isP;
        c.upd(dt, p?ctrlL:false, p?ctrlR:false, p?ctrlB:false, p?ctrlN:false);
      }
      updParts(dt);
      if (Math.abs(cars[0].sp)>22 && Math.random()<.32)
        addDust(cars[0].x, cars[0].y, cars[0].off?'#c08040':'#c8a878');
      // Camera with look-ahead
      const la=70, pl=cars[0];
      const tx=pl.x+Math.sin(pl.a)*la, ty=pl.y-Math.cos(pl.a)*la;
      cam.x+=(tx-cam.x)*.13; cam.y+=(ty-cam.y)*.13;
      if (pl.lap>=LAPS) state='finished';
    }

    drawTrack(G, cam, SC);
    drawParts(G, cam, SC);
    const sc2=[...cars].sort((a,b)=>a.y-b.y);
    for (const c of sc2) c.draw(G,cam,SC);
    drawMinimap(G);
    drawHUD(G,cars[0]);
    drawCtrl(G);

    if (state==='countdown') drawCountdown(G);
    if (state==='finished')  drawFinished(G);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{lastT=t; requestAnimationFrame(loop);});
</script>
