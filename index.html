<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dust Devils Rally">
  <meta name="theme-color" content="#111">
  <title>Dust Devils Rally</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="rotate">
    <span>&#8635;</span>
    Rotate to landscape for best experience!
  </div>

  <div id="nscreen">
    <p>DUST DEVILS RALLY</p>
    <p class="sub">Enter your racer name</p>
    <input id="nfield" maxlength="10" placeholder="YOUR NAME" autocomplete="off">
    <button id="nbtn">START RACING!</button>
  </div>

  <canvas id="c"></canvas>

  <!-- Load order matters: each file can use globals from files before it -->
  <script src="js/config.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/save.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/car.js"></script>
  <script src="js/render.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
