  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #111;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  width: 100%; height: 100%;
}

canvas { display: block; }

/* Name entry screen */
#nscreen {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.9);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  z-index: 10;
}
#nscreen p  { color: #ffdd33; font: bold 22px monospace; letter-spacing: 2px; }
#nscreen p.sub { color: rgba(255,255,255,.5); font: 12px monospace; margin-top:-8px; }

#nfield {
  background: #1a1a1a;
  border: 2px solid #ffdd33;
  color: #fff;
  font: bold 20px monospace;
  padding: 10px 20px;
  text-align: center;
  outline: none;
  border-radius: 4px;
  width: 260px;
  text-transform: uppercase;
}
#nbtn {
  background: #ffdd33;
  border: none;
  color: #111;
  font: bold 16px monospace;
  padding: 12px 32px;
  cursor: pointer;
  border-radius: 4px;
  letter-spacing: 1px;
}
#nbtn:hover { background: #ffe866; }

/* Landscape hint for portrait phones */
#rotate {
  display: none;
  position: fixed; inset: 0;
  background: #111;
  color: #ffdd33;
  font: bold 18px monospace;
  text-align: center;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  z-index: 9;
}
#rotate span { font-size: 52px; }

@media (orientation: portrait) and (max-width: 600px) {
  #rotate { display: flex; }
}

// ─── SPLINE MATH ─────────────────────────────────────────────────────────────
function crPt(a,b,c,d,t){
  const t2=t*t,t3=t2*t;
  return{
    x:.5*((2*b.x)+(-a.x+c.x)*t+(2*a.x-5*b.x+4*c.x-d.x)*t2+(-a.x+3*b.x-3*c.x+d.x)*t3),
    y:.5*((2*b.y)+(-a.y+c.y)*t+(2*a.y-5*b.y+4*c.y-d.y)*t2+(-a.y+3*b.y-3*c.y+d.y)*t3)
  };
}
function buildSpline(raw,steps){
  const n=raw.length,out=[];
  for(let i=0;i<n;i++){
    const a=raw[(i-1+n)%n],b=raw[i],c=raw[(i+1)%n],d=raw[(i+2)%n];
    for(let j=0;j<steps;j++) out.push(crPt(a,b,c,d,j/steps));
  }
  return out;
}
function seededRng(seed){
  let s=seed|0;
  return()=>{
    s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

function nearD2(x,y){
  let m=Infinity;
  for(let i=0;i<TN;i++){const dx=TRK[i].x-x,dy=TRK[i].y-y,d=dx*dx+dy*dy;if(d<m)m=d;}
  return m;
}
function tProg(x,y){
  let m=Infinity,mi=0;
  for(let i=0;i<TN;i++){const dx=TRK[i].x-x,dy=TRK[i].y-y,d=dx*dx+dy*dy;if(d<m){m=d;mi=i;}}
  return mi/TN;
}
function getScale(menu=false){
  if(menu){
    let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
    for(const p of TRK){xn=Math.min(xn,p.x);xx=Math.max(xx,p.x);yn=Math.min(yn,p.y);yx=Math.max(yx,p.y);}
    return Math.min(CH/(yx-yn+TW*2.5),CW/(xx-xn+TW*2.5))*0.86;
  }
  return CW>CH?CH/520:CH/600;
}

function activateTrack(idx){
  idx=Math.min(Math.max(0,idx),ALL_TRACKS.length-1);
  TDEF=ALL_TRACKS[idx]; TW=TDEF.tw;
  TRK=buildSpline(TDEF.raw,TDEF.steps); TN=TRK.length;

  function nd(x,y){let m=Infinity;for(let i=0;i<TN;i++){const dx=TRK[i].x-x,dy=TRK[i].y-y,d=dx*dx+dy*dy;if(d<m)m=d;}return m;}

  // Trees
  TREES=[];
  const rt=seededRng(1337+idx*777);
  let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
  for(const p of TDEF.raw){xn=Math.min(xn,p.x);xx=Math.max(xx,p.x);yn=Math.min(yn,p.y);yx=Math.max(yx,p.y);}
  for(let i=0;i<160;i++){
    const x=xn-150+rt()*(xx-xn+300),y=yn-150+rt()*(yx-yn+300);
    if(nd(x,y)>(TW+55)*(TW+55)) TREES.push({x,y,r:7+rt()*13,g:Math.floor(rt()*3)});
  }

  // Rocks
  ROCKS=[];
  const rr=seededRng(9999+idx*555);
  for(let i=0;i<60;i++){
    const tp=TRK[Math.floor(rr()*TN)],a=rr()*Math.PI*2,dist=TW+16+rr()*50;
    const rx=tp.x+Math.cos(a)*dist,ry=tp.y+Math.sin(a)*dist;
    if(nd(rx,ry)>(TW+12)*(TW+12)) ROCKS.push({x:rx,y:ry,r:3+rr()*7});
  }

  // Corner markers
  MRKS=[];
  for(let i=0;i<TN;i+=12){
    const t=TRK[i],n=TRK[(i+1)%TN];
    let dx=n.x-t.x,dy=n.y-t.y,ln=Math.sqrt(dx*dx+dy*dy)||1;dx/=ln;dy/=ln;
    MRKS.push({lx:t.x-dy*TW,ly:t.y+dx*TW,rx:t.x+dy*TW,ry:t.y-dx*TW,alt:Math.floor(i/12)%2});
  }

  // Checkpoint gates — extend BEYOND track width so AI always triggers them
  CP_GATES=[.22,.44,.66,.88].map(fr=>{
    const i2=Math.floor(fr*TN),t=TRK[i2],n=TRK[(i2+1)%TN];
    let dx=n.x-t.x,dy=n.y-t.y,ln=Math.sqrt(dx*dx+dy*dy)||1;dx/=ln;dy/=ln;
    const hw=TW+30; // wider than track for robust detection
    return{cx:t.x,cy:t.y,nx:-dy,ny:dx,tdx:dx,tdy:dy,hw,
      lx:t.x-dy*hw,ly:t.y+dx*hw,rx:t.x+dy*hw,ry:t.y-dx*hw,fr};
  });

  // Finish line gate at track start
  const f0=TRK[0],f1=TRK[1];
  let fdx=f1.x-f0.x,fdy=f1.y-f0.y,fln=Math.sqrt(fdx*fdx+fdy*fdy)||1;fdx/=fln;fdy/=fln;
  const fhw=TW+30;
  FINISH_GATE={cx:f0.x,cy:f0.y,nx:-fdy,ny:fdx,tdx:fdx,tdy:fdy,hw:fhw,
    lx:f0.x-fdy*fhw,ly:f0.y+fdx*fhw,rx:f0.x+fdy*fhw,ry:f0.y-fdx*fhw};
}

// ─── AUDIO ───────────────────────────────────────────────────────────────────
let AC=null,_engNodes=null,scrSrc=null,_scrOn=false;

function initAudio(){
  if(!AC) try{ AC=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}

function beep(freq,dur,vol=0.22,type='square'){
  if(!AC)return; if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.start();o.stop(AC.currentTime+dur+0.02);
}

function startEngine(){
  if(!AC||_engNodes)return;
  // Rich multi-oscillator engine: fundamental + 2nd harmonic + distortion
  const master=AC.createGain();
  const filt=AC.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=180; filt.Q.value=0.8;
  const filt2=AC.createBiquadFilter(); filt2.type='lowpass'; filt2.frequency.value=800;

  const o1=AC.createOscillator(); o1.type='sawtooth';  // engine fundamental
  const o2=AC.createOscillator(); o2.type='square';    // harmonic crunch
  const o3=AC.createOscillator(); o3.type='sawtooth';  // upper harmonic

  const g1=AC.createGain(),g2=AC.createGain(),g3=AC.createGain();
  g1.gain.value=0.5; g2.gain.value=0.18; g3.gain.value=0.08;

  o1.connect(g1); o2.connect(g2); o3.connect(g3);
  g1.connect(filt); g2.connect(filt); g3.connect(filt);
  filt.connect(filt2); filt2.connect(master); master.connect(AC.destination);
  master.gain.value=0.04;

  o1.frequency.value=80; o2.frequency.value=160; o3.frequency.value=240;
  o1.start();o2.start();o3.start();
  _engNodes={o1,o2,o3,g1,g2,g3,master,filt};
}

function updateEngine(sp,top){
  if(!_engNodes)startEngine(); if(!_engNodes)return;
  const t=Math.min(1,Math.abs(sp)/top);
  // Pitch rises with speed, with slight gear-step feel
  const gear=Math.floor(t*4);
  const gearT=(t*4)%1;
  const baseFreq=60+gear*35+gearT*30;
  _engNodes.o1.frequency.value=baseFreq;
  _engNodes.o2.frequency.value=baseFreq*2.01; // slight detune
  _engNodes.o3.frequency.value=baseFreq*3.02;
  _engNodes.master.gain.value=0.025+t*0.04;
  _engNodes.filt.frequency.value=150+t*400;
}

function stopEngine(){
  if(_engNodes){
    try{_engNodes.o1.stop();_engNodes.o2.stop();_engNodes.o3.stop();}catch(e){}
    _engNodes=null;
  }
}

function setScreech(on){
  if(on===_scrOn)return; _scrOn=on;
  if(!AC){_scrOn=false;return;}
  if(on){
    const buf=AC.createBuffer(1,AC.sampleRate*0.2,AC.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    scrSrc=AC.createBufferSource(); scrSrc.buffer=buf; scrSrc.loop=true;
    const g=AC.createGain(),f=AC.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=2600; f.Q.value=2;
    scrSrc.connect(f);f.connect(g);g.connect(AC.destination);
    g.gain.value=0.055; scrSrc.start();
  }else{
    if(scrSrc){try{scrSrc.stop();scrSrc.disconnect();}catch(e){}scrSrc=null;}
  }
}

let ghostData=null, ghostLoading=false;

function compressGhost(frames){
  return frames.map(f=>[Math.round(f.t*10),Math.round(f.x),Math.round(f.y),Math.round(f.a*100)]).flat().join(',');
}
function decompressGhost(str){
  const v=str.split(',').map(Number),f=[];
  for(let i=0;i<v.length-3;i+=4) f.push({t:v[i]/10,x:v[i+1],y:v[i+2],a:v[i+3]/100});
  return f;
}

    await fetch(`${FB_URL}/ghosts_v1/${trackIdx}.json`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,time,car,path:compressGhost(frames),ts:Date.now()})
    });
  }catch(e){}
}

  ghostLoading=true;

// ─── PARTICLES ───────────────────────────────────────────────────────────────
let parts=[], driftPops=[];

function addDust(x,y,col,n=2){
  for(let i=0;i<n;i++)
    parts.push({x,y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,l:.55,m:.55,r:2.5+Math.random()*3,c:col});
}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=.93; p.vy*=.93; p.l-=dt;
    if(p.l<=0) parts.splice(i,1);
  }
}
function drawParts(cx,cam,SC){
  for(const p of parts){
    const a=p.l/p.m;
    cx.globalAlpha=a*0.42; cx.fillStyle=p.c;
    cx.beginPath(); cx.arc((p.x-cam.x)*SC+CW/2,(p.y-cam.y)*SC+CH/2,p.r*a+.8,0,Math.PI*2); cx.fill();
  }
  cx.globalAlpha=1;
}

function spawnDriftPopup(car, pts){

function updDriftPops(dt){
  for(let i=driftPops.length-1;i>=0;i--){

    if(p.life<=0) driftPops.splice(i,1);

}
function drawDriftPops(cx,cam,SC){
  for(const p of driftPops){

    cx.globalAlpha=a;
    cx.fillStyle='#ffcc00';
    cx.font=`bold ${Math.min(16,10+p.pts*0.08)}px monospace`;
    cx.textAlign='center';
    cx.fillText('DRIFT +'+p.pts, (p.x-cam.x)*SC+CW/2, (p.y-cam.y)*SC+CH/2);
  }
  cx.globalAlpha=1;
}

// ─── COLLISIONS ──────────────────────────────────────────────────────────────
function doCollisions(cars){
  const R=20;
  for(let i=0;i<cars.length;i++) for(let j=i+1;j<cars.length;j++){
    const a=cars[i], b=cars[j];
    const dx=b.x-a.x, dy=b.y-a.y, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<R*2 && dist>0.1){
      const nx=dx/dist, ny=dy/dist, ov=R*2-dist;
      a.x-=nx*ov*.5; a.y-=ny*ov*.5;
      b.x+=nx*ov*.5; b.y+=ny*ov*.5;
      const rvn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(rvn<0){
        const imp=rvn*0.55;
        a.vx+=imp*nx; a.vy+=imp*ny;
        b.vx-=imp*nx; b.vy-=imp*ny;
        a.sp=a.vx*Math.sin(a.a)-a.vy*Math.cos(a.a);
        b.sp=b.vx*Math.sin(b.a)-b.vy*Math.cos(b.a);
        // Only sound+shake when player involved
        if(a.isP||b.isP){
          beep(110+Math.random()*70,.13,.25,'sawtooth');
          camShake=3;
        }
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        for(let k=0;k<5;k++) addDust(mx,my,'#ffcc44',1);
      }
    }
  }
}

// ─── SEGMENT CROSSING ──────────────────────────────────────────────────────────
function segCross(ax,ay,bx,by,cx,cy,dx,dy){
  function side(ox,oy,ux,uy,vx,vy){return(ux-ox)*(vy-oy)-(uy-oy)*(vx-ox);}
  const d1=side(cx,cy,dx,dy,ax,ay),d2=side(cx,cy,dx,dy,bx,by);
  const d3=side(ax,ay,bx,by,cx,cy),d4=side(ax,ay,bx,by,dx,dy);
  return((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
}

// ─── CAR CLASS ─────────────────────────────────────────────────────────────────
class Car{
  constructor(x,y,angle,defId,isPlayer){
    this.x=x; this.y=y; this.a=angle;
    this.px=x; this.py=y;
    this.def=CAR_DEFS.find(c=>c.id===defId)||CAR_DEFS[0];
    this.isP=isPlayer;
    this.sp=0; this.vx=0; this.vy=0; this._prevA=angle;
    this.nos=isPlayer?100:55;
    this.lap=0; this.nextCP=0; this.total=0;
    this.wentOff=false; this.pp=0; this._lapCD=0;
    this.aiI=0; this.aiM=0.68+Math.random()*0.28; this.aiReact=1;
    this.driftAng=0; this.isDrifting=false; this._combo=0;
    this.skidTrail=[]; this.nosFlame=0;
    this.num=Math.floor(Math.random()*98)+1;
    // Jump state
    this.jumpH=0; this.jumpV=0; this._wasOnRamp=false;
    // Ghost recording (player only)
    this.ghostFrames=[]; this.lapGhost=null; this._lapStartT=0;
  }

  speed(){ return Math.sqrt(this.vx*this.vx+this.vy*this.vy); }

  update(dt,L,R,brake,nos,raceTime){
    const def=this.def;
    const ramps=TDEF&&TDEF.ramps?TDEF.ramps:[];

    if(this.isP){
      // Auto-gas always — NOS is manual boost
      const maxSp=(nos&&this.nos>0)?def.top*def.nos:def.top;
      this.sp=Math.min(this.sp+def.acc*dt,maxSp);
      if(brake) this.sp=Math.max(this.sp-490*dt,-55);
      const tr=3.2*Math.min(1,Math.abs(this.sp)/110);
      if(L) this.a-=tr*dt;
      if(R) this.a+=tr*dt;
      if(nos&&this.nos>0){this.nos=Math.max(0,this.nos-52*dt);this.nosFlame=1;}
      else{this.nos=Math.min(100,this.nos+11*dt);this.nosFlame=Math.max(0,this.nosFlame-.1);}
    }else{
      const wp=TRK[this.aiI];
      const dx=wp.x-this.x,dy=wp.y-this.y,dist=Math.sqrt(dx*dx+dy*dy);
      const want=Math.atan2(dx,-dy);
      let diff=want-this.a;
      while(diff>Math.PI)diff-=Math.PI*2; while(diff<-Math.PI)diff+=Math.PI*2;
      this.a+=Math.sign(diff)*Math.min(Math.abs(diff),3.2*(this.aiReact||1)*dt);
      if(dist<95) this.aiI=(this.aiI+9)%TN;
      this.sp+=(320*this.aiM-this.sp)*2.2*dt;
    }

    // Drift physics
    const turnRate=Math.abs(this.a-this._prevA)/Math.max(dt,0.001);
    this._prevA=this.a;
    const airborne=this.jumpH>2;
    // Reduced grip when airborne
    const spFrac=Math.min(1,Math.abs(this.sp)/Math.max(def.top,1));
    const driftLoad=spFrac*Math.min(1,turnRate*1.5)*(airborne?0.3:1);
    const effGrip=Math.max(airborne?.4:.2,def.grip-driftLoad*(1-def.grip)*2.0);
    const gf=1-Math.pow(1-effGrip,dt*60);
    const desVX=Math.sin(this.a)*this.sp,desVY=-Math.cos(this.a)*this.sp;
    this.vx+=(desVX-this.vx)*gf; this.vy+=(desVY-this.vy)*gf;

    this.off=!airborne&&nearD2(this.x,this.y)>TW*TW;
    if(this.off){this.wentOff=true;const p=Math.pow(0.07,dt);this.sp*=p;this.vx*=p;this.vy*=p;}
    this.x+=this.vx*dt; this.y+=this.vy*dt;

    // Hard boundary (only when on ground)
    if(!airborne){
      const dSq=nearD2(this.x,this.y),maxD=TW*2.2;
      if(dSq>maxD*maxD){
        let mi=0,md=Infinity;
        for(let i=0;i<TN;i++){const dx=TRK[i].x-this.x,dy=TRK[i].y-this.y,d=dx*dx+dy*dy;if(d<md){md=d;mi=i;}}
        const dist=Math.sqrt(md),nx=(TRK[mi].x-this.x)/dist,ny=(TRK[mi].y-this.y)/dist;
        this.x+=nx*(dist-maxD);this.y+=ny*(dist-maxD);
        const out=this.vx*(-nx)+this.vy*(-ny);
        if(out>0){this.vx+=nx*out*1.8;this.vy+=ny*out*1.8;}this.sp*=0.15;
      }
    }

    // ── JUMP PHYSICS ───────────────────────────────────────────────────────────
    const prog=tProg(this.x,this.y);
    const onRamp=ramps.some(r=>prog>=r.fr&&prog<=r.to);
    if(onRamp&&!this._wasOnRamp&&this.jumpH<5&&Math.abs(this.sp)>80){
      this.jumpV=280; // launch!
      this._wasOnRamp=true;
      if(this.isP){beep(660,.06,.15,'triangle');camShake=2;}
    }
    if(!onRamp) this._wasOnRamp=false;
    if(this.jumpH>0||this.jumpV>0){
      this.jumpH+=this.jumpV*dt;
      this.jumpV-=560*dt; // gravity
      if(this.jumpH<=0&&this.jumpV<0){
        this.jumpH=0;this.jumpV=0;
        if(this.isP){
          camShake=5;
          beep(120,.12,.3,'sawtooth');
          for(let k=0;k<10;k++) addDust(this.x+(Math.random()-.5)*30,this.y+(Math.random()-.5)*30,'rgba(200,175,130,.9)',1);
        }
      }
    }

    // Drift scoring
    const velA=Math.atan2(this.vx,-this.vy);
    let da=velA-this.a;
    while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
    this.driftAng=da;
    this.isDrifting=!airborne&&Math.abs(da)>0.22&&Math.abs(this.sp)>120;
    if(this.isDrifting&&Math.abs(this.sp)>120){
      this.skidTrail.push({x:this.x,y:this.y,t:Date.now()});
      if(this.skidTrail.length>150)this.skidTrail.shift();
      if(this.isP)this._combo+=Math.abs(da)*Math.abs(this.sp)*dt*0.005;
    }else{
      if(this.isP&&this._combo>3)spawnDriftPopup(this,Math.floor(this._combo));
      this._combo=0;
    }

    // Checkpoints
    if(this.nextCP<4){
      const g=CP_GATES[this.nextCP];
      if(segCross(this.px,this.py,this.x,this.y,g.lx,g.ly,g.rx,g.ry))this.nextCP++;
    }
    if(this.nextCP>=4&&FINISH_GATE&&raceTime-this._lapCD>2){
      const f=FINISH_GATE;
      if(segCross(this.px,this.py,this.x,this.y,f.lx,f.ly,f.rx,f.ry)){
        const lapTime=raceTime-this._lapStartT;
        // Save ghost of this lap for next lap
        if(this.isP&&lapTime>5){
          this.lapGhost={frames:[...this.ghostFrames],lapTime,startT:this._lapStartT};
          this.ghostFrames=[];
        }
        this.lap++;this.nextCP=0;this._lapCD=raceTime;this._lapStartT=raceTime;
        if(this.isP){beep(660,.08);setTimeout(()=>beep(880,.2),100);}
      }
    }
    // Record ghost frames every 100ms for whole first lap
    if(this.isP&&this.lap===0&&Math.floor(raceTime*10)!==Math.floor((raceTime-dt)*10)){
      this.ghostFrames.push({t:raceTime,x:this.x,y:this.y,a:this.a});
    }

    this.px=this.x;this.py=this.y;
    this.pp=prog;
    this.total=this.lap+prog;
  }

  draw(cx,cam,SC){
    const sx=(this.x-cam.x)*SC+CW/2,sy=(this.y-cam.y)*SC+CH/2;
    const def=this.def;
    const isF1=def.body==='long'||def.body==='f1b';
    const scaleMap={wide:1.12,tall:1.06,low:.9,compact:.85,long:.72,f1b:.72,vintage:1.0,suv:1.1,aero:.95,std:1.0};
    const scl=scaleMap[def.body]||1.0;
    const px=Math.max(1.5,Math.round(Math.min(17*SC*scl/8*1.6,30*SC*scl/16*1.2)));
    const dW=px*8,dH=px*16,x0=-dW/2,y0=-dH/2;

    // Jump offset in screen pixels (jumpH is abstract game units)
    const jumpOff=this.jumpH>0?(this.jumpH/200)*px*12:0;
    const jumpScale=this.jumpH>0?1+this.jumpH*0.004:1;

    // Skid marks
    if(this.skidTrail.length>1){
      const now=Date.now();
      for(let i=1;i<this.skidTrail.length;i++){
        const p=this.skidTrail[i],q=this.skidTrail[i-1];
        const age=(now-p.t)/3500;if(age>1)continue;
        cx.globalAlpha=(1-age)*0.2;cx.strokeStyle='#2a1a08';
        cx.lineWidth=Math.max(SC,0.5)*6;cx.lineCap='round';
        cx.beginPath();
        cx.moveTo((q.x-cam.x)*SC+CW/2,(q.y-cam.y)*SC+CH/2);
        cx.lineTo((p.x-cam.x)*SC+CW/2,(p.y-cam.y)*SC+CH/2);cx.stroke();
      }
      cx.globalAlpha=1;
    }

    // Ground shadow (stays at ground level when jumping)
    cx.save();cx.translate(sx,sy);
    if(jumpOff>0){
      const sAlpha=Math.max(0.05,0.28-this.jumpH*0.0012);
      const sScale=1+this.jumpH*0.008;
      cx.globalAlpha=sAlpha;cx.fillStyle='#000';
      cx.beginPath();cx.ellipse(0,0,dW*.55*sScale,dH*.13*sScale,0,0,Math.PI*2);cx.fill();
      cx.globalAlpha=1;
    }
    cx.restore();

    // Car (elevated + scaled when jumping)
    cx.save();cx.translate(sx,sy-jumpOff);
    if(jumpScale>1)cx.scale(jumpScale,jumpScale);
    cx.rotate(this.a);

    // Normal ground shadow (no jump)
    if(jumpOff===0){
      cx.globalAlpha=0.2;cx.fillStyle='#000';
      cx.beginPath();cx.ellipse(px*.4,px*.8,dW*.5,dH*.13,0,0,Math.PI*2);cx.fill();cx.globalAlpha=1;
    }

    // Draw car sprite from sheet (sprite already includes wheels)
    const spr=CAR_SPRITES[def.body]||CAR_SPRITES.std;
    if(CAR_SHEET.complete&&CAR_SHEET.naturalWidth>0){
      cx.imageSmoothingEnabled=false;
      cx.drawImage(CAR_SHEET,spr.sx,spr.sy,spr.sw,spr.sh,x0,y0+dH,dW,-dH); // flip: front of sprite is at bottom
    }else{
      // Fallback solid block if image not loaded
      cx.fillStyle=def.col;cx.fillRect(x0,y0,dW,dH);
    }

    // Racing number
    const ns=Math.max(7,px*1.8),ny=isF1?px*-2.5:px*-1.2;
    cx.font=`bold ${ns}px monospace`;cx.textAlign='center';
    cx.fillStyle='rgba(0,0,0,.7)';cx.fillText(this.num,1,ny+1);
    cx.fillStyle='rgba(255,255,255,.92)';cx.fillText(this.num,0,ny);

    // NOS flame
    if(this.isP&&this.nosFlame>0.05){
      const fl=this.nosFlame*dH*.32+px*2;
      cx.globalAlpha=this.nosFlame*.85;cx.fillStyle='#44aaff';
      cx.beginPath();cx.moveTo(-px,dH/2);cx.lineTo(0,dH/2+fl);cx.lineTo(px,dH/2);cx.fill();
      cx.globalAlpha=.38;cx.fillStyle='#fff';
      cx.beginPath();cx.moveTo(-px*.4,dH/2);cx.lineTo(0,dH/2+fl*.5);cx.lineTo(px*.4,dH/2);cx.fill();
      cx.globalAlpha=1;
    }
    cx.restore();

    // Airborne label
    if(jumpOff>20&&this.isP){
      cx.fillStyle='rgba(255,220,50,.85)';cx.font=`bold ${Math.max(8,px*1.5)}px monospace`;cx.textAlign='center';
      cx.fillText('AIRBORNE!',sx,sy-jumpOff-dH/2-4);
    }

    if(this.isDrifting&&Math.random()<0.4)
      addDust(this.x-Math.sin(this.a)*9,this.y+Math.cos(this.a)*9,'rgba(210,200,185,.8)',1);
    if(this.isP&&S.name){
      cx.fillStyle='rgba(255,255,255,.6)';cx.font='7px monospace';cx.textAlign='center';
      cx.fillText(S.name,sx,sy-jumpOff-dH/2*SC*.5);
    }
  }

  // Draw as ghost (transparent)
  drawGhost(cx,cam,SC){
    const sx=(this.x-cam.x)*SC+CW/2,sy=(this.y-cam.y)*SC+CH/2;
    const def=this.def;
    const isF1=def.body==='long'||def.body==='f1b';
    const scaleMap={wide:1.12,tall:1.06,low:.9,compact:.85,long:.72,f1b:.72,vintage:1.0,suv:1.1,aero:.95,std:1.0};
    const px=Math.max(1.5,Math.round(Math.min(17*SC*(scaleMap[def.body]||1)/8*1.6,30*SC*(scaleMap[def.body]||1)/16*1.2)));
    const dW=px*8,dH=px*16,x0=-dW/2,y0=-dH/2;
    cx.save();cx.translate(sx,sy);cx.rotate(this.a);cx.globalAlpha=0.28;
    const spr=CAR_SPRITES[def.body]||CAR_SPRITES.std;
    if(CAR_SHEET.complete&&CAR_SHEET.naturalWidth>0){
      cx.imageSmoothingEnabled=false;
      cx.drawImage(CAR_SHEET,spr.sx,spr.sy,spr.sw,spr.sh,x0,y0+dH,dW,-dH); // flip: front of sprite is at bottom
    }
    cx.restore();cx.globalAlpha=1;
  }
}

// ─── TRACK DRAWING ───────────────────────────────────────────────────────────
function drawTrack(cx, cam, SC) {
  // Grass background (slightly oversized to cover camera rotation corners)
  cx.fillStyle = TDEF.grass;
  cx.fillRect(-200,-200,CW+400,CH+400);

  cx.save();
  cx.translate(CW/2-cam.x*SC, CH/2-cam.y*SC);
  cx.scale(SC, SC);

  // Rocks (behind trees)
  for(const r of ROCKS){
    cx.fillStyle='rgba(0,0,0,.18)';
    cx.beginPath(); cx.ellipse(r.x+2,r.y+2,r.r,r.r*.6,0,0,Math.PI*2); cx.fill();
    cx.fillStyle='#888878';
    cx.beginPath(); cx.ellipse(r.x,r.y,r.r,r.r*.65,-.3,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(255,255,255,.12)';
    cx.beginPath(); cx.arc(r.x-r.r*.3,r.y-r.r*.3,r.r*.3,0,Math.PI*2); cx.fill();
  }

  // Trees
  for(const t of TREES){
    cx.fillStyle=TDEF.tc[t.g];
    cx.beginPath(); cx.arc(t.x,t.y,t.r*1.3,0,Math.PI*2); cx.fill();
    cx.fillStyle=TDEF.tc[(t.g+1)%3];
    cx.beginPath(); cx.arc(t.x-t.r*.2,t.y-t.r*.2,t.r,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(60,35,10,.4)';
    cx.fillRect(t.x-2, t.y+t.r*.4, 4, t.r*.5);
  }

  // Track surface layers
  function tp(){
    cx.beginPath(); cx.moveTo(TRK[0].x,TRK[0].y);
    for(let i=1;i<TN;i++) cx.lineTo(TRK[i].x,TRK[i].y);
    cx.closePath();
  }
  cx.lineJoin='round'; cx.lineCap='round';
  tp(); cx.strokeStyle='rgba(0,0,0,.3)';    cx.lineWidth=TW*2+28; cx.stroke();
  tp(); cx.strokeStyle=TDEF.edge;           cx.lineWidth=TW*2+16; cx.stroke();
  tp(); cx.strokeStyle=TDEF.d1;             cx.lineWidth=TW*2;    cx.stroke();
  tp(); cx.strokeStyle=TDEF.d2;             cx.lineWidth=TW*2-30; cx.stroke();
  tp(); cx.strokeStyle='rgba(255,255,255,.06)'; cx.lineWidth=TW*2-62; cx.stroke();
  // Tire groove hints
  tp(); cx.strokeStyle='rgba(50,28,8,.18)'; cx.lineWidth=20; cx.stroke();
  // Centre dashes
  cx.setLineDash([24,28]);
  tp(); cx.strokeStyle='rgba(255,240,160,.18)'; cx.lineWidth=2.8; cx.stroke();
  cx.setLineDash([]);

  // Corner markers
  for(const m of MRKS){
    const col=m.alt?'#cc1010':'#eee';
    cx.fillStyle='rgba(0,0,0,.25)';
    cx.beginPath(); cx.arc(m.lx+1.5,m.ly+1.5,6,0,Math.PI*2); cx.fill();
    cx.fillStyle=col;
    cx.beginPath(); cx.arc(m.lx,m.ly,6,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(0,0,0,.25)';
    cx.beginPath(); cx.arc(m.rx+1.5,m.ry+1.5,6,0,Math.PI*2); cx.fill();
    cx.fillStyle=col;
    cx.beginPath(); cx.arc(m.rx,m.ry,6,0,Math.PI*2); cx.fill();
  }

  // Start/finish checker
  const t0=TRK[0], t1=TRK[1];
  let fx=t1.x-t0.x, fy=t1.y-t0.y, fl=Math.sqrt(fx*fx+fy*fy)||1; fx/=fl; fy/=fl;
  const fnx=-fy, fny=fx;
  for(let k=0;k<8;k++){
    const f0=-TW+(k*TW*2/8), f1=f0+TW*2/8;
    cx.fillStyle=k%2===0?'#fff':'#222';
    cx.beginPath();
    cx.moveTo(t0.x+fnx*f0,   t0.y+fny*f0);
    cx.lineTo(t0.x+fnx*f1,   t0.y+fny*f1);
    cx.lineTo(t0.x+fnx*f1+fx*12, t0.y+fny*f1+fy*12);
    cx.lineTo(t0.x+fnx*f0+fx*12, t0.y+fny*f0+fy*12);
    cx.fill();
  }

  // Checkpoint flags — small flags on both sides of track, no lines across
  const pl=cars[0]||null;
  CP_GATES.forEach((g,i)=>{
    const passed=pl&&pl.nextCP>i;
    const col=passed?'#44ff88':'#ffdd22';
    const colD=passed?'rgba(20,160,60,.85)':'rgba(200,160,0,.85)';
    [-1,1].forEach(side=>{
      const px=g.cx+g.nx*side*(TW*0.82), py=g.cy+g.ny*side*(TW*0.82);
      cx.save(); cx.translate(px,py);
      // pole shadow
      cx.strokeStyle='rgba(0,0,0,.25)'; cx.lineWidth=2.5;
      cx.beginPath(); cx.moveTo(1.5,13); cx.lineTo(1.5,-19); cx.stroke();
      // pole
      cx.strokeStyle='rgba(220,220,220,.9)'; cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(0,13); cx.lineTo(0,-19); cx.stroke();
      // flag shadow
      cx.fillStyle='rgba(0,0,0,.2)';
      cx.beginPath(); cx.moveTo(1,-18); cx.lineTo(side*15+1,-12); cx.lineTo(1,-6); cx.closePath(); cx.fill();
      // flag
      cx.fillStyle=colD;
      cx.beginPath(); cx.moveTo(0,-18); cx.lineTo(side*14,-12); cx.lineTo(0,-6); cx.closePath(); cx.fill();
      cx.fillStyle=col;
      cx.globalAlpha=0.85;
      cx.beginPath(); cx.moveTo(0,-17); cx.lineTo(side*12,-12); cx.lineTo(0,-7); cx.closePath(); cx.fill();
      cx.globalAlpha=1;
      // number
      if(!passed){ cx.fillStyle='rgba(0,0,0,.75)'; cx.font='bold 6px monospace'; cx.textAlign='center'; cx.fillText(i+1,side*6,-11); }
      // base
      cx.fillStyle='rgba(0,0,0,.35)'; cx.beginPath(); cx.ellipse(0,13,4,1.5,0,0,Math.PI*2); cx.fill();
      cx.restore();
    });
  });

  cx.restore();
}


// ─── RAMP DRAWING ─────────────────────────────────────────────────────────────
function drawRamps(cx,cam,SC){
  const ramps=TDEF&&TDEF.ramps?TDEF.ramps:[];
  if(!ramps.length)return;
  cx.save();
  cx.translate(CW/2-cam.x*SC, CH/2-cam.y*SC);
  cx.scale(SC,SC);
  for(const ramp of ramps){
    const i1=Math.floor(ramp.fr*TN), i2=Math.floor(ramp.to*TN);
    // Ramp surface (yellow-orange grating)
    cx.beginPath();
    cx.moveTo(TRK[i1].x,TRK[i1].y);
    for(let i=i1;i<=Math.min(i2,TN-1);i++) cx.lineTo(TRK[i].x,TRK[i].y);
    cx.strokeStyle='rgba(255,210,40,.55)'; cx.lineWidth=TW*2-8;
    cx.lineJoin='round'; cx.stroke();
    // Chevron arrows pointing forward
    const mid=Math.floor((i1+i2)/2);
    if(mid<TN-1){
      const t=TRK[mid],n=TRK[(mid+1)%TN];
      let dx=n.x-t.x,dy=n.y-t.y,ln=Math.sqrt(dx*dx+dy*dy)||1;dx/=ln;dy/=ln;
      const nx=-dy,ny=dx;
      cx.strokeStyle='rgba(255,150,0,.8)'; cx.lineWidth=5; cx.lineCap='round';
      for(let k=-1;k<=1;k++){
        const bx=t.x+nx*k*(TW*.5), by=t.y+ny*k*(TW*.5);
        cx.beginPath();
        cx.moveTo(bx-dx*10-nx*8, by-dy*10-ny*8);
        cx.lineTo(bx+dx*10, by+dy*10);
        cx.lineTo(bx-dx*10+nx*8, by-dy*10+ny*8);
        cx.stroke();
      }
    }
  }
  cx.restore();
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function drawHUD(cx, pl, cars, raceT) {
  if(!pl) return;
  const land=CW>CH, bH=land?48:54;
  cx.fillStyle='rgba(0,0,0,.52)'; cx.fillRect(0,0,CW,bH);

  // Position
  const sorted=[...cars].sort((a,b)=>b.total-a.total);
  const pos=sorted.indexOf(pl)+1, sfx=['ST','ND','RD'][pos-1]||'TH';
  cx.fillStyle='#ffee22'; cx.font='bold 22px monospace'; cx.textAlign='left';
  cx.fillText(pos+sfx, 12, land?34:36);

  // Game title + version (tiny)
  cx.fillStyle='rgba(255,200,60,.38)'; cx.font='bold 7px monospace';
  cx.fillText('DUST DEVILS RALLY '+VERSION, 12, 11);

  // Lap
  cx.fillStyle='#fff'; cx.font='bold 15px monospace'; cx.textAlign='center';
  const _laps=TDEF&&TDEF.laps?TDEF.laps:LAPS;
  cx.fillText('LAP '+Math.min(pl.lap+1,_laps)+'/'+_laps, CW/2, land?28:29);

  // Track name
  cx.fillStyle='rgba(255,220,100,.45)'; cx.font='9px monospace';
  cx.fillText(TDEF.name, CW/2, land?bH-3:bH-2);

  // Timer
  const m=Math.floor(raceT/60), s=String(Math.floor(raceT%60)).padStart(2,'0');
  const ms=String(Math.floor((raceT%1)*100)).padStart(2,'0');
  cx.fillStyle='#88ffaa'; cx.font='11px monospace';
  cx.fillText(m+':'+s+'.'+ms, CW/2, land?43:46);

  // Speed
  cx.textAlign='right'; cx.fillStyle='#8899ff'; cx.font='bold 13px monospace';
  cx.fillText(Math.round(pl.speed()), land?CW-110:CW-92, land?32:32);
  cx.fillStyle='#445566'; cx.font='8px monospace';
  cx.fillText('km/h', land?CW-110:CW-92, land?44:44);

  // Coins
  cx.textAlign='left'; cx.fillStyle='#ffdd22'; cx.font='bold 11px monospace';
  cx.fillText('$'+S.coins, 12, land?bH+16:72);

  // Checkpoint bar
  const cpW=76, cpH=5, cpX=CW/2-cpW/2, cpY=land?bH-8:bH-6;
  cx.fillStyle='rgba(0,0,0,.4)'; cx.fillRect(cpX,cpY,cpW,cpH);
  cx.fillStyle='rgba(40,220,80,.7)'; cx.fillRect(cpX,cpY,cpW*(pl.nextCP/4),cpH);
  for(let i=1;i<4;i++){cx.fillStyle='rgba(255,255,255,.3)';cx.fillRect(cpX+cpW*(i/4)-.5,cpY,1,cpH);}

  // NOS bar
  const nW=66, nH=7, nX=12, nY=land?38:60;
  cx.fillStyle='rgba(0,0,0,.4)'; cx.fillRect(nX,nY,nW,nH);
  cx.fillStyle=pl.nos>38?'#44aaff':'#ff5522'; cx.fillRect(nX,nY,nW*(pl.nos/100),nH);
  cx.strokeStyle='rgba(255,255,255,.2)'; cx.lineWidth=1; cx.strokeRect(nX,nY,nW,nH);
  cx.fillStyle='rgba(180,220,255,.45)'; cx.font='7px monospace'; cx.textAlign='left';
  cx.fillText('NOS', nX, nY-1);

  // Drift indicator
  if(pl.isDrifting){
    const combo=pl._combo||0;
    cx.fillStyle=combo>10?'#ffaa00':'rgba(255,170,0,.7)';
    cx.font='bold 11px monospace'; cx.textAlign='left';
    cx.fillText(combo>0?'DRIFT x'+Math.floor(combo):'DRIFT!', 85, land?bH+16:72);
  }

  // Off-track warning
  if(pl.off && Math.floor(Date.now()/220)%2){
    cx.fillStyle='rgba(255,90,0,.7)'; cx.font='bold 12px monospace'; cx.textAlign='center';
    cx.fillText('! OFF TRACK !', CW/2, land?bH+18:72);
  }
  // Exit/pause button top-right
  cx.fillStyle='rgba(0,0,0,.45)'; cx.beginPath(); cx.roundRect(CW-46,6,38,32,5); cx.fill();
  cx.strokeStyle='rgba(255,255,255,.25)'; cx.lineWidth=1; cx.stroke();
  cx.fillStyle='rgba(255,255,255,.7)'; cx.font='bold 13px monospace'; cx.textAlign='center';
  cx.fillText('✕', CW-27, 27);
}

// ─── TOUCH CONTROLS ───────────────────────────────────────────────────────────
function ctrlLayout(){
  const land=CW>CH;
  return land
    ? {lz:{x:0,y:0,w:CW*.24,h:CH}, rz:{x:CW*.76,y:0,w:CW*.24,h:CH},
       nos:{x:CW-64,y:CH-70,r:32},  brk:{x:CW-64,y:CH-142,r:26}}
    : {lz:{x:0,y:CH*.3,w:CW*.38,h:CH*.7}, rz:{x:CW*.62,y:CH*.3,w:CW*.38,h:CH*.7},
       nos:{x:CW/2,y:CH-55,r:32},   brk:{x:CW/2,y:CH-120,r:26}};
}
function drawCtrl(cx, ctrlL, ctrlR, ctrlN, ctrlB, pl, raceT) {
  const lay=ctrlLayout(), land=CW>CH, {lz,rz}=lay;
  cx.fillStyle=`rgba(255,255,255,${ctrlL?.07:.02})`; cx.fillRect(lz.x,lz.y,lz.w,lz.h);
  cx.fillStyle=`rgba(255,255,255,${ctrlR?.07:.02})`; cx.fillRect(rz.x,rz.y,rz.w,rz.h);

  const ly=land?CH*.62:lz.y+lz.h*.52;
  cx.strokeStyle=`rgba(255,255,255,${ctrlL?.82:.28})`; cx.lineWidth=2.5;
  cx.beginPath(); cx.moveTo(lz.x+lz.w*.5+18,ly-11); cx.lineTo(lz.x+lz.w*.5-18,ly); cx.lineTo(lz.x+lz.w*.5+18,ly+11); cx.stroke();
  const ry=land?CH*.62:rz.y+rz.h*.52;
  cx.strokeStyle=`rgba(255,255,255,${ctrlR?.82:.28})`;

// ─── VISUAL FX ────────────────────────────────────────────────────────────────
function drawSpeedLines(cx, sp, top) {
  const t=Math.max(0,(sp-240)/(top-240)); if(t<=0)return;
  cx.save();
  for(let i=0;i<Math.floor(t*16);i++){
    const ang=(i/16)*Math.PI*2+Date.now()*.0004;
    const r1=Math.min(CW,CH)*.28+Math.random()*Math.min(CW,CH)*.12;
    const r2=r1+t*65+Math.random()*35;
    cx.strokeStyle=`rgba(255,255,255,${t*.13})`; cx.lineWidth=.8+Math.random()*.7;
    cx.beginPath();
    cx.moveTo(CW/2+Math.cos(ang)*r1, CH/2+Math.sin(ang)*r1);
    cx.lineTo(CW/2+Math.cos(ang)*r2, CH/2+Math.sin(ang)*r2);
    cx.stroke();
  }
  cx.restore();
}

function drawVignette(cx) {
  const r=Math.sqrt(CW*CW+CH*CH)*.5;
  const g=cx.createRadialGradient(CW/2,CH/2,r*.22,CW/2,CH/2,r*.88);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,.52)');
  cx.fillStyle=g; cx.fillRect(0,0,CW,CH);
}

// ─── SCROLL STATE ─────────────────────────────────────────────────────────────
const scroll={
  garage:0, tracks:0,
  _startY:null, _startVal:0, _dragging:false, _screen:null
};
function scrollTouchStart(screen,touchY){
  scroll._screen=screen; scroll._startTouchY=touchY;
  scroll._startVal=scroll[screen]||0; scroll._dragging=false;
}
function scrollTouchMove(touchY){
  if(!scroll._screen)return;
  const dy=scroll._startTouchY-touchY;
  if(Math.abs(dy)>6)scroll._dragging=true;
  if(scroll._dragging)scroll[scroll._screen]=Math.max(0,scroll._startVal+dy);
}
function scrollTouchEnd(){scroll._screen=null;}
function isDragging(){return scroll._dragging;}

function drawTrackSelect(cx){
  cx.fillStyle='#0a0a12';cx.fillRect(0,0,CW,CH);
  // Header
  cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(0,0,CW,52);

  cx.textAlign='center';cx.fillStyle='#ffdd33';cx.font='bold 18px monospace';cx.fillText('SELECT TRACK',CW/2,33);
  if(!S.unlockedTracks)S.unlockedTracks=[0];

  const offY=52-scroll.tracks;

  cx.save();cx.beginPath();cx.rect(0,52,CW,CH-52);cx.clip();

  ALL_TRACKS.forEach((t,i)=>{

    const unlocked=S.unlockedTracks.includes(i),sel=(S.currentTrack||0)===i;
    const bt=S.bestTimes&&S.bestTimes[i];

    btn(cx,cx2,cy2,cW,cH,
      sel?'rgba(255,221,51,.15)':unlocked?'rgba(30,40,60,.9)':'rgba(10,10,20,.9)',
      sel?'#ffdd33':unlocked?'rgba(100,140,200,.4)':'rgba(255,255,255,.07)',sel?2:1);

    cx.save();clipCard(cx,cx2,cy2,cW,cH);
    const preH=Math.floor(cH*0.5);

    if(unlocked){
      // Gradient background for preview area
      const grad=cx.createLinearGradient(cx2,cy2,cx2,cy2+preH);
      grad.addColorStop(0,t.grass+'cc');grad.addColorStop(1,t.grass+'44');
      cx.fillStyle=grad;cx.fillRect(cx2,cy2,cW,preH);

      const mini=buildSpline(t.raw,6);
      let mnx=Infinity,mxx=-Infinity,mny=Infinity,myx=-Infinity;
      for(const p of mini){mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mny=Math.min(mny,p.y);myx=Math.max(myx,p.y);}
      const ms=Math.min((cW-16)/(mxx-mnx),(preH-12)/(myx-mny))*.88;
      const mox=cx2+cW/2-(mxx+mnx)/2*ms,moy=cy2+preH/2-(myx+mny)/2*ms;
      // Track shadow
      cx.beginPath();cx.moveTo(mox+mini[0].x*ms+2,moy+mini[0].y*ms+2);
      for(const p of mini)cx.lineTo(mox+p.x*ms+2,moy+p.y*ms+2);
      cx.closePath();cx.strokeStyle='rgba(0,0,0,.4)';cx.lineWidth=t.tw*ms*2+4;cx.lineJoin='round';cx.stroke();
      // Track
      cx.beginPath();cx.moveTo(mox+mini[0].x*ms,moy+mini[0].y*ms);
      for(const p of mini)cx.lineTo(mox+p.x*ms,moy+p.y*ms);
      cx.closePath();cx.strokeStyle=t.d1;cx.lineWidth=t.tw*ms*2;cx.stroke();
      cx.strokeStyle=t.d2;cx.lineWidth=t.tw*ms*1.4;cx.stroke();
    }else{
      const grad2=cx.createLinearGradient(cx2,cy2,cx2,cy2+preH);
      grad2.addColorStop(0,'#1a1a2a');grad2.addColorStop(1,'#0a0a14');
      cx.fillStyle=grad2;cx.fillRect(cx2,cy2,cW,preH);
      cx.fillStyle='rgba(255,255,255,.15)';cx.font=Math.floor(preH*.4)+'px monospace';
      cx.textAlign='center';cx.fillText('🔒',cx2+cW/2,cy2+preH*.68);
    }

    // Info area
    const infoY=cy2+preH;
    cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(cx2,infoY,cW,cH-preH);
    cx.textAlign='center';
    cx.fillStyle=unlocked?'#fff':'rgba(255,255,255,.3)';
    cx.font=`bold ${nameSize}px monospace`;cx.fillText(t.name,cx2+cW/2,infoY+nameSize+4);
    cx.fillStyle='rgba(255,255,255,.45)';cx.font=`${subSize}px monospace`;
    cx.fillText(t.sub,cx2+cW/2,infoY+nameSize+subSize+8);

    if(bt){
      const bm=Math.floor(bt/60),bs=String(Math.floor(bt%60)).padStart(2,'0'),bms=String(Math.floor((bt%1)*100)).padStart(2,'0');
      cx.fillStyle='#88ffaa';cx.font=`${subSize}px monospace`;
      cx.fillText('🏆 '+bm+':'+bs+'.'+bms,cx2+cW/2,infoY+nameSize+subSize*2+14);
    }else if(!unlocked&&i>0){
      cx.fillStyle='rgba(255,180,50,.6)';cx.font=`${subSize}px monospace`;
      cx.fillText('Complete track '+i,cx2+cW/2,infoY+nameSize+subSize*2+14);
    }

    const bY=cy2+cH-Math.max(22,Math.floor(cH*.14)),bH=Math.max(18,Math.floor(cH*.12));
    if(sel){
      btn(cx,cx2+6,bY,cW-12,bH,'rgba(255,220,50,.3)','#ffdd33');
      cx.fillStyle='#ffdd33';cx.font=`bold ${subSize}px monospace`;cx.textAlign='center';cx.fillText('✓ SELECTED',cx2+cW/2,bY+bH*.72);
      // Ghost toggle button above select button
      const _ghOn=S.ghostEnabled||false;

      cx.fillStyle=_ghOn?'#44ffaa':'rgba(180,180,180,.55)';
      cx.font=`${subSize}px monospace`;cx.textAlign='center';
      cx.fillText((_ghOn?'👻 GHOST ON':'👻 GHOST OFF'),cx2+cW/2,_ghY+bH*.7);
    }else if(unlocked){
      btn(cx,cx2+6,bY,cW-12,bH,'rgba(60,160,220,.25)','rgba(80,180,240,.5)');
      cx.fillStyle='#88ccff';cx.font=`bold ${subSize}px monospace`;cx.textAlign='center';cx.fillText('SELECT',cx2+cW/2,bY+bH*.72);
    }
    cx.restore();
  });

  cx.restore();
  // Scroll indicator
  if(maxScroll>0){
    const pct=scroll.tracks/maxScroll;
    const trackH=CH-52;
    const indH=Math.max(30,trackH*(trackH/totalH));
    cx.fillStyle='rgba(255,255,255,.15)';cx.fillRect(CW-6,52+(trackH-indH)*pct,4,indH);
  }
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────
let ctrlL=false, ctrlR=false, ctrlB=false, ctrlN=false, ctrlGas=false;
const AT={};

function updCtrl(){
  ctrlL=ctrlR=ctrlB=ctrlN=ctrlGas=false;
  const lay=ctrlLayout();
  for(const id in AT){
    const {x,y}=AT[id];
    if(Math.hypot(x-lay.nos.x,y-lay.nos.y)<lay.nos.r){ ctrlN=true; ctrlGas=true; continue; }
    if(Math.hypot(x-lay.brk.x,y-lay.brk.y)<lay.brk.r){ ctrlB=true; continue; }
    ctrlGas=true;
    if(x>=lay.lz.x&&x<lay.lz.x+lay.lz.w&&y>=lay.lz.y) ctrlL=true;
    if(x>=lay.rz.x&&x<lay.rz.x+lay.rz.w&&y>=lay.rz.y) ctrlR=true;
  }
}

// ─── RACE SETUP ──────────────────────────────────────────────────────────────
function setupRace(){
  const t0=TRK[0], t1=TRK[1];
  let dx=t1.x-t0.x, dy=t1.y-t0.y, ln=Math.sqrt(dx*dx+dy*dy)||1; dx/=ln; dy/=ln;
  const nx=-dy, ny=dx;
  const sa=Math.atan2(t1.x-t0.x,-(t1.y-t0.y));
  const pl=new Car(t0.x,t0.y,sa,S.selected,true);

  // AI scaled to player's car price tier
  const playerDef2=CAR_DEFS.find(c=>c.id===S.selected)||CAR_DEFS[0];
  const sorted2=[...CAR_DEFS.filter(c=>c.id!==S.selected)].sort((a,b)=>Math.abs(a.price-playerDef2.price)-Math.abs(b.price-playerDef2.price));
  const aiPool2=sorted2.slice(0,Math.min(8,sorted2.length)).sort(()=>Math.random()-.5);
  const aiSkill=[0.92,0.82,0.74,0.65];
  const ai=[];
  [[-1,1],[1,1],[-1,2],[1,2]].forEach(([s,row],i)=>{
    const aDef=aiPool2[i%aiPool2.length];
    const car=new Car(t0.x-dx*55*row+nx*28*s, t0.y-dy*55*row+ny*28*s, sa, aDef.id);
    car.aiI=(i+1)*6; car.aiM=aiSkill[i]+(Math.random()-.5)*.06; car.aiReact=0.8+i*0.15;
    ai.push(car);
  });

  return { pl, ai, cam:{x:t0.x,y:t0.y} };
}

function raceClick(mx,my){
  // Exit button top-right corner
  if(mx>=CW-46&&mx<=CW-8&&my>=6&&my<=38){
    stopEngine(); setScreech(false);
    state='menu';
  }
}
function startRace(){
  const g=setupRace();
  cars=[g.pl,...g.ai];
  cam=g.cam;
  parts=[]; driftPops=[];
  ghostData=null;
  if(S.ghostEnabled) fbLoadGhost(S.currentTrack||0);
  cdN=3; cdT=0; raceT=0;
  camRot=0; camShake=0; camSX=0; camSY=0;
  state='countdown';
  beep(440,.12);
}

function finishRace(){
  stopEngine(); setScreech(false);
  const sorted=[...cars].sort((a,b)=>b.total-a.total);
  const pos=sorted.indexOf(cars[0])+1;
  const base=[200,120,70][pos-1]||50;
  let earned=base;
  const sfx=['ST','ND','RD'][pos-1]||'TH';
  const m=Math.floor(raceT/60),s=String(Math.floor(raceT%60)).padStart(2,'0'),ms=String(Math.floor((raceT%1)*100)).padStart(2,'0');
  resReasons=[pos+sfx+' place – '+m+':'+s+'.'+ms, 'Base prize: $'+base];
  if(!cars[0].wentOff){ earned+=40; resReasons.push('Clean race bonus: +$40'); }
  if(raceT<110&&pos===1){ earned+=60; resReasons.push('Speed bonus: +$60'); }
  S.coins+=earned; resCoins=earned;

  // Track best time + unlock next
  const tid=S.currentTrack||0;
  if(!S.bestTimes[tid]||raceT<S.bestTimes[tid]) S.bestTimes[tid]=raceT;
  if(!S.unlockedTracks.includes(tid+1)&&tid+1<ALL_TRACKS.length){
    S.unlockedTracks.push(tid+1);
    resReasons.push('🏆 Unlocked: '+ALL_TRACKS[tid+1].name+'!');
    setTimeout(()=>{ beep(554,.1); setTimeout(()=>beep(659,.1),120); setTimeout(()=>beep(880,.25),240); },300);
  }

  const entry={name:S.name||'ANON',time:raceT,pos,car:S.selected,track:tid};
  S.scores.push(entry); S.scores.sort((a,b)=>a.time-b.time); S.scores=S.scores.slice(0,10);
  doSave(); fbSave(entry);
  // Upload ghost if personal best on this track
  const _tid=S.currentTrack||0;
  if(S.bestTimes[_tid]&&S.bestTimes[_tid]===raceT&&cars[0].ghostFrames.length>10){
    fbSaveGhost(_tid,cars[0].ghostFrames,raceT,entry.name,S.selected);
  }
  state='results';
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let lastT=0;
function loop(now){
  const dt=Math.min((now-lastT)/1000,0.05); lastT=now;
  const SC=getScale();
  G.clearRect(0,0,CW,CH);

  try {
    if(state==='menu'){
      drawMenu(G);

    } else if(state==='garage'){
      drawGarage(G);

    } else if(state==='tracks'){
      drawTrackSelect(G);

    } else if(state==='leaderboard'){
      drawTrack(G,{x:TRK[0].x,y:TRK[0].y},getScale(true));
      drawVignette(G);
      drawLeaderboard(G);

    } else if(state==='results'){
      drawResults(G,cam,getScale(true));

    } else {
      // countdown / racing
      if(state==='countdown'){
        cdT+=dt;
        if(cdT>=1){ cdT=0; cdN--; beep(cdN>0?440*Math.pow(1.25,3-cdN):880,cdN>0?.15:.3); if(cdN<=0) state='racing'; }
      } else if(state==='racing'){
        raceT+=dt;
        const pl=cars[0];
        for(const c of cars){
          const p=c.isP;
          c.update(dt, p?ctrlL:false, p?ctrlR:false, p?ctrlB:false, p?ctrlN:false, raceT);
        }
        doCollisions(cars);
        updParts(dt); updDriftPops(dt);
        if(Math.abs(pl.sp)>22&&Math.random()<0.3)
          addDust(pl.x,pl.y,pl.off?'#c08040':'#c8a878');
        updateEngine(pl.sp, pl.def.top);
        setScreech(pl.isDrifting&&!pl.off);
        // Camera look-ahead
        const la=90, tx=pl.x+Math.sin(pl.a)*la, ty=pl.y-Math.cos(pl.a)*la;
        cam.x+=(tx-cam.x)*.13; cam.y+=(ty-cam.y)*.13;
        // Shake decay
        camShake*=0.80; camSX=(Math.random()-.5)*camShake; camSY=(Math.random()-.5)*camShake;
        if(pl.lap>=(TDEF&&TDEF.laps?TDEF.laps:LAPS)) finishRace();
      }

      // World draw (with shake)
      G.save();
      G.translate(CW/2+camSX,CH/2+camSY); G.rotate(0); G.translate(-CW/2,-CH/2);
      drawTrack(G,cam,SC);
      drawRamps(G,cam,SC);
      drawParts(G,cam,SC);
      // Firebase ghost car (if enabled + loaded)
      if(ghostData&&ghostData.frames&&ghostData.frames.length>1){
        const _gf=ghostData.frames;
        const _gi=_gf.findIndex(f=>f.t>=raceT%(_gf[_gf.length-1].t||30));
        if(_gi>=0){
          const _gp=_gf[_gi];
          const _gDef=CAR_DEFS.find(d=>d.id===ghostData.car)||CAR_DEFS[0];
          cars[0].drawGhost.call({...cars[0],x:_gp.x,y:_gp.y,a:_gp.a,def:_gDef},G,cam,SC);
        }
      }
      [...cars].sort((a,b)=>a.y-b.y).forEach(c=>c.draw(G,cam,SC));
      G.restore();

      drawVignette(G);
      if(state==='racing') drawSpeedLines(G, cars[0].speed(), cars[0].def.top);
      if(state==='racing') drawDriftPops(G,cam,SC);
      // minimap hidden in full-track view
      drawHUD(G, cars[0], cars, raceT);
      drawCtrl(G, ctrlL, ctrlR, ctrlN, ctrlB, cars[0], raceT);

      if(state==='countdown'){
        G.fillStyle='rgba(0,0,0,.3)'; G.fillRect(0,0,CW,CH);
        G.textAlign='center'; G.fillStyle='#ffee00';
        G.font=`bold ${Math.min(CW,CH)*.18}px monospace`;
        G.shadowColor='#ff8800'; G.shadowBlur=20;
        G.fillText(cdN>0?String(cdN):'GO!', CW/2, CH*.52);
        G.shadowBlur=0;
      }
    }
  } catch(err){
    console.error('Loop error:', err);
    G.fillStyle='rgba(0,0,0,.8)'; G.fillRect(0,0,CW,CH);
    G.fillStyle='#ff4444'; G.font='14px monospace'; G.textAlign='center';
    G.fillText('Error: '+err.message, CW/2, CH/2);
    G.fillStyle='rgba(255,255,255,.5)'; G.font='11px monospace';
    G.fillText('Tap to return to menu', CW/2, CH/2+28);
    state='menu'; camRot=0; camShake=0;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{ lastT=t; requestAnimationFrame(loop); });

  </script></body></html>
